      "type": "preparation",
      "html": "<h3>Hazırlık Sorusu: Kutup Işıkları ve Yüklü Parçacıkların Hareketi</h3>\n<p>Güneş rüzgârı Dünya'nın manyetosferini etkiler. Manyetosferdeki bazı yüklü parçacıklar elektrik alanlar ve manyetik yeniden bağlanma gibi süreçlerle enerji kazanabilir. Bu parçacıkların bir bölümü Dünya'nın manyetik alanı boyunca yüksek enlemlere yönelir ve üst atmosferdeki atom ve moleküllerle çarpışarak kutup ışıklarının oluşmasına katkı sağlar.</p>\n<p>Statik manyetik alanın bir noktasal yük üzerindeki manyetik Lorentz kuvveti iş yapmaz ($W_B=0$). Buna göre parçacıkların kinetik enerjiyi hangi süreçlerde kazanabileceğini ve manyetik alanın parçacıkların hareket yönünü belirlemedeki rolünü açıklayınız.</p>"

    {
      "id": "curriculum-1-1",
      "heading": "KÖŞE TAŞI 1.1 — Mıknatıslar ve kutuplar",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 1.1 — Mıknatıslar ve kutuplar</h2><p>Manyetizma, doğal mıknatısların gözlenmesinden Oersted, Ampère, Faraday ve Maxwell’in alan fikrine uzanan bir gelişim çizgisi izler. Tarihsel deneyler, elektrik akımı ile manyetik etkinin birbirinden bağımsız olmadığını göstermiştir.</p><div class=\"answer-formula\">Alan kavramının gelişimi, kuvveti uzaktan açıklamak yerine her noktaya fiziksel bir durum atamayı sağlar.</div>\n<p>Her mıknatısın iki kutbu vardır; parçalama işlemi tek kutup üretmez. Mıknatıs dışındaki alan çizgileri N’den S’ye, içindeki çizgiler S’den N’ye yönelerek kapalı eğriler oluşturur.</p><div class=\"answer-formula\">Kutuplar arasındaki çekme ve itme, alanın yönü ve malzemenin mıknatıslanması birlikte düşünülerek açıklanır.</div>\n<p>Aynı tür kutuplar iter, zıt tür kutuplar çeker. Ancak yalnız çekilme gözlemek bir cismin kalıcı mıknatıs olduğunu kanıtlamaz; yumuşak demirde indüklenmiş mıknatıslanma da çekilme oluşturabilir.</p><div class=\"answer-formula\">Kalıcı mıknatısı belirlemede itme gözlemi daha ayırt edicidir.</div>\n<ul><li>Bir çubuk mıknatısın iki kutbu vardır; mıknatısı bölmek tek kutup oluşturmaz, daha küçük iki kutuplu mıknatıslar oluşturur.</li><li>Aynı kutuplar iter, zıt kutuplar çeker. Ancak yalnızca çekilme gözlemek kalıcı mıknatıs kanıtı değildir; ferromanyetik bir cisimde indüklenmiş mıknatıslanma çekilmeye yol açabilir.</li><li>Kesin ayırt edici gözlem, uygun koşullarda itmenin gözlenmesidir. Deney yorumunda gözlem ile çıkarımı birbirinden ayırınız.</li></ul>"
    },

      "heading": "Örnek 1.3",

      "html": "<h3>Örnek 1.3</h3>\n<p>Van Allen Kuşakları, Dünya'nın manyetik alanında hapsolmuş yüksek enerjili yüklü parçacıkların oluşturduğu iki toroidal bölgedir. Manyetik alan kutuplara doğru artarken, parçacıkların manyetik momenti ($\\mu = p_\\perp^2 / 2mB$) yaklaşık korunur. Dik kinetik enerji bileşeni artar ve parçacıklar &quot;manyetik ayna&quot; etkisiyle geri yansır. Bu süreçte parçacıklar Dünya çevresinde sürüklenme hareketi de yapar.</p>\n<p>Düzgün bir $\\vec{B}$ manyetik alanı ($\\otimes$ yönlü) içine, alana $\\theta$ açısı yapacak şekilde $v_0$ hızıyla bir $+q$ yükü fırlatılıyor. Yükün izleyeceği yörüngeyi tanımlayınız ve yörünge adımını (adım, $p$) bulunuz.</p>\n<hr />\n<p>Hız vektörü iki bileşene ayrılır:</p>\n<ol>\n<li><strong>$\\vec{B}$'ye paralel bileşen:</strong> $v_{\\parallel} = v_0 \\cos\\theta$. Manyetik kuvvet bu bileşene etki etmez ($\\sin 0^\\circ = 0$). Yük bu yönde <strong>sabit hızlı</strong> hareket eder.</li>\n<li><strong>$\\vec{B}$'ye dik bileşen:</strong> $v_{\\perp} = v_0 \\sin\\theta$. Bu bileşen düzgün dairesel hareket yapar: $r = \\frac{mv_0\\sin\\theta}{|q|B}$, $T = \\frac{2\\pi m}{|q|B}$.</li>\n</ol>\n<p><strong>Sonuç:</strong> Yörünge bir <strong>helisel yörünge (sarmal)</strong> şeklindedir. Bir tam turda $\\vec{B}$ yönünde ilerlenen mesafe (adım):\n$$p = v_{\\parallel} \\cdot T = \\frac{2\\pi m v_0 \\cos\\theta}{|q|B}$$</p>\n<p>$\\theta = 0^\\circ$ ise $p$ maksimum, $r = 0$ (düz çizgi); $\\theta = 90^\\circ$ ise $p = 0$, $r$ maksimum (düzlemsel çember). Van Allen kuşaklarındaki parçacıklar, manyetik alanın kutuplarda güçlenmesiyle &quot;manyetik şişe&quot; etkisine yakalanır ve iki yarımküre arasında salınır.</p>"
    },
    {
      "id": "b0023",
      "heading": "Örnek 1.4",
      "type": "example",
      "html": "<h3>Örnek 1.4</h3>\n<p>Buzdolabı mıknatısları, buzdolabının çelik kapısına yapışır. Ancak aynı mıknatıs, alüminyum folyoya yapışmaz. Bu durumun temel fiziksel nedenini, manyetik malzeme sınıflandırması üzerinden açıklayınız.</p>\n<hr />\n<p>Çelik <strong>ferromanyetik</strong> bir malzemedir; manyetik bölgeleri dış alanla kolayca hizalanır ve güçlü bir çekim kuvveti oluşturur. Alüminyum ferromanyetik değildir; zayıf paramanyetik davranır. Bu nedenle statik bir mıknatısla güçlü çekim oluşturmaz. Ancak mıknatıs veya alüminyum hareket ederse, girdap akımları nedeniyle belirgin manyetik frenleme etkileri ortaya çıkabilir.</p>"
    },

      "heading": "KÖŞE TAŞI 1.3 — Yerin manyetik alanı ve pusula",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 1.3 — Yerin manyetik alanı ve pusula</h2><p>Dünya’nın alanı yaklaşık bir dipol alanı gibi modellenebilir; yatay bileşen pusulanın yönünü, düşey bileşen inklinasyonu belirler. Coğrafi ve manyetik kuzey aynı doğrultuda olmayabilir.</p><div class=\"answer-formula\">Deklinasyon yatay sapma, inklinasyon alanın yatayla yaptığı açıdır.</div>\n<ul><li>Manyetik alan bir vektör büyüklüğüdür ve SI birimi tesladır ($\\mathrm{T}$). Küçük alanlar için mikrotesla ($\\mu\\mathrm{T}$) kullanılır.</li><li>Bir model kurulurken kaynak, gözlem noktası, yön, ölçek ve sınır koşulları açıkça belirtilmelidir. Pusula yönü nitel bilgi verir; prob veya sensör ölçümü büyüklük için nicel veri sağlar.</li><li>İdeal dipol modeli uzak bölgelerde yararlı olabilir; mıknatısın yakınında gerçek geometri, malzeme ve doyum etkileri önem kazanır.</li></ul>\n<p>Bu alt başlık, manyetizmanın temel kavramlarını fiziksel model ve ölçülebilir büyüklüklerle ilişkilendirir. Tanım, yön, birim ve geçerlilik koşulları birlikte değerlendirilmelidir.</p>"

      "heading": "Soru 1.14",
      "type": "extraordinary",
      "html": "<p><strong>Soru 1.14</strong>\nİki proton, birbirine paralel ve hız vektörlerine dik bir ayırma vektörüyle $v$ hızıyla hareket etmektedir. Aralarındaki mesafe $d$'dir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Düşük hız yaklaşımında ($v \\ll c$), protonlar arasındaki manyetik etkileşim kuvvetinin yönünü ve büyüklüğünü bulunuz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Eğer protonlar zıt yönde hareket ediyor olsaydı, manyetik kuvvet nasıl değişirdi?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Elektriksel itme kuvveti ile manyetik çekim kuvveti arasındaki oranı bulunuz ve $v \\to c$ limitinde bu oranın nasıl değiştiğini değerlendiriniz. ($c^2 = 1/\\mu_0\\epsilon_0$ ilişkisini kullanınız.)</div></div>"
    },
    {
      "id": "b0273",
      "heading": "Soru 1.15",
      "type": "extraordinary",
      "html": "<p><strong>Soru 1.15</strong></p>\n<p>Bir elektron, $B = 1$ T manyetik alanda dairesel yörüngede hareket etmektedir. Elektronun hızı $v = 0.9c$ olduğunda, klasik (klasik) yarıçap hesabı ile görelilik yarıçap hesabı arasındaki fark ne kadardır?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Fark yoktur.</div></div>\n<div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Görelilik yarıçap, klasik yarıçaptan $\\gamma \\approx 2.29$ kat büyüktür.</div></div>\n<div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Görelilik yarıçap, klasik yarıçaptan $\\gamma \\approx 2.29$ kat küçüktür.</div></div>\n<div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Görelilik yarıçap, klasik yarıçaptan 2 kat büyüktür.</div></div>\n<div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Hesaplanamaz.</div></div>"
    },
    {
      "id": "b0036",
      "heading": "ÖĞRENCİNİN ÇÖZECEĞİ SORULAR — ÖLÇME VE DEĞERLENDİRME",
      "type": "assessment-section",
      "html": "<h2>ÖLÇME VE DEĞERLENDİRME</h2>\n<p>Aşağıdaki sorular, bölümün çekirdek kavramlarını ve zenginleştirme uzantılarını bağımsız olarak değerlendirir.</p>"
    },
    {
      "id": "b0037",
      "heading": "Soru 1.16",
      "type": "assessment",
      "html": "<p><strong>Soru 1.16</strong>\nBir çubuk mıknatıs, Dünya'nın manyetik alanının yatay bileşeni dışında belirgin bir dış manyetik etkinin bulunmadığı bir yerde, düşey eksen etrafında serbestçe dönebilecek biçimde asılmıştır. Dengeye ulaştığında:</p>\n<p>I. Kuzey arayan ucu, yerel manyetik kuzey doğrultusuna yönelir; bu doğrultu deklinasyon nedeniyle coğrafi kuzeyle tam çakışmayabilir.\nII. Mıknatısın manyetik alan çizgileri kapalı döngüler oluşturur.\nIII. Mıknatısın geometrik merkezinde manyetik alan zorunlu olarak sıfırdır.</p>\n<p>Hangileri doğrudur?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Yalnız I</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Yalnız II</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">I ve II</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">II ve III</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">I, II ve III</div></div>"
    },
    {
      "id": "b0038",
      "heading": "Soru 1.17",
      "type": "assessment",
      "html": "<p><strong>Soru 1.17</strong>\nDünya'nın manyetik alanı hakkında aşağıdaki ifadelerden hangisi <strong>yanlıştır</strong>?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Pusulanın kuzey arayan ucu, bulunduğu yerde manyetik alanın yatay bileşeninin gösterdiği manyetik kuzey doğrultusuna yönelir.</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\"><strong>Manyetik deklinasyon</strong>, manyetik kuzey doğrultusu ile coğrafi kuzey doğrultusu arasındaki yatay açıdır.</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Dünya yüzeyindeki alan büyüklüğü konuma göre değişir ve genel olarak kutup bölgelerinde ekvator çevresinden daha büyüktür.</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Manyetik alan çizgileri Dünya yüzeyine her yerde diktir.</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Dünya'nın manyetik alanı zamanla değişir; manyetik kutupların konumları da sabit değildir.</div></div>"
    },
    {
      "id": "b0040",
      "heading": "Soru 1.18",
      "type": "assessment",
      "html": "<p><strong>Soru 1.18</strong>\nKalbin elektriksel etkinliği, çok sayıda hücresel iyon akımının uzaysal toplamından doğar. Göğüs dışından ölçülen manyetik alanı tek bir toplam akımla temsil etmek kaba bir yaklaşımdır. Yalnız yaklaşık büyüklük hesabı için etkin akım $I_{etkin}=25\\,\\mu\\mathrm{A}$ ve algılayıcı uzaklığı $r=10\\,\\mathrm{cm}$ alınsın.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Kaynağı uzun doğrusal iletken gibi modelleyerek\n$$B\\approx\\frac{\\mu_0 I_{etkin}}{2\\pi r}$$\nile alanın yaklaşık büyüklüğünü bulunuz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Sonucu Dünya'nın yaklaşık $5\\times10^{-5}\\,\\mathrm{T}$ büyüklüğündeki alanıyla karşılaştırınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Kalbin gerçek manyetik alanının kaynak geometrisi, akım dipolleri ve dokudaki hacim akımları nedeniyle bu tek-tel modelinden farklı olduğunu açıklayınız. Bu küçük biyomanyetik işaretlerin ölçümünde neden manyetik kalkanlama ve çok duyarlı algılayıcılar gerektiğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0041",
      "heading": "Soru 1.19",
      "type": "assessment",
      "html": "<p><strong>Soru 1.19</strong>\nGöçmen kuşlar ve deniz kaplumbağaları, Dünya'nın manyetik alanını bir \"pusula\" olarak kullanarak binlerce kilometre yol alırlar. Araştırmalar, bu canlıların sadece manyetik alanın büyüklüğünü veya Kuzey-Güney yönünü değil, manyetik alan çizgilerinin Dünya yüzeyine yaptığı <strong>eğim açısını (inklinasyon)</strong> de algılayabildiklerini göstermektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Manyetik alan çizgilerinin eğim açısı, ekvatordan kutuplara doğru giderken nasıl değişir?</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Manyetik inklinasyon algısı, kuşlara coğrafi enlem hakkında nasıl bilgi sağlayabilir?</div></div>"
    },
    {
      "id": "b0043",
      "heading": "Soru 1.20",
      "type": "assessment",
      "html": "<p><strong>Soru 1.20</strong>\nDünya'nın manyetik alanı, jeolojik zaman ölçeğinde yüzlerce kez kutup değiştirmiştir (manyetik inversiyon). Bu değişimler, okyanus tabanındaki bazalt kayalarda \"manyetik şeritler\" olarak kaydedilmiştir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Okyanus ortası sırtlarından yayılan yeni kabuğun, Dünya'nın manyetik alanını nasıl \"kayıt cihazı\" gibi kullandığını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu manyetik şeritler, levha tektoniği teorisinin en güçlü kanıtlarından biri olmuştur. Neden?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Manyetik inversiyon sürecinde alanın zayıflaması ve değişmesi, uydular ve elektrik şebekeleri için ne gibi etkiler doğurabilir? (Not: Bu etkiler, Güneş fırtınalarının etkileriyle doğrudan özdeş değildir.)</div></div>"
    },
    {
      "id": "b0048",
      "heading": "Soru 1.21",
      "type": "assessment",
      "html": "<p><strong>Soru 1.21</strong>\nBeyindeki eşzamanlı elektriksel etkinlik çok küçük manyetik alanlar oluşturur. Yaklaşık bir büyüklük hesabı için etkin akım $I=50\\,\\mathrm{nA}$, algılayıcıya uzaklık $r=3.0\\,\\mathrm{cm}$ ve kaynak geometrisi uzun doğrusal iletken olarak modellenmiştir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$B\\approx \\mu_0I/(2\\pi r)$ bağıntısıyla manyetik alanın yaklaşık büyüklüğünü bulunuz. Bu modelin gerçek beyin akımlarını yalnızca kaba biçimde temsil ettiğini belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu büyüklükteki alanların ölçülebilmesi için neden çok duyarlı manyetik alan algılayıcılarına, manyetik kalkanlamaya ve uygun sinyal işleme yöntemlerine gereksinim duyulduğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Manyetoensefalografi ile elektroensefalografiyi, kafa dokularının elektriksel iletkenlik özelliklerinin ölçülen işaretler üzerindeki etkisi bakımından karşılaştırınız.</div></div>"
    },
    {
      "id": "b0270",
      "heading": "Soru 1.22",
      "type": "assessment",
      "html": "<p><strong>Soru 1.22</strong></p>\n<p>Dünya'nın manyetik alanının büyüklüğü yaklaşık $50\\,\\mu\\mathrm{T}$ büyüklük düzeyinde olsun. $Na^+$ iyonunun kütlesini $m\\approx 3.82\\times10^{-26}\\,\\mathrm{kg}$ alınız. Aşağıdaki hesaplarda hızın manyetik alana dik olduğunu kabul ediniz.</p>\n<p></p><div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$v=1.0\\,\\mathrm{m/s}$ hızla hareket eden bir $Na^+$ iyonuna etkiyen maksimum manyetik kuvveti hesaplayınız. ($q=1.60\\times10^{-19}\\,\\mathrm{C}$)</p>\n<p></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu kuvveti iyonun ağırlığıyla karşılaştırınız. Yalnız bu karşılaştırmadan biyolojik etki hakkında kesin bir sonuç çıkarılamayacağını; sıvı ortamda elektriksel etkileşimler, çarpışmalar ve termal hareketin de belirleyici olduğunu açıklayınız.</p>\n<p></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">$3.0\\,\\mathrm{T}$ büyüklüğündeki bir MR alanı, $50\\,\\mu\\mathrm{T}$ alanın kaç katıdır? Aynı ideal geometrik koşulda manyetik kuvveti hesaplayınız.</p></div></div>"
    },
    {
      "id": "b0271",
      "heading": "Soru 1.23",
      "type": "assessment",
      "html": "<p><strong>Soru 1.23</strong></p>\n<p>İki özdeş çubuk mıknatıs, Kuzey kutupları birbirine bakacak şekilde, aralarında $d$ mesafe olacak şekilde yerleştirilmiştir. Mıknatısların tam orta noktasındaki manyetik alan için aşağıdakilerden hangisi doğrudur?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Alan, her iki mıknatısın alanlarının toplamıdır ve maksimumdur.</div></div>\n<div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Alan sıfırdır çünkü iki mıknatısın alanları zıt yönlüdür ve birbirini götürür.</div></div>\n<div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Alan, tek bir mıknatısın alanına eşittir.</div></div>\n<div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Alan sonsuzdur.</div></div>\n<div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Alan, mıknatısların dışına doğru yönlendirilmiştir.</div></div>"
    },
    {
      "id": "b0272",
      "heading": "Soru 1.24",
      "type": "assessment",
      "html": "<p><strong>Soru 1.24</strong>\nAşağıdaki ifadeleri değerlendiriniz. Her birinin doğru mu yanlış mı olduğunu belirtiniz ve gerekçelendiriniz.</p>\n<p>I. Aynı noktadaki manyetik alanın yönü tek olduğundan, manyetik alan çizgileri birbirini kesmez.\nII. Aynı çizim ölçeği ve gösterim kuralı kullanıldığında çizgilerin daha sık çizildiği bölgeler, alanın daha güçlü olduğunu nitel olarak gösterir.\nIII. Manyetik alan çizgileri kapalı eğriler oluşturur.\nIV. Bir noktadaki $\\vec B$ vektörü, o noktadan geçen alan çizgisine teğettir.\nV. Bir çizimde iki alan çizgisi arasında boşluk bulunması, o bölgede alanın kesinlikle sıfır olduğu anlamına gelir.</p>"
    },

      "heading": "İleri Düzey Soru 1.27",
      "type": "assessment",
      "html": "<p><strong>İleri Düzey Soru 1.27</strong> <span class=\"difficulty\">Orta</span> <span class=\"source-tag\">Kaynak temelli</span></p>Manyetik alan çizgilerinin sıklaştığı bir bölgede alan büyüklüğünün arttığını söylemek hangi anlamda nitel, hangi koşulda nicel bir iddiaya dönüşür?<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"

      "heading": "İleri Düzey Soru 1.28",
      "type": "assessment",
      "html": "<p><strong>İleri Düzey Soru 1.28</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">Kaynak temelli</span></p>Bir proton, düzgün manyetik alana hız vektörü alanla 30° açı yapacak biçimde giriyor. Yörüngenin yarıçapını, helis adımını ve periyotunu sembolik olarak çıkarınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"
    },
    {
      "id": "rev-1-06",
      "heading": "İleri Düzey Soru 1.29",
      "type": "assessment",
      "html": "<p><strong>İleri Düzey Soru 1.29</strong> <span class=\"difficulty\">Olimpiyat düzeyi</span> <span class=\"source-tag\">Kaynak temelli</span></p>İki farklı dipolün alanları bir bölgede eşit büyüklükte fakat zıt yönlüdür. Bu noktada B=0 olması, kuvvetin de sıfır olmasını zorunlu kılar mı? Alanın türevini kullanarak tartışınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"

    {
      "id": "rev-1-07",
      "heading": "İleri Düzey Soru 1.30",
      "type": "assessment",
      "html": "<p><strong>İleri Düzey Soru 1.30</strong> <span class=\"difficulty\">Veri analizi</span> <span class=\"source-tag\">Kaynak temelli</span></p>Telefon manyetometresinden alınan Bx–By verileri elips oluşturuyor. Sert demir etkisi, ofset ve eksen ölçek hatalarını ayırmak için en az üç yönelim içeren kalibrasyon modeli öneriniz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"

      "heading": "İleri Düzey Soru 1.31",
      "type": "assessment",
      "html": "<p><strong>İleri Düzey Soru 1.31</strong> <span class=\"difficulty\">Model eleştirisi</span> <span class=\"source-tag\">Kaynak temelli</span></p>“Alan çizgileri gerçektir ve parçacıklar bu çizgileri izler.” ifadesini alan modeli, kuvvet yasası ve deneysel gözlenebilirlik açısından eleştiriniz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"

      "heading": "Olimpiyat Sorusu 1.34",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 1.34</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">Irodov / Krotov tarzı</span></p>Bir elektron, hız seçici içindeki birbirine dik <em>E</em> ve <em>B</em> alanlarından sapmadan geçmektedir. Alanlardan biri %2 artırıldığında parçacığın ilk sapma yönünü ve küçük sapma rejimindeki yarıçap değişimini belirleyiniz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Lorentz kuvvetinde vektör yönü ve birinci mertebe duyarlılık analizi.</div></div>"
    },
    {
      "id": "olymp-1-04",
      "heading": "Olimpiyat Sorusu 1.35",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 1.35</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">TÜBİTAK 2204-A / IPhO deneysel tarzı</span></p>Bir laboratuvarda Dünya’nın yatay manyetik alanı üç farklı doğrultuda pusula ile, büyüklüğü ise telefon manyetometresiyle ölçülüyor. Manyetometre sıfır ofseti içeriyorsa gerçek alan vektörünü nasıl yeniden kurarsınız? Kalibrasyon için en az iki bağımsız kontrol öneriniz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Vektör bileşenleri, ofset düzeltmesi, tekrar ölçümü ve belirsizlik yayılımı.</div></div>"
    },
    {
      "id": "olymp-1-05",
      "heading": "Olimpiyat Sorusu 1.36",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 1.36</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">Griffiths / MIT OCW tarzı</span></p>Uzun bir solenoidin iç alanını <em>B=μ₀nI</em> ile modellemek isteniyor. Sarım yoğunluğu uçlara yaklaştıkça değiştiğinde bu bağıntı hangi bölgede kullanılabilir? Ölçülen alanın eksen boyunca değişimini, Ampère yasası ve sonlu uzunluk etkisiyle açıklayınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Simetri varsayımını ve ideal uzun solenoid yaklaşımının sınırını değerlendirmek.</div></div>"
    },

      "id": "b0052",
      "heading": "BÖLÜM 2 — MANYETİK ALANIN KAYNAKLARI",
      "type": "chapter",
      "html": "<h1>BÖLÜM 2 — MANYETİK ALANIN KAYNAKLARI</h1><p>Akım dağılımlarının oluşturduğu manyetik alanı simetri ve integral yasalarıyla modeller. Bu bölüm, hazırlık sorusundan örneklere ve öğrencinin çözümüne doğru kademeli olarak ilerler.</p>"

    {
      "id": "b0054",
      "heading": "Hazırlık Sorusu: Yıldızları Yeryüzüne İndirmek — ITER ve Tokamak",
      "type": "preparation",
      "html": "<h3>Hazırlık Sorusu: Tokamaklarda Manyetik Alanla Plazma Denetimi</h3>\n<p>Tokamaklarda plazma, halka biçimli bir bölgede güçlü manyetik alanlarla tutulmaya çalışılır. Çevresel manyetik alan torusun iç tarafında daha güçlü, dış tarafında daha zayıftır. Alanın bu uzaysal değişimi ve alan çizgilerinin eğriliği yüklü parçacıkların ortalama hareketinde sürüklenmelere yol açabilir. Ek bobinlerle kesit yönünde bir alan oluşturulduğunda toplam alan çizgileri sarmal biçim alır.</p>\n<ol>\n<li>Alan büyüklüğünün uzayda değişmesinin ve alan çizgilerinin eğriliğinin iyonlar ile elektronların ortalama hareketini neden farklı yönlerde etkileyebileceğini açıklayınız.</li>\n<li>Zıt yüklü parçacıkların farklı sürüklenmelerinin yük ayrışmasına ve elektrik alan oluşumuna nasıl yol açabileceğini açıklayınız.</li>\n<li>Sarmal alan çizgilerinin parçacıkların torusun iç ve dış bölgelerini sırayla örneklemesine nasıl katkı sağlayabileceğini değerlendiriniz.</li>\n</ol>\n<p>Bu soru, temel programın üzerinde plazma fiziği kavramları içeren bir zenginleştirme çalışmasıdır.</p>"
    },
    {
      "id": "curriculum-2-1",
      "heading": "KÖŞE TAŞI 2.1 — Tel ve halka akımlarının alanı",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 2.1 — Tel ve halka akımlarının alanı</h2><p>Uzun düz telin çevresindeki alan çizgileri tel merkezli çemberlerdir. B=μ₀I/(2πr) bağıntısında alan akımla artar, uzaklıkla azalır.</p><div class=\"answer-formula\">Yön, başparmak akımı gösterecek şekilde sağ elin kıvrılan parmaklarıyla bulunur.</div>\n<p>Dairesel akım halkasının merkezinde alan B=μ₀I/(2R), ekseninde ise B=μ₀IR²/[2(R²+x²)^(3/2)] ile modellenir.</p><div class=\"answer-formula\">Merkezde simetri alan yönünü belirler; eksen boyunca uzaklaştıkça alan zayıflar.</div><p>Toroidde alan, ideal yaklaşımda sarımların bulunduğu bölgede dolaşımsal yöndedir; iç yarıçapta daha büyük olabilir. Gerçek geometride alanın uzaysal değişimi dikkate alınır.</p>"
    },
    {
      "id": "curriculum-support-2-example",
      "heading": "Örnek 2.1 — Temel model",
      "type": "example",
      "html": "<h3>Örnek 2.1 — Temel model — Temel model</h3><p>Uzun tel, halka, solenoid ve toroid için alanın yönü simetri ve sağ el kurallarıyla belirlenir.</p><p>Bir düzenekte alan, kuvvet veya akı değişimi inceleniyor. Önce sistemi şemalaştırınız; bilinenleri SI birimleriyle yazıp uygun fizik yasasını seçiniz.</p><div class=\"answer-formula\">Model → bağıntı → birim kontrolü → fiziksel yorum</div>"
    },

      "heading": "Örnek 2.2",
      "type": "example",

n$$B(r)=0.$$</p>\n<p>Gerçek kablolarda sonlu uzunluk, ekran süreksizlikleri, konektörler, deri etkisi ve ortak-mod akımları nedeniyle dış alan tam olarak sıfır olmayabilir.</p>"

      "id": "b0059",
      "heading": "Soru 2.2",
      "type": "yourturn",
      "html": "<p><strong>Soru 2.2</strong>\nYarıçapı $R$ olan sonsuz uzunlukta silindirik bir iletken tel, kesitine homojen dağılmış bir $I$ akımı taşımaktadır. Telin merkezinden $r$ uzaklığındaki manyetik alanın büyüklüğünü gösteren $B(r)$ grafiği aşağıdakilerden hangisidir?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">$r=0$'dan $R$'ye kadar düz bir çizgi (sabit), $R$'den sonra $1/r$ gibi azalan.</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">$r=0$'dan $R$'ye kadar $r$ ile doğru orantılı artan, $R$'den sonra $1/r$ ile azalan.</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">$r=0$'da maksimum, $R$'ye kadar $1/r$ gibi azalan, $R$'den sonra $1/r^2$ ile azalan.</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">$r=0$'dan $R$'ye kadar $r^2$ ile artan (parabol), $R$'den sonra sabit kalan.</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">$r=0$'da sıfır, $R$'ye kadar doğrusal artan, $R$'den sonra doğrusal azalan.</div></div>"

      "heading": "Örnek 2.3",
      "type": "example",
      "html": "<h3>Örnek 2.3</h3>\n<p>Aralarında $d$ uzaklık bulunan iki uzun paralel tel aynı yönde akım taşımaktadır. Birinci telde $I$, ikinci telde $2I$ akımı vardır. İki tel arasındaki doğru üzerinde net manyetik alanın sıfır olduğu noktanın konumunu bulunuz.</p>\n<hr />\n<p>İki tel arasındaki bölgede alan yönleri zıttır. Sıfır alan için büyüklükleri eşitlenir. Noktanın $I$ akımlı telden uzaklığı $x$ olsun:\n$$\\frac{\\mu_0 I}{2\\pi x}=\\frac{\\mu_0(2I)}{2\\pi(d-x)}.$$\nOrtak çarpanlar sadeleşir:\n$$\\frac{1}{x}=\\frac{2}{d-x}\\quad\\Rightarrow\\quad d-x=2x,$$\n$$\\boxed{x=\\frac d3}.$$</p>\n<p>Sıfır alan noktası daha küçük akımlı tele daha yakındır. Bu örnekte asıl araç formül ezberi değil, <strong>alan yönünü belirleme + vektörel süperpozisyon + büyüklük eşitleme</strong> sırasıdır.</p>"
    },
    {
      "id": "b0062",
      "heading": "Soru 2.3",
      "type": "yourturn",
      "html": "<p><strong>Soru 2.3</strong>\nİki paralel sonsuz tel, aralarındaki mesafe $d$ olacak şekilde yerleştirilmiştir. Birinci tel $I_1$, ikinci tel $I_2$ akımı taşımaktadır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Akımlar aynı yönde ise, teller arasındaki kuvvetin çekim mi yoksa itme mi olduğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Akımlar zıt yönde ise durum nasıl değişir?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Birinci telin manyetik alanının, ikinci tel üzerindeki kuvveti oluşturduğunu gösteriniz. ($F/L = \\frac{\\mu_0 I_1 I_2}{2\\pi d}$)</div></div><div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Newton'un 3. yasası bu durumda sağlanıyor mu? Fiziksel argümanlarla gerekçelendiriniz.</div></div>"
    },
    {
      "id": "b0064",
      "heading": "Örnek 2.4",
      "type": "example",
      "html": "<h3>Örnek 2.4</h3>\n<p>Yarıçapı $R$ olan ince bir tel halkadan $I$ akımı geçirilmektedir. Halka ekseni üzerinde, merkezden $x$ kadar uzaklıktaki bir noktada manyetik alanın $B_x = \\frac{\\mu_0 I R^2}{2(R^2 + x^2)^{3/2}}$ olduğu bilinmektedir.</p>\n<p>Bu bağıntıyı kullanarak, $n$ birim uzunluk başına sarım sayısı olan ve $L$ uzunluğundaki <strong>sonlu bir solenoidin</strong> tam merkezindeki manyetik alanı türetiniz. Sonuç, $L \\to \\infty$ limitinde beklenen $\\mu_0 n I$ sonucunu veriyor mu kontrol ediniz.</p>\n<p><em>Varsayımlar: Sarımların yarıçapı sabittir, sarımlar düzgün aralıklıdır, kenar etkileri modelin içinde sonlu uzunluk nedeniyle hesaba katılır, sarım yoğunluğu $n = N/L$'dir.</em></p>\n<hr />\n<p>Solenoidi, her biri $dx$ kalınlığında, $n \\cdot dx$ sayıda sarım içeren sonsuz sayıda ince halka olarak düşünebiliriz.</p>\n<p>Bir ince halkanın merkezdeki katkısı: $dB = \\frac{\\mu_0 (I \\cdot n , dx) R^2}{2(R^2 + x^2)^{3/2}}$</p>\n<p>Tüm solenoidi toplamak için $x = -L/2$'den $x = L/2$'ye integral alırız:\n$$B = \\int_{-L/2}^{L/2} \\frac{\\mu_0 n I R^2}{2(R^2 + x^2)^{3/2}} dx = \\frac{\\mu_0 n I}{2} \\left[ \\frac{x}{\\sqrt{R^2 + x^2}} \\right]_{-L/2}^{L/2}$$</p>\n<p>$$B = \\mu_0 n I \\frac{L}{\\sqrt{4R^2 + L^2}}$$</p>\n<p><em>Limit Kontrolü:</em> Eğer solenoid çok uzunsa ($L \\gg R$), paydadaki $4R^2$ ihmal edilebilir.\n$$\\lim_{L \\to \\infty} B = \\mu_0 n I \\frac{L}{\\sqrt{L^2}} = \\mu_0 n I$$</p>\n<p>Biot-Savart'tan türetilen ince halka formülü, entegrasyon (süperpozisyon) yoluyla makroskobik bir cisme (solenoid) başarıyla uyarlandı.</p>"
    },
    {
      "id": "b0066",
      "heading": "Soru 2.4",
      "type": "yourturn",
      "html": "<p><strong>Soru 2.4</strong>\nYarıçapı $R$ olan bir çember üzerine köşeleri yerleştirilmiş düzgün bir $N$-gen tel çerçeveden $I$ akımı geçirilmektedir. Böylece $N$ değişirken çerçevenin <strong>çevrel çember yarıçapı $R$ sabit</strong> kalır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bir kenarın uzunluğunun $s_N=2R\\sin(\\pi/N)$ ve merkeze dik uzaklığının $d=R\\cos(\\pi/N)$ olduğunu kullanarak merkezin manyetik alanını türetiniz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Sonucun\n$$B_N=\\frac{\\mu_0 I}{2\\pi R},N\\tan\\left(\\frac{\\pi}{N}\\right)$$\nbiçimine geldiğini gösteriniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">$N\\to\\infty$ limitinde $N\\tan(\\pi/N)\\to\\pi$ olduğundan dairesel halkanın $B=\\mu_0 I/(2R)$ sonucunu elde ediniz.</div></div>"
    },
    {
      "id": "b0068",
      "heading": "Örnek 2.5",
      "type": "example",
      "html": "<h3>Örnek 2.5</h3>\n<p>Yarıçapı $R$, uzunluğu $L=4R$ olan hava çekirdekli bir solenoidin merkez alanı\n$$B_{sonlu}=\\mu_0nI\\frac{L}{\\sqrt{4R^2+L^2}}$$\nile veriliyor. İdeal sonsuz solenoid yaklaşımının $B_{ideal}=\\mu_0nI$ sonucuna göre bağıl alan oranını bulunuz ve farkı yorumlayınız.</p>\n<hr />\n<p>$$\\frac{B_{sonlu}}{B_{ideal}}=\\frac{4R}{\\sqrt{4R^2+16R^2}}\n=\\frac{4}{\\sqrt{20}}\\approx0.894.$$\nDolayısıyla sonlu solenoidin merkez alanı, bu geometri için ideal sonsuz-solenoid değerinin yaklaşık %89.4'üdür.</p>\n<p>$L/R$ oranı büyüdükçe ideal model daha iyi çalışır. Bu örnek, bir formülü kullanmaktan çok <strong>modelin ne kadar iyi olduğunu nicel olarak sınama</strong> becerisini hedefler.</p>"
    },
    {
      "id": "curriculum-2-4",
      "heading": "KÖŞE TAŞI 2.2 — Solenoid ve toroid",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 2.2 — Solenoid ve toroid</h2><p>Uzun solenoidin iç alanı yaklaşık B=μ₀nI’dir. Burada n birim uzunluktaki sarım sayısıdır; ideal modelde iç alan düzgün, dış alan küçüktür.</p><div class=\"answer-formula\">Sarım yönü alanın eksen yönünü sağ el kuralıyla belirler.</div>\n<p><strong>İDEAL SOLENOİD</strong>\nÇok uzun, sık sarımlı hava çekirdekli solenoid için:\n$$B\\simeq\\mu_0 nI.$$\nDış alan ideal sonsuz modelde sıfırdır; gerçek sonlu bobinde <strong>saçak alan</strong> vardır.</p>\n<p><strong>ÇEKİRDEK</strong>\nDoğrusal ve doygunluktan uzak basit bir yaklaşımda $\\mu_0$ yerine $\\mu=\\mu_0\\mu_r$ kullanılabilir; gerçek ferromanyetik çekirdeklerde $\\mu_r$ sabit olmak zorunda değildir.</p>\n<p><strong>MÜHENDİSLİK SINIRLARI</strong></p>\n<ul>\n<li>Bakır kaybı: $P=I^2R$.</li>\n<li>Daha çok sarım alanı artırabilir; fakat tel uzunluğunu, direnci ve endüktansı da artırır.</li>\n<li>MR gibi sistemlerde <strong>ana alan homojenliği</strong> ile bilinçli oluşturulan <strong>gradyan alanları</strong> farklı tasarım hedefleridir.</li>\n</ul>\n<p>&quot;$B=\\mu_0nI$&quot; bir tasarım yasası değil, belirli ideal varsayımlar altında bir modeldir.</p>\n<p>Toroid içinde Ampère yasası B=μ₀NI/(2πr) sonucunu verir. İdeal toroid dışında alan, simetri ve sarımların net etkisi nedeniyle yaklaşık sıfırdır.</p><div class=\"answer-formula\">Alan yalnızca kapalı Amper çevresinin sardığı akıma bağlıdır.</div>"
    },

    {
      "id": "curriculum-2-6",
      "heading": "KÖŞE TAŞI 2.3 — Sonlu iletkenler, Biot–Savart ve Ampère yasası",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 2.3 — Sonlu iletkenler, Biot–Savart ve Ampère yasası</h2><p>Biot–Savart yasası, küçük akım elemanlarının alan katkılarını toplar:</p><p>$$d\\vec B=\\frac{\\mu_0 I}{4\\pi}\\frac{d\\vec\\ell\\times\\hat r}{r^2}.$$</p><p>Sonlu tel ve karmaşık geometrilerde integral sınırları ile vektörel yön belirleyicidir. Yüksek simetrili durağan akım düzenlerinde Ampère yasası</p><p>$$\\oint\\vec B\\cdot d\\vec\\ell=\\mu_0 I_{\\text{iç}}$$</p><p>biçiminde kullanılır; <span>$B$</span> yalnızca seçilen yol boyunca yeterli simetri varsa integral dışına alınabilir.</p><p>Silindirik iletken içinde düzgün akım yoğunluğu için <span>$J=I/(\\pi R^2)$</span> ve <span>$B(2\\pi r)=\\mu_0 I_{\\text{iç}}$</span> bağıntıları uygulanır.</p>"
    },

CIAAAAAAAA3/n/6Mf+FYpH5BYAAAAASUVORK5CYII=\" style=\"max-width:68%;height:auto\"/><figcaption>Şekil 2.2 - İki özdeş bobinin ortak eksenli yerleşimi.</figcaption></figure>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Düzenek simetrik olduğundan <strong>toplam alanın</strong> $B_{top}(x)$ bir çift fonksiyon olduğunu ve bu nedenle $B'_{top}(0)=0$ olduğunu açıklayınız. Neden bu sonuç tek bir bobinin ayrı alanı için geçerli değildir?</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Merkez çevresinde Taylor açılımı\n$$B_{top}(x)=B_{top}(0)+\\frac{1}{2}B''_{top}(0)x^2+\\frac{1}{4!}B^{(4)}_{top}(0)x^4+\\cdots$$\nşeklindedir. Yaklaşık düzgün alan için neden $B''_{top}(0)=0$ koşulunun ayrıca isteneceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Tek bobinin eksen alanı\n$$B_{tek}(x)=\\frac{\\mu_0IR^2}{2(R^2+x^2)^{3/2}}$$\nolduğuna göre iki bobini $x=\\pm d/2$ konumlarına yerleştirip $B_{top}(x)$'i yazınız. $B''_{top}(0)=0$ koşulundan $d/R$ oranını türetiniz. Ardından $d$ bu değerden küçük ve büyük seçildiğinde merkezdeki alan profilinin eğriliğinin nasıl değişeceğini nitel olarak çiziniz.</div></div>"
    },
    {
      "id": "b0075",
      "heading": "İLERİ DÜZEY SORULAR",
      "type": "extra-section",
      "html": "<h2>İLERİ DÜZEY SORULAR</h2>"
    },
    {
      "id": "b0076",
      "heading": "Soru 2.10",
      "type": "extraordinary",
      "html": "<p><strong>Soru 2.10</strong>\nYarıçapı $R$ olan yalıtkan bir disk, yüzeyine homojen dağılmış $\\sigma$ yüzey yük yoğunluğuna sahiptir. Disk, ekseni etrafında $\\omega$ açısal hızıyla döndürülmektedir.</p>\n<p><strong>Soru:</strong> Diskin merkezindeki manyetik alanı, Biot-Savart yasasını entegrasyon yoluyla kullanarak türetiniz.</p>\n<p><em>($r$ ile $r+dr$ arasındaki halkanın akımı $dI = \\sigma \\omega r , dr$. Merkezdeki alan $dB = \\frac{\\mu_0 , dI}{2r}$. $\\sigma$'nın işareti, $\\omega$'nın yönü ve alanın yönü sağ el kuralıyla belirtilmelidir. İntegral sınırlarını $0$ ile $R$ arasında kurunuz.)</em></p>"
    },
    {
      "id": "b0078",
      "heading": "Soru 2.11",
      "type": "extraordinary",
      "html": "<p><strong>Soru 2.11</strong>\nYarıçapı $R$ olan, merkez açısı $\\phi$ radyanlık dairesel bir tel yayından $I$ akımı geçmektedir. Yayın uçlarına bağlanan doğrusal iletken parçaları merkezden geçen radyal doğrultular boyunca dışarı uzanmaktadır; bu nedenle bu doğrusal parçalar için merkez noktasında $d\\vec\\ell\\parallel\\hat r$ olur.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Yayın merkezde oluşturduğu alanın\n$$B_{yay}=\\frac{\\mu_0 I\\phi}{4\\pi R}$$\nolduğunu Biot-Savart yasasından türetiniz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">$\\phi=\\pi$ için yarım daire sonucunu bulunuz ve tam çember alanıyla karşılaştırınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Radyal doğrusal parçaların merkezde neden manyetik alan katkısı yapmadığını $d\\vec\\ell\\times\\hat r$ üzerinden açıklayınız.</div></div>"
    },
    {
      "id": "b0285",
      "heading": "Soru 2.12",
      "type": "extraordinary",
      "html": "<p><strong>Soru 2.12</strong></p>\n<p>Üç fazlı dengeli bir sistemde birbirine paralel üç iletken eşkenar üçgenin köşelerinde yer alıyor ve akımlar</p>\n<div>$$I_1=I_0\\sin\\omega t,\\quad I_2=I_0\\sin(\\omega t-120^\\circ),\\quad I_3=I_0\\sin(\\omega t+120^\\circ)$$</div>\n<p>şeklinde değişiyor.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Her anda $I_1+I_2+I_3=0$ olduğunu gösteriniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">“Akımların toplamı sıfırsa her noktadaki manyetik alan da sıfırdır.” çıkarımının neden yanlış olduğunu açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">İletkenler aynı uzaklıkta olduğunda üçgen merkezindeki alan vektörlerinin yönlerinin farklı olmasını dikkate alarak, merkezde zamana bağlı dönen bir net alanın oluşabileceğini gösteriniz veya nitel olarak açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Kompakt ve dengeli üç faz geometrisinin uzak bölgelerdeki alanı, aynı toplam akımı tek bir gidiş-dönüş geometrisinden farklı biçimde nasıl etkileyebileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0289",
      "heading": "Soru 2.13",
      "type": "extraordinary",
      "html": "<p><strong>Soru 2.13</strong></p>\n<p>$L = 20$ cm uzunluğunda düz bir tel parçasından $I = 10$ A akım geçmektedir. Telin orta noktasından $d = 5$ cm dik uzaklıktaki manyetik alanın büyüklüğü, sonsuz tel formülünden ne kadar farklıdır?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Sonsuz tel formülüyle aynıdır.</div></div>\n<div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Sonsuz tel formülünden yaklaşık %10 küçüktür.</div></div>\n<div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Sonsuz tel formülünden yaklaşık %50 küçüktür.</div></div>\n<div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Sonsuz tel formülünden yaklaşık %90 küçüktür.</div></div>\n<div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Sıfırdır.</div></div>"
    },
    {
      "id": "b0080",
      "heading": "ÖLÇME VE DEĞERLENDİRME",
      "type": "assessment-section",
      "html": "<h2>ÖLÇME VE DEĞERLENDİRME</h2>\n<p>Aşağıdaki sorular, bölümün çekirdek kavramlarını ve zenginleştirme uzantılarını bağımsız olarak değerlendirir.</p>"
    },
    {
      "id": "curriculum-2-9",
      "heading": "KÖŞE TAŞI 2.4 — Simetri, süperpozisyon ve uzaklık bağımlılığı",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 2.4 — Simetri, süperpozisyon ve uzaklık bağımlılığı</h2><p>Manyetik alan vektörel bir büyüklüktür; toplam alan, tüm kaynakların alanlarının vektörel toplamıdır.</p><div class=\"answer-formula\">Simetrik düzeneklerde zıt yönlü katkılar yok olabilir, aynı yönlü katkılar güçlenebilir.</div>\n<p>Birden fazla kaynağın oluşturduğu toplam manyetik alan\n$$\\vec B_{\\mathrm{net}}=\\sum_i\\vec B_i$$\nile bulunur. Toplama vektörel yapılır.</p>\n<p>Sonlu düz tel için, tel ekseni $x$ ve gözlem noktasının tele dik uzaklığı $d$ seçildiğinde Biot-Savart integrali uygun geometride\n$$dB=\\frac{\\mu_0I}{4\\pi}\\frac{d\\,dx}{(x^2+d^2)^{3/2}}$$\nbiçimine indirgenebilir. Uç noktalar integral sınırlarını belirler.</p>\n<p>Yarıçapı $R$ olan bir akım halkasının eksenindeki alan\n$$B(x)=\\frac{\\mu_0IR^2}{2(R^2+x^2)^{3/2}}$$\nşeklindedir. Birden fazla bobinde toplam alan süperpozisyonla bulunur.</p>\n<p>Simetrik iki bobinli bir düzende merkezde $B'(0)=0$ koşulu simetriden doğar. Merkez çevresinde daha geniş bir yaklaşık düzgün alan bölgesi elde etmek için\n$$B(x)=B(0)+\\frac12B''(0)x^2+\\cdots$$\naçılımındaki düşük dereceli değişim terimleri incelenebilir.</p>\n<p>Bir türetim sonunda elde edilen bağıntının, uygun sınır durumlarında bilinen sonuçlara yaklaşması beklenir.</p>\n<p>Alan büyüklüğünün uzaklıkla değişimi geometrinin ve kaynak modelinin sonucudur. Uzun telde 1/r, dipol uzak alanında yaklaşık 1/r³ davranışı görülür.</p><div class=\"answer-formula\">Üs değeri, alan çizgilerinin uzayda nasıl yayıldığına ilişkin ölçülebilir bir imzadır.</div>"
    },
    {
      "id": "b0081",
      "heading": "Soru 2.14",
      "type": "assessment",
      "html": "<p><strong>Soru 2.14</strong>\nİki paralel sonsuz tel, aynı yönde $I$ akımı taşımaktadır. Teller arasındaki kuvvet:</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">İtme, çünkü akımlar aynı yönde.</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Çekim, çünkü her tel diğerinin manyetik alanında bir kuvvet hisseder.</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Sıfır, çünkü manyetik alanlar birbirini götürür.</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">İtme, çünkü akımlar aynı yüke sahiptir.</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Belirlenemez, çünkü tellerin mesafesi bilinmiyor.</div></div>"
    },
    {
      "id": "b0082",
      "heading": "Soru 2.15",
      "type": "assessment",
      "html": "<p><strong>Soru 2.15</strong>\nDinamik bir hoparlörde, kalıcı mıknatısın oluşturduğu manyetik alan içinde hareket edebilen bir ses bobini bulunur. Ses işaretine bağlı olarak bobinden geçen akımın yönü ve büyüklüğü değişir.</p>\n<p>Aşağıdaki ifadelerden hangisi yanlıştır?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Akımın yönü değiştiğinde bobine etki eden manyetik kuvvetin yönü de değişebilir.</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Bobinin hareketi diyaframı titreştirerek ses oluşmasına katkı sağlar.</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Bobin hareket ederken devrede geri EMK oluşabilir.</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Manyetik kuvvetin büyüklüğü uygun geometride akım ve manyetik alanla artabilir.</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Bobine etki eden manyetik kuvvet, akımdan bağımsızdır.</div></div>"
    },
    {
      "id": "b0083",
      "heading": "Soru 2.16",
      "type": "assessment",
      "html": "<p><strong>Soru 2.16</strong>\nBasitleştirilmiş ilk modelde, yerden 15 m yüksekte bulunan tek ve çok uzun bir iletkenden $I=1000$ A akım geçtiğini düşününüz.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İletkenin tam altındaki yer seviyesinde $B=\\mu_0 I/(2\\pi r)$ ile alan büyüklüğünü hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Sonucu yaklaşık $5\\times10^{-5}$ T büyüklüğündeki Dünya alanıyla karşılaştırınız. Gerçek bir pusula sapmasının, iki alanın vektörel yönlerine de bağlı olduğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Gerçek enerji iletim hatlarının üç fazlı ve zamana bağlı olduğunu düşününüz. Faz iletkenlerinin geometrisinin, akımların faz farklarının ve dönüş yollarının yer seviyesindeki <strong>vektörel toplam alanı</strong> nasıl belirlediğini değerlendiriniz. “Fazlar arası mesafeyi artırmak alanı her zaman azaltır” biçiminde genel bir kural kurulamayacağını belirtiniz.</div></div>"
    },
    {
      "id": "b0086",
      "heading": "Soru 2.17",
      "type": "assessment",
      "html": "<p><strong>Soru 2.17</strong>\nÜç fazlı yüksek gerilim iletim hatlarında iletkenlerin geometrik konumları hat boyunca belirli aralıklarla değiştirilebilir; bu işleme <strong>faz transpozisyonu</strong> denir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Transpozisyonun temel amacının, her fazın diğer fazlara ve toprağa göre ortalama geometrik konumunu eşitleyerek faz başına endüktans, kapasitans ve karşılıklı kuplaj dengesizliğini azaltmak olduğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Transpozisyonun çevredeki manyetik alan dağılımını da etkileyebileceğini, ancak “alanı mutlaka azaltır” biçiminde genel bir sonuç verilemeyeceğini süperpozisyonla değerlendiriniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Tek fazlı bir sistemde gidiş ve dönüş iletkenlerinin birbirine yaklaştırılmasının dış manyetik alanı neden azaltabildiğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Uzun metal çit veya boru hatlarında zamanla değişen dış alanların indüklediği gerilimlerin hangi koşullarda güvenlik sorunu oluşturabileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0091",
      "heading": "Soru 2.18",
      "type": "assessment",
      "html": "<p><strong>Soru 2.18</strong>\nBazı hassas laboratuvar terazilerinde elektromanyetik kuvvet dengeleme yöntemi kullanılır. Kefe üzerine kütle konulduğunda konum algılayıcısı çok küçük yer değiştirmeleri belirler. Geri besleme düzeni, bobin ile mıknatıs arasındaki elektromanyetik kuvveti değiştirerek sistemi yeniden denge konumuna getirir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Denge durumunda bobine etki eden elektromanyetik kuvvet ile cismin ağırlığı arasındaki ilişkiyi açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Ölçülen bobin akımının kütleyle ilişkilendirilebilmesi için sistemin hangi büyüklüklerinin önceden belirlenmesi gerektiğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Manyetik alan, bobin geometrisi, konum algılayıcısının duyarlılığı ve geri besleme düzeninin ölçüm duyarlılığı üzerindeki etkilerini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0093",
      "heading": "Soru 2.19",
      "type": "assessment",
      "html": "<p><strong>Soru 2.19</strong>\nEski tip analog multimetrelerin ibresi veya hassas sismografların sarkacı, hareket ettikten sonra uzun süre sallanır. Mühendisler, bu salınımı hızlıca durdurmak için ibrenin hareketli alüminyum çerçevesini güçlü bir kalıcı mıknatısın kutupları arasına yerleştirir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Alüminyum çerçeve manyetik alan içinde hareket ederken içinde ne oluşur ve bu durum çerçeveye nasıl bir kuvvet uygular?</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu \"manyetik frenleme\" kuvveti, ibre durduğunda (hız sıfır olduğunda) neden ortadan kalkar ve ibrenin doğru ölçüm değerinde (örneğin 5 Volt'ta) takılı kalmasını engellemez?</div></div>\n<p><em>Manyetik frenleme genellikle hıza bağlı sönüm sağlar; sistemin kritik sönümlü olup olmadığı toplam yay sabiti, atalet momenti ve sönüm katsayısına bağlıdır. Her manyetik frenleme sistemi otomatik olarak kritik sönümlü değildir.</em></p>"
    },
    {
      "id": "b0280",
      "heading": "Soru 2.20",
      "type": "assessment",
      "html": "<p><strong>Soru 2.20</strong></p>\n<p>Yatay bir masadaki pusulanın merkezinin $r=10\\,\\mathrm{cm}$ üzerinden, kuzey-güney doğrultusunda çok uzun bir tel geçiriliyor. Telden kuzey yönünde $I=2.0\\,\\mathrm{A}$ akım geçiyor. Dünya'nın yatay manyetik alan bileşenini $B_H=50\\,\\mu\\mathrm{T}$ ve kuzey yönünde kabul ediniz.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Telin pusula konumunda oluşturduğu manyetik alanın büyüklüğünü ve yatay doğrultudaki yönünü bulunuz.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Pusulanın sapma açısını $\\tan\\phi=B_{tel}/B_H$ bağıntısıyla hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Akım iki katına çıkarıldığında $\\phi$ açısının iki katına çıkmasının zorunlu olmadığını gösteriniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Bu düzenek ile Ørsted'in gözlemi arasındaki fiziksel bağı açıklayınız.</div></div>"
    },
    {
      "id": "b0282",
      "heading": "Soru 2.21",
      "type": "assessment",
      "html": "<p><strong>Soru 2.21</strong></p>\n<p>Yarıçapı $R = 2$ cm olan uzun silindirik bir iletkenden $I = 10$ A akım, kesitine homojen olarak dağılmaktadır. Silindirin merkezinden $r = 1$ cm uzaklıktaki manyetik alanın büyüklüğü nedir?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">$50 \\, \\mu T$</div></div>\n<div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">$100 \\, \\mu T$</div></div>\n<div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">$25 \\, \\mu T$</div></div>\n<div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">$200 \\, \\mu T$</div></div>\n<div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">$10 \\, \\mu T$</div></div>"
    },
    {
      "id": "b0284",
      "heading": "Soru 2.22",
      "type": "assessment",
      "html": "<p><strong>Soru 2.22</strong></p>\n<p>Yarıçapı $R = 5$ cm olan bir halka telden $I = 4$ A akım geçmektedir. Halkanın merkezindeki manyetik alanın büyüklüğü nedir?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">$16\\pi \\, \\mu T$</div></div>\n<div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">$8\\pi \\, \\mu T$</div></div>\n<div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">$32\\pi \\, \\mu T$</div></div>\n<div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">$4\\pi \\, \\mu T$</div></div>\n<div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">$2\\pi \\, \\mu T$</div></div>"

    {
      "id": "b0287",
      "heading": "Soru 2.23",
      "type": "assessment",
      "html": "<p><strong>Soru 2.23</strong></p>\n<p>Bir toroidin iç yarıçapı $a = 5$ cm, dış yarıçapı $b = 10$ cm, sarım sayısı $N = 500$ ve akım $I = 2$ A'dir. Toroidin merkez çizgisi üzerinde ($r = 7.5$ cm) manyetik alanın büyüklüğü nedir?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">$1.33$ mT</div></div>\n<div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">$2.67$ mT</div></div>\n<div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">$0.67$ mT</div></div>\n<div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">$5.33$ mT</div></div>\n<div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">$13.3$ mT</div></div>"

    {
      "id": "b0288",
      "heading": "Soru 2.24",
      "type": "assessment",
      "html": "<p><strong>Soru 2.24</strong></p>\n<p>Yatay bir masadaki pusulanın $r=10\\,\\mathrm{cm}$ üstünden kuzey-güney doğrultusunda uzun bir tel geçmektedir. Akım kuzey yönünde $I=5.0\\,\\mathrm{A}$ olsun. Dünya'nın yatay alanını $B_H=50\\,\\mu\\mathrm{T}$ ve kuzey yönünde kabul ediniz.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Telin pusula konumunda oluşturduğu alanın büyüklüğünü ve yönünü bulunuz.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Pusula iğnesinin denge yönünü vektörel toplamdan hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Akım ters çevrilirse sapma yönünün nasıl değişeceğini açıklayınız.</div></div>"
    },
    {
      "id": "b0290",
      "heading": "Soru 2.25",
      "type": "assessment",
      "html": "<p><strong>Soru 2.25</strong></p>\n<p>Uzunluğu $L=30\\,\\mathrm{cm}$, yarıçapı $R=3.0\\,\\mathrm{cm}$ ve sarım sayısı $N=600$ olan hava çekirdekli bir solenoidden $I=3.0\\,\\mathrm{A}$ akım geçmektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İdeal uzun-solenoid yaklaşımıyla merkez alanını hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Çok uzun bir solenoidin geometrik ucunda eksen üzerindeki alanın merkez alanının yaklaşık yarısına yaklaştığını kullanarak uç alanı için yaklaşık büyüklük tahmini yapınız. $L/R=10$ olduğundan bunun yaklaşık bir sonuç olduğunu belirtiniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">$L$ ve $N$ birlikte iki katına çıkarılıp $N/L$ sabit tutulursa merkez alanın ideal modelde nasıl değişeceğini; buna karşılık merkez çevresindeki homojenliğin neden iyileşebileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "rev-2-01",
      "heading": "İleri Düzey Soru 2.26",

      "heading": "İleri Düzey Soru 2.27",

      "heading": "İleri Düzey Soru 2.28",

      "html": "<p><strong>İleri Düzey Soru 2.28</strong> <span class=\"difficulty\">Orta</span> <span class=\"source-tag\">Kaynak temelli</span></p>Kare biçimli akım halkasının merkezindeki alanı dört kenarın katkısını kullanarak bulunuz. Sonucu uzak tel yaklaşımıyla karşılaştırınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"

    {

    {
      "id": "b0096",
      "heading": "Hazırlık Sorusu: Kanser Tedavisinde “Görünmez Neşter” — Proton Terapisi",
      "type": "preparation",
      "html": "<h3>Hazırlık Sorusu: Proton Tedavisinde Demet Yönlendirme</h3>\n<p>Proton tedavisinde protonlar, tümörün konumuna uygun enerjiye hızlandırılır ve manyetik alanlarla yönlendirilir. Proton enerjisi onlarca ile birkaç yüz megaelektronvolt düzeyine ulaştığında görelilik düzeltmeleri gerekli olabilir. Dokuda bırakılan enerjinin derinliğe bağlı değişimi, tedavi planlamasında yararlanılan temel özelliklerden biridir.</p>\n<ol>\n<li>Momentum arttığında aynı bükülme yarıçapını korumak için $p=qBr$ bağıntısına göre manyetik alanın nasıl değişmesi gerektiğini açıklayınız.</li>\n<li>Demetin enine yönünün mıknatıslarla değiştirilebilmesine karşın doku içindeki erişim derinliğinin neden esas olarak proton enerjisiyle belirlendiğini açıklayınız.</li>\n<li>Yüksek enerjilerde $r=mv/(qB)$ yerine $r=p/(qB)$ biçiminin kullanılmasının neden daha genel olduğunu değerlendiriniz.</li>\n</ol>"
    },
    {
      "id": "curriculum-3-1",
      "heading": "KÖŞE TAŞI 3.1 — Manyetik kuvvetin yönü ve yük işareti",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 3.1 — Manyetik kuvvetin yönü ve yük işareti</h2><p>Noktasal yük için F=qvB sinθ; akım taşıyan tel için F=ILB sinθ kullanılır. Kuvvet, hız/akım ile alanın oluşturduğu düzleme diktir.</p><div class=\"answer-formula\">Büyüklük ve yön birlikte verilmeden kuvvet çözümü tamamlanmış sayılmaz.</div>\n<p>Çapraz çarpımın yönü sağ el kuralıyla belirlenir. Negatif yükte q işareti nedeniyle kuvvet yönü pozitif yüke göre tersine döner.</p><div class=\"answer-formula\">Önce v, B ve F vektörlerini aynı koordinat sisteminde çizmek hata riskini azaltır.</div>\n<p>Bu alt başlık, manyetizmanın temel kavramlarını fiziksel model ve ölçülebilir büyüklüklerle ilişkilendirir. Tanım, yön, birim ve geçerlilik koşulları birlikte değerlendirilmelidir.</p>"
    },

      "id": "curriculum-support-3-example",
      "heading": "Örnek 3.1 — Temel model",
      "type": "example",

    },

    },
    {
      "id": "b0099",
      "heading": "Örnek 3.2",
      "type": "example",
      "html": "<h3>Örnek 3.2</h3>\n<p>$N=50$ sarımlı bir bobinden $I=0.20$ A akım geçmektedir. Her sarımın alanı $A=4.0\\times10^{-4}$ m$^2$ ve düzgün manyetik alan $B=0.30$ T'dir. Bobinin alan normali ile $\\vec B$ arasındaki açı $30^\\circ$ olduğuna göre manyetik torkun büyüklüğünü ve potansiyel enerjiyi bulunuz.</p>\n<hr />\n<p>Önce dipol momenti:\n$$\\mu=NIA=50(0.20)(4.0\\times10^{-4})=4.0\\times10^{-3}\\ \\text{A m}^2.$$\nTork:\n$$\\tau=\\mu B\\sin30^\\circ\n=(4.0\\times10^{-3})(0.30)(0.5)\n=6.0\\times10^{-4}\\ \\text{N m}.$$\nPotansiyel enerji:\n$$U=-\\mu B\\cos30^\\circ\\approx-1.04\\times10^{-3}\\ \\text{J}.$$</p>\n<p>Tork bobini $\\vec\\mu$ ile $\\vec B$'yi aynı doğrultuya getirmeye çalışır. Bu konumda $U$ minimumdur. <strong>Net kuvvet ile tork aynı şey değildir.</strong></p>"
    },
    {
      "id": "b0101",
      "heading": "Soru 3.2",
      "type": "yourturn",
      "html": "<p><strong>Soru 3.2</strong>\nBir sabit disk sürücüsünde okuma-yazma kafası, kalıcı mıknatıslar ile hareketli bir bobinden oluşan bobinli bir eyleyici yardımıyla çok küçük uzaklıklarda ve kısa sürelerde konumlandırılır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bobinden geçen akımın manyetik alan içinde kuvvet oluşturmasını $\\vec F=I\\vec L\\times\\vec B$ bağıntısıyla açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Akım yönünün değiştirilmesinin hareket yönünü nasıl değiştirdiğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Kafanın hızlı ve kararlı konumlandırılabilmesi için akımın kapalı çevrimli bir denetim sistemiyle ayarlanmasının neden yararlı olduğunu değerlendiriniz.</div></div>"
    },
    {
      "id": "b0103",
      "heading": "Örnek 3.3",
      "type": "example",
      "html": "<h3>Örnek 3.3</h3>\n<p>Doping testlerinde veya adli tıpta &quot;Kütle Spektrometresi&quot; kullanılarak bir örnekteki maddelerin izotop oranları belirlenir. Cihazda, iyonize edilmiş moleküller önce bir &quot;Hız Seçici&quot;den (dik $\\vec{E}$ ve $\\vec{B}_1$ alanları) geçer, ardından sadece $\\vec{B}_2$ alanı olan bir bölgeye girerek dedektöre çarpar.</p>\n<ul>\n<li><strong>Bölge I (Hız Seçici):</strong> Birbirine dik düzgün $\\vec{E}$ (aşağı yönlü) ve $\\vec{B}_1$ ($\\otimes$ içe yönlü) alanları vardır.</li>\n<li><strong>Bölge II (Ayırma Odası):</strong> Sadece $\\vec{B}_2$ ($\\otimes$ içe yönlü) manyetik alanı vardır.</li>\n</ul>\n<p>$+q$ yüklü bir parçacık Bölge I'e yatay olarak girip hiç sapmadan geçtiğine ve Bölge II'de yarıçapı $r$ olan dairesel bir yörüngeye girdiğine göre;\na) Parçacığın Bölge I'deki hızını ($v$),\nb) Parçacığın kütlesini ($m$), verilenler cinsinden türetiniz.</p>\n<hr />\n<p><strong>a) Hız Seçici Modeli:</strong>\nParçacığın sapmaması için net kuvvetin sıfır olması gerekir. Elektriksel kuvvet ($\\vec{F}_E = q\\vec{E}$) aşağı yönlü olduğuna göre, manyetik kuvvet ($\\vec{F}_B$) yukarı yönlü olmalıdır. Sağ el kuralı ve yükün pozitif olması gereği, hız $\\vec{v}$ sağa doğrudur.</p>\n<p>Denge durumu:\n$$F_E = F_B \\implies qE = qvB_1 \\implies v = \\frac{E}{B_1}$$</p>\n<p><em>(Not: Hız, yükten ve kütleden bağımsızdır.)</em></p>\n<p><strong>b) Kütle Türetimi:</strong>\nParçacık Bölge II'ye $v$ hızıyla girer. Burada sadece manyetik kuvvet etkindir ve merkezcil kuvveti sağlar:\n$$qvB_2 = \\frac{mv^2}{r} \\implies m = \\frac{qB_2 r}{v}$$</p>\n<p>(a) şıkkında bulduğumuz $v$ ifadesini yerine koyarsak:\n$$m = \\frac{q B_1 B_2 r}{E}$$</p>\n<p>Dedektördeki ($r$) konum, doğrudan kütleyi verir. $^{14}C$, $^{12}C$'ye göre daha büyük bir $r$ yarıçapında çarpar.</p>"
    },
    {
      "id": "b0105",
      "heading": "Soru 3.3",
      "type": "yourturn",
      "html": "<p><strong>Soru 3.3</strong>\nBir hız seçicide, birbirine dik $\\vec{E}$ ve $\\vec{B}$ alanları kullanılarak sadece belirli hıza sahip yüklerin sapmadan geçmesi sağlanır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$E = 10^4$ V/m ve $B = 0.5$ T ise, sapmadan geçen yüklerin hızını hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu hız seçiciden $+2e$ yüklü bir alfa parçacığı ve $-e$ yüklü bir elektron aynı hızla geçebilir mi? Neden?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Eğer manyetik alanın yönü tersine çevrilirse, aynı hızdaki yükler yine sapmadan geçer mi? Açıklayınız.</div></div>"
    },
    {
      "id": "b0106",
      "heading": "Örnek 3.4",
      "type": "example",
      "html": "<h3>Örnek 3.4</h3>\n<p>Momentum büyüklüğü $p=1.0\\times10^{-18}$ kg m/s olan bir proton, hızına dik $B=2.0$ T düzgün manyetik alanına giriyor. Yörünge yarıçapını bulunuz. Aynı momentuma sahip $+2e$ yüklü bir parçacığın yarıçapı nasıl değişir?</p>\n<hr />\n<p>Manyetik rijitlik bağıntısı:\n$$r=\\frac{p}{|q|B}.$$\nProton için:\n$$r_p=\\frac{1.0\\times10^{-18}}{(1.60\\times10^{-19})(2.0)}\\approx3.13\\ \\text{m}.$$\nAynı momentumda yük $+2e$ olursa:\n$$r=\\frac{p}{2eB}=\\frac{r_p}{2}\\approx1.56\\ \\text{m}.$$</p>\n<p>Aynı $B$ altında yörüngeyi belirleyen temel büyüklük $p/|q|$ oranıdır. Bu nedenle hızlandırıcı fiziğinde $B\\rho=p/|q|$ kullanımı çok etkilidir.</p>"
    },

      "id": "b0108",
      "heading": "Soru 3.4",
      "type": "yourturn",
      "html": "<p><strong>Soru 3.4</strong>\nProton tedavisinde protonların başlangıç kinetik enerjisi, dokuda ulaşacakları menzili belirleyen temel parametrelerden biridir; mıknatıslar ise demeti yönlendirmek ve odaklamak için kullanılır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Aynı yörünge yarıçapı $r$ korunmak isteniyorsa $p=qBr$ bağıntısından, daha yüksek momentumlu protonlar için gerekli $B$ alanının nasıl değişmesi gerektiğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Manyetik alanın demetin yönü ve enine konumu üzerindeki rolü ile protonun dokudaki menzilini belirleyen başlangıç kinetik enerjisini birbirinden ayırınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Proton tedavisindeki Bragg tepesinin, belirli tümör geometrilerinde giriş ve çıkış dozunun yönetilmesine nasıl katkı sağlayabileceğini genel fizik açısından açıklayınız.</div></div>"
    },

      "html": "<h2>KÖŞE TAŞI 3.2 — Lorentz kuvveti, açı ve enerji</h2><p>Lorentz kuvveti F=q(E+v×B) elektrik ve manyetik etkileri birleştirir. Elektrik alan hızın büyüklüğünü değiştirebilir; manyetik alan çoğunlukla yönü büker.</p><div class=\"answer-formula\">İki alanın etkileri birbirine eklenir ancak yön ve enerji değişimleri aynı değildir.</div>\n<p>F=qvB sinθ bağıntısına göre kuvvet açıya duyarlıdır. θ=0° için kuvvet sıfır, θ=90° için maksimumdur.</p><div class=\"answer-formula\">Hızın alan dik bileşeni yörünge eğriliğini belirler.</div>\n<p>Manyetik kuvvet anlık hız vektörüne dik olduğundan F·v=0 ve manyetik kuvvetin yaptığı iş sıfırdır.</p><div class=\"answer-formula\">Buna rağmen yörünge değişir; yön değişimi ivme ve momentum yönü değişimi anlamına gelir.</div>\n<p>Bobinde depolanan enerji U=½LI²’dir. Akım yükselirken kaynak enerjisinin bir bölümü manyetik alanda depolanır.</p><div class=\"answer-formula\">Devre açılırken bu enerji yüksek gerilim darbesine dönüşebileceğinden koruma elemanı gerekir.</div>"
    },
    {
      "id": "b0112",
      "heading": "Soru 3.5",
      "type": "yourturn",
      "html": "<p><strong>Soru 3.5</strong>\nBir Hall algılayıcısı, manyetik alanı ölçmek için kullanılır. Algılayıcıün hassasiyetini artırmak için:</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Hangi malzeme özellikleri (yük taşıyıcı yoğunluğu $n$, kalınlık $t$) tercih edilmelidir? $V_H = \\frac{IB}{nqt}$ bağıntısından yola çıkınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Neden yarı iletkenler (InSb, GaAs), metallere (bakır) göre daha iyi Hall algılayıcılari üretir?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bir Hall algılayıcısının sıcaklıkla değişen özellikleri, ölçüm hassasiyetini nasıl etkiler?</div></div>"
    },

    {
      "id": "b0303",
      "heading": "Soru 3.9",
      "type": "activity",
      "html": "<p><strong>Soru 3.9</strong>\nManyetik kaldırmalı taşıma sistemlerinde farklı fiziksel yöntemler kullanılabilir. Bir yöntemde denetlenen elektromıknatıslarla raylara doğru çekim kuvveti oluşturulur. Başka bir yöntemde ise hareketin indüklediği akımlar veya güçlü araç mıknatısları kaldırma ve kılavuzlama kuvvetlerine katkı sağlar.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bu iki yöntemin temel fiziksel farkını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">$m=4.0\\times10^4\\,\\mathrm{kg}$ kütleli bir aracın dengede kalması için gereken toplam düşey kaldırma kuvvetini hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">İndüksiyona dayalı kaldırma yöntemlerinde düşük hızlarda yardımcı tekerlek veya başka destek düzeneklerinin neden gerekebileceğini açıklayınız. Belirli bir hız eşiğinin sistem tasarımına bağlı olduğunu belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Kaldırma, kılavuzlama ve itme kuvvetlerinin neden ayrı alan bileşenleri veya alt düzenekler gerektirebileceğini değerlendiriniz.</div></div>"

    {

      "heading": "KÖŞE TAŞI 3.3 — Hız seçici ve E×B düzenekleri",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 3.3 — Hız seçici ve E×B düzenekleri</h2><p>Birbirine dik E ve B alanlarında elektrik ve manyetik kuvvetler zıt yönlü olabilir. v=E/B koşulunu sağlayan parçacıklar sapmadan geçer.</p><div class=\"answer-formula\">Hız seçici yalnız hız büyüklüğünü seçer; yük işareti uygun düzenekte iki kuvvetin yönünü birlikte tersine çevirir.</div>"

    {
      "id": "b0295",
      "heading": "Soru 3.10",
      "type": "extraordinary",
      "html": "<p><strong>Soru 3.10</strong>\nBazı yarı iletken kristallerinin üretiminde, iletken eriyik üzerine dış manyetik alan uygulanarak sıvı içindeki akışın denetlenmesi amaçlanır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İletken akışkandaki manyetik kuvveti tek tek iyonların hareketinden çok $\\vec f=\\vec J\\times\\vec B$ hacim kuvvetiyle tanımlamanın neden uygun olduğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Akışkan hareketi ile indüklenen akımların birlikte oluşturduğu Lorentz hacim kuvvetinin taşınımla oluşan akışı nasıl azaltabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Akışın azaltılmasının sıcaklık ve katkı maddesi dağılımı üzerinden kristal yapısının düzgünlüğüne nasıl katkı sağlayabileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0123",
      "heading": "ÖLÇME VE DEĞERLENDİRME",
      "type": "assessment-section",
      "html": "<h2>ÖLÇME VE DEĞERLENDİRME</h2>\n<p>Aşağıdaki sorular, bölümün çekirdek kavramlarını ve zenginleştirme uzantılarını bağımsız olarak değerlendirir.</p>"

    {
      "id": "b0128",
      "heading": "Soru 3.11",
      "type": "assessment",
      "html": "<p><strong>Soru 3.11</strong>\nDüzgün manyetik alanda dairesel hareket yapan bir yükün:</p>\n<p>I. Hız vektörü sabittir.\nII. Sürati sabittir.\nIII. İvme vektörü sabittir.\nIV. Kinetik enerjisi sabittir.</p>\n<p>Hangileri doğrudur?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">I ve II</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">II ve IV</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">I, II ve IV</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">II, III ve IV</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">I, II, III ve IV</div></div>"
    },
    {
      "id": "b0129",
      "heading": "Soru 3.12",
      "type": "assessment",
      "html": "<p><strong>Soru 3.12</strong>\nBir elektron, $+x$ yönünde hareket ederken $+z$ yönündeki manyetik alandan geçiyor. Elektrona etki eden manyetik kuvvetin yönü:</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">$+x$</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">$-x$</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">$+y$</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">$-y$</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">$+z$</div></div>"
    },
    {
      "id": "b0133",
      "heading": "Soru 3.13",
      "type": "assessment",
      "html": "<p><strong>Soru 3.13</strong>\nFutbolda \"Magnus etkisi\", dönen bir topun hava akımındaki asimetrisi nedeniyle yörüngesinin sapmasıdır. Benzer şekilde, yüklü bir parçacığın manyetik alandaki sapması da \"Lorentz sapması\"dır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Magnus etkisi ile Lorentz kuvveti arasındaki temel fiziksel farkları karşılaştırınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">İdeal ve durağan akış modeli altında Magnus kuvveti her zaman hıza tam dik olmak zorunda değildir; gerçek akışta sürükleme kuvveti de bulunur. Dolayısıyla topun kinetik enerjisi değişebilir. Lorentz manyetik kuvveti ise ideal noktasal yük için anlık olarak hıza diktir. Bu farkı enerji açısından değerlendiriniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Magnus etkisi \"korunumlu olmayan\" bir kuvvet midir? Değerlendiriniz.</div></div>"
    },
    {
      "id": "b0134",
      "heading": "Soru 3.14",
      "type": "assessment",
      "html": "<p><strong>Soru 3.14</strong>\nBazı kalp pilleri ve vücuda yerleştirilen ritim aygıtları dış manyetik alana, aygıtın tasarımına ve programlanmasına bağlı olarak farklı biçimlerde yanıt verebilir. Eski bazı tasarımlarda kamış anahtar, daha yeni tasarımlarda Hall algılayıcısı veya başka manyetik alan algılayıcıları kullanılabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Kamış anahtarın dış manyetik alan etkisiyle nasıl durum değiştirdiğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Hall algılayıcısının manyetik alanı elektriksel bir işarete dönüştürme ilkesini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bir manyetik alan algılayıcısının çıkışının aygıtın çalışma durumunu değiştirmek için kullanılabileceğini, ancak gerçek tepkinin her aygıtta aynı olmadığını belirtiniz.</div></div>\n<p>Bu soru yalnızca fiziksel çalışma ilkesini ele alır; tıbbi kullanım ve güvenlik kararları ilgili aygıtın üretici bilgileri ve sağlık uzmanlarının değerlendirmesine göre verilir.</p>"
