      "html": "<p><strong>Soru 6.11</strong></p>\n<p>Manyetik şeritli bir kart, okuyucu kafanın yanından geçiriliyor. Şeritteki mıknatıslanma yönü uzay boyunca değişmektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Kart hareket ettikçe okuyucu kafadaki manyetik akının değişmesinin bobinde nasıl EMK ürettiğini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Aynı manyetik desen daha hızlı geçirilirse $|d\\Phi/dt|$ ve sinyal genliğinin neden genellikle arttığını açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Çok düşük hızda sinyalin gürültü tabanına yaklaşmasının okuma güvenilirliğini nasıl azaltabileceğini değerlendiriniz.</div></div>"

    {
      "id": "b0170",
      "heading": "Soru 6.15",
      "type": "experiment",
      "html": "<p><strong>Soru 6.15</strong>\nGüçlü bir neodimyum mıknatıs dikey bir bakır borunun içinden bırakıldığında, boru duvarlarında oluşan girdap akımları nedeniyle serbest düşmeye göre belirgin biçimde yavaşlar. Aynı boru boyunca açılan kesintisiz bir boyuna yarık, çevresel akım yollarını önemli ölçüde bozar.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Mıknatıs düşerken borunun farklı bölgelerinde indüklenen girdap akımlarının, manyetik akı değişimine karşı koyacak yönde oluştuğunu ve net manyetik kuvvetin neden harekete zıt olduğunu Lenz yasasıyla açıklayınız.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Boyuna yarığın kapalı çevresel akım yollarını keserek girdap akımlarını ve dolayısıyla frenleme kuvvetini neden <strong>önemli ölçüde azaltabildiğini</strong> açıklayınız. Frenlemenin ideal olarak mutlaka sıfır olmasının gerekmediğini belirtiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Mıknatısın kaybettiği kütleçekim potansiyel enerjisinin başlıca Joule ısısına, daha küçük ölçüde diğer kayıplara dönüştüğünü enerji korunumu açısından ifade ediniz.</div></div>"

      "heading": "Soru 6.16",
      "type": "extraordinary",
      "html": "<p><strong>Soru 6.16</strong>\nYarıçapı $a$ olan dairesel bir bobin, $N$ sarımlıdır ve $R$ direncine sahiptir. Bobin, düzgün bir $\\vec{B}$ manyetik alanı içindedir. Manyetik alan, bobinin eksenine $\\theta$ açısı yapmaktadır.</p>\n<p>Manyetik alan $t=0$'da $B_0$ iken, $t = \\tau$ süresinde doğrusal olarak sıfıra düşmektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bu süre boyunca bobinden geçen toplam yükü ($Q$) bulunuz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">$Q$'nun, alanın değişim hızından bağımsız olduğunu gösteriniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bu sonuç, Faraday yasasının integral formunun ($\\int \\varepsilon , dt = -\\Delta\\Phi$) bir uygulamasıdır. Değerlendiriniz.</div></div>"
    },
    {
      "id": "b0175",
      "heading": "Soru 6.17",
      "type": "extraordinary",
      "html": "<p><strong>Soru 6.17</strong>\nYarıçapı $a$ olan silindirik bir bölgede, manyetik alan $B(t) = B_0 \\sin(\\omega t)$ şeklinde değişmektedir. Merkezden $r_0$ uzaklığına ($r_0 &lt; a$), $m$ kütleli, $+q$ yüklü durgun bir parçacık bırakılıyor.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Parçacığın ilk andaki ivmesini bulunuz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Parçacık hız kazandıkça, manyetik kuvvetin yönü nasıl değişir?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Düşük frekans ($\\omega \\to 0$) ve yüksek frekans ($\\omega \\to \\infty$) limitlerinde parçacığın davranışını fiziksel olarak yorumlayınız.</div></div>"
    },
    {
      "id": "b0313",
      "heading": "Soru 6.18",
      "type": "extraordinary",
      "html": "<p><strong>Soru 6.18</strong>\nTranskraniyal manyetik uyarımda (TMU) kısa süreli güçlü manyetik alan darbeleri kullanılır. Basitleştirilmiş yerel bir modelde alanın $\\Delta B=0.50\\,\\mathrm{T}$ kadar $\\Delta t=200\\,\\mu\\mathrm{s}$ içinde değiştiği ve yarıçapı $r=5.0\\,\\mathrm{cm}$ olan dairesel yolun alanına yaklaşık dik ve düzgün olduğu varsayılsın.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$|dB/dt|$ için yaklaşık büyüklüğü hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Faraday yasasıyla dairesel yol üzerindeki teğetsel elektrik alan büyüklüğünü $E(r)=\\frac{r}{2}|dB/dt|$ ideal modeliyle bulunuz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Gerçek TMU alanının uzayda düzgün olmadığını ve dokunun iletkenlik yapısının sonucu etkilediğini belirterek modelin sınırlarını açıklayınız.</div></div>"
    },
    {
      "id": "b0329",
      "heading": "Soru 6.19",
      "type": "extraordinary",
      "html": "<p><strong>Soru 6.19</strong>\nBasitleştirilmiş bir MR gradyan modeli için, yarıçapı $r=0.15\\,\\mathrm{m}$ olan dairesel bir vücut kesiti boyunca alanın yaklaşık düzgün ve kesite dik olduğu, $|dB/dt|=200\\,\\mathrm{T/s}$ hızla değiştiği kabul edilsin.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Faraday yasasından $E(r)=\\frac{r}{2}|dB/dt|$ ideal modeliyle çevresel elektrik alan büyüklüğünü hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Gerçek gradyan alanının uzayda doğrusal değiştiğini ve insan anatomisinin bu basit halkadan farklı olduğunu belirterek modelin sınırlarını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">MR sistemlerinde çevresel sinir uyarımının tek bir evrensel $dB/dt$ değeriyle belirlenemeyeceğini; dalga biçimi, gradyan geometrisi ve bireysel özelliklerin de etkili olduğunu açıklayınız.</div></div>"
    },
    {
      "id": "b0330",
      "heading": "Soru 6.20",
      "type": "extraordinary",
      "html": "<p><strong>Soru 6.20</strong></p>\n<p>Dinamik kablosuz araç şarjında yol altındaki bobinler, araç üzerindeki alıcı bobine kısa sürelerle enerji aktarır. Araç hızı $60\\,\\mathrm{km/h}$ ve tek etkin bobin bölgesi için etkileşim süresi $0.10\\,\\mathrm{s}$ olsun. Aktarılan elektriksel gücün o aralıkta $20\\,\\mathrm{kW}$ olduğu ideal bir örnek kullanınız.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Tek bobin bölgesinde aktarılan enerjiyi joule ve Wh cinsinden hesaplayınız. Sürekli yol şarjı için neden ardışık çok sayıda etkin bölge gerektiğini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bobinlerin yalnız araç üzerindeyken etkinleştirilmesinin algılama, zamanlama ve güç elektroniği açısından gerektirdiği kontrolü değerlendiriniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Metal yabancı nesnelerde girdap akımı ısınması riskine karşı yabancı nesne algılama ve güç kesme gibi önlemleri açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Verimin tek bir sabit yüzde olmadığını; hizalama, hava aralığı, bobin direnci, ferrit/metal kayıpları ve güç elektroniğine bağlı olduğunu değerlendiriniz.</div></div>"
    },
    {
      "id": "b0337",
      "heading": "Soru 6.21",
      "type": "extraordinary",
      "html": "<p><strong>Soru 6.21</strong>\nTranskraniyal manyetik uyarım (TMU) ve derin beyin uyarımı (DBU), sinir dokusunu farklı fiziksel yollarla etkileyebilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">TMU'da zamanla değişen manyetik alanın dokuda elektrik alan oluşturmasını Faraday yasasıyla açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">DBU'da vücuda yerleştirilen elektrotlar aracılığıyla doğrudan elektrik alan oluşturulduğunu ve bu mekanizmanın manyetik indüksiyon olmadığını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">TMU'da bobin geometrisinin uyarım bölgesinin derinliği ve uzaysal yayılımı üzerindeki etkisini değerlendiriniz.</div></div><div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">İki yöntemin fiziksel çalışma ilkelerini karşılaştırınız.</div></div>"
    },
    {
      "id": "b0178",
      "heading": "ÖLÇME VE DEĞERLENDİRME",
      "type": "assessment-section",
      "html": "<h2>ÖLÇME VE DEĞERLENDİRME</h2>\n<p>Aşağıdaki sorular, bölümün çekirdek kavramlarını ve zenginleştirme uzantılarını bağımsız olarak değerlendirir.</p>"
    },
    {
      "id": "b0179",
      "heading": "Soru 6.22",
      "type": "assessment",
      "html": "<p><strong>Soru 6.22</strong>\nSonlu dirence sahip kapalı bir iletken halka, halka yüzeyine dik düzgün bir manyetik alan içindedir. Alanın büyüklüğü zamanla doğrusal olarak artmaktadır.</p>\n<p>Aşağıdakilerden hangisi <strong>yanlıştır</strong>?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Halkada bir EMK indüklenir.</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Halkadan indüklenen akım geçer.</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">İndüklenen akımın oluşturduğu manyetik alan, dış manyetik akıdaki artışı destekleyecek yöndedir.</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Halka direnci sonlu olduğundan Joule ısısı oluşur.</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Alan doğrusal arttığı ve halka alanı sabit olduğu için manyetik akının değişim hızı sabittir.</div></div>"
    },
    {

    {
      "id": "b0181",
      "heading": "Soru 6.24",
      "type": "assessment",
      "html": "<p><strong>Soru 6.24</strong>\nBir bobin, düzgün manyetik alandan, alan dışına doğru çekiliyor. Bu sırada:</p>\n<p>I. Bobinde bir EMK indüklenir.\nII. Bobine etki eden manyetik kuvvet, çekme yönüne zıttır.\nIII. Bobinde harcanan enerji, manyetik alandan gelir.</p>\n<p>Hangileri doğrudur?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Yalnız I</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Yalnız I ve II</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Yalnız II ve III</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">I, II ve III</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Hiçbiri</div></div>"
    },
    {
      "id": "b0182",
      "heading": "Soru 6.25",
      "type": "assessment",
      "html": "<p><strong>Soru 6.25</strong>\nBir indüktörde depolanan manyetik enerji:</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Akımla doğru orantılıdır.</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Akımın karesiyle doğru orantılıdır.</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">İndüktansla ters orantılıdır.</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Dirençle doğru orantılıdır.</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Manyetik alanla ters orantılıdır.</div></div>"
    },
    {
      "id": "b0184",
      "heading": "Soru 6.26",
      "type": "assessment",
      "html": "<p><strong>Soru 6.26</strong>\nBir öğrenci, manyetik alan içinde dönen bir bobinde indüklenen EMK'yı ölçmektedir. $N = 100$ sarımlı, $A = 0.02$ m² alanlı bobin, $B = 0.5$ T manyetik alanında $\\omega$ açısal hızıyla döndürülmektedir.</p>\n<p>Osiloskoptan okunan veriler:</p>\n<ul>\n<li>Maksimum EMK: $\\varepsilon_{max} = 157$ V</li>\n<li>Periyot: $T = 0.04$ s</li>\n</ul>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$\\varepsilon_{max}$ ve $T$ değerlerini kullanarak $\\omega$ ve $B$ değerlerini doğrulayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">$t = 0$ anında bobin manyetik alana diktir. $t = 0.01$ s anında manyetik akıyı ve indüklenen EMK'yı hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Eğer sarım sayısı 2 katına ($N' = 200$), açısal hız yarıya ($\\omega' = \\omega/2$) düşürülseydi, $\\varepsilon_{max}$ nasıl değişirdi?</div></div>"
    },
    {
      "id": "b0185",
      "heading": "Soru 6.27",
      "type": "assessment",
      "html": "<p><strong>Soru 6.27</strong>\nBir alıcı bobinden geçen akının yaklaşık $\\Phi\\sim BA$ olduğu ve alanın sinüzoidal olarak $\\omega$ açısal frekansıyla değiştiği bir model düşününüz. İndüklenen EMK'nın\n$$\\varepsilon\\propto \\omega^a B^b A^c N^d$$\nbiçiminde yazıldığı varsayılsın.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Boyut analizinin $a=b=c=1$ sonucunu verdiğini gösteriniz. Sarım sayısı $N$ boyutsuz olduğundan, <strong>boyut analizinin $d$ üssünü belirleyemeyeceğini</strong> açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Faraday yasası $\\varepsilon=-N,d\\Phi/dt$ kullanılarak $d=1$ olduğunu ve dolayısıyla $\\varepsilon\\sim N\\omega BA$ ölçeklemesini elde ediniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Frekansın artırılmasının indüklenen EMK'yı büyütebilmesine karşın iletkenlerde deri etkisi ve girdap akımı kayıplarını da artırabileceğini açıklayınız.</div></div>"
    },
    {
      "id": "b0186",
      "heading": "Soru 6.28",
      "type": "assessment",
      "html": "<p><strong>Soru 6.28</strong>\nManyetik alanda depolanan enerji yoğunluğunun $u_B = \\frac{B^2}{2\\mu_0}$ olduğunu boyut analiziyle gösteriniz.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$[B^2/\\mu_0]$ boyutunun enerji/hacim boyutuna eşit olduğunu doğrulayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu bağıntıyı, bir solenoidin manyetik enerjisinden türetiniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Neden manyetik enerji yoğunluğu, elektrik alan enerji yoğunluğuna ($u_E = \\frac{1}{2}\\epsilon_0 E^2$) benzer? Simetriyi değerlendiriniz.</div></div>"
    },
    {
      "id": "b0188",
      "heading": "Soru 6.29",
      "type": "assessment",
      "html": "<p><strong>Soru 6.29</strong>\nBir Faraday kafesi, dış elektrik alanlarından içi korur. Ancak manyetik alanlar için aynı etkiyi göstermez.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Faraday kafesinin elektrik alanları neden, manyetik alanları neden koruyamadığını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Değişen manyetik alanlar için Faraday kafesi nasıl çalışır?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">MR odasının \"Faraday kafesi\" olarak tasarlanmasının nedeni nedir?</div></div>"
    },
    {
      "id": "b0189",
      "heading": "Soru 6.30",
      "type": "assessment",
      "html": "<p><strong>Soru 6.30</strong>\nBir geçiş tipi metal algılayıcıda bobinler zamanla değişen bir manyetik alan oluşturur.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İletken bir metal cisim alandan geçirildiğinde cisim içinde girdap akımlarının nasıl oluştuğunu Faraday ve Lenz yasalarıyla açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Oluşan girdap akımlarının verici-alıcı bobin düzeninin ölçtüğü alanı veya bobinlerin elektriksel davranışını nasıl değiştirebileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Elektriksel olarak yalıtkan ve manyetik olmayan bir cismin bu yöntemle doğrudan algılanmasının neden güç olduğunu açıklayınız.</div></div>"
    },
    {
      "id": "b0191",
      "heading": "Soru 6.31",
      "type": "assessment",
      "html": "<p><strong>Soru 6.31</strong>\nMR cihazlarında, homojen ana manyetik alana ek olarak, \"gradyan bobinleri\" adı verilen ve konuma göre doğrusal değişen manyetik alanlar üretilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bu gradyan alanların, vücuttaki sinyallerin \"konumsal\" olarak ayırt edilmesini nasıl sağladığını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Neden gradyan bobinleri hızlıca açılıp kapanır? (Akustik gürültü)</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bu hızlı değişimler, hastada neden \"periferik sinir uyarımı\"na yol açabilir? Faraday yasasıyla ilişkilendiriniz.</div></div>"
    },
    {
      "id": "b0192",
      "heading": "Soru 6.32",
      "type": "assessment",
      "html": "<p><strong>Soru 6.32</strong>\nBir elektrik makinesi, hem jeneratör hem motor olarak çalışabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bir cihazın hangi koşullarda jeneratör, hangi koşullarda motor olarak çalıştığını, enerji akışı açısından açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Elektrikli araçlardaki \"rejeneratif frenleme\", bu çift yönlülüğün bir örneğidir. Süreci adım adım açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Neden aynı cihazın verimi, jeneratör ve motor modlarında farklı olabilir?</div></div>"
    },
    {
      "id": "b0194",
      "heading": "Soru 6.33",
      "type": "assessment",
      "html": "<p><strong>Soru 6.33</strong>\nKendi güç kaynağı bulunmayan bazı elektronik etiketler, okuyucuya yakınken zamanla değişen manyetik alan yoluyla enerji alabilir. Başka etiket türlerinde ise enerji ve bilgi aktarımı daha çok yayılan elektromanyetik dalgalar ve geri saçılma yoluyla gerçekleşebilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Yakın alanda çalışan bobinli bir etiketin okuyucudan enerji alabilmesini Faraday yasasıyla açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Okuyucu ile etiket arasındaki uzaklık ve hizanın karşılıklı indüktans ile alınan gerilim üzerindeki etkisini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Yakındaki iletken bir metal yüzeyin girdap akımları nedeniyle alan dağılımını ve bobinin elektriksel davranışını nasıl değiştirebileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Bütün temassız elektronik etiketlerin yalnız manyetik indüksiyonla çalıştığı genellemesinin neden doğru olmadığını belirtiniz.</div></div>"
    },
    {
      "id": "b0195",
      "heading": "Soru 6.34",
      "type": "assessment",
      "html": "<p><strong>Soru 6.34</strong>\nKablosuz şarj sisteminde, verimliliği artırmak için:</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Ferrit yapıların yüksek manyetik geçirgenlik sayesinde manyetik akıyı yönlendirmesi, kaçak akıyı azaltması ve bobinler arası bağlaşım katsayısını artırabilmesi bakımından neden kullanıldığını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Çalışma frekansını artırmak neden hem avantaj hem dezavantajdır?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bobinlerin geometrisi (düzlemsel vs. silindirik) verimi nasıl etkiler?</div></div>"
    },
    {
      "id": "b0199",
      "heading": "Soru 6.35",
      "type": "assessment",
      "html": "<p><strong>Soru 6.35</strong>\nBazı gıda ve ilaç ambalajlarında, kapak altında alüminyum folyo içeren çok katmanlı bir sızdırmazlık contası bulunur. Üretim hattında kapalı ambalaj, yüksek frekanslı değişken manyetik alan oluşturan bir indüksiyon başlığının altından geçirilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Değişen manyetik alanın iletken alüminyum tabakada girdap akımları oluşturmasını ve elektriksel kayıpların Joule ısısına dönüşmesini açıklayınız.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Alüminyum tabakanın <strong>hızla ısınmasının</strong>, buna karşılık plastik kapağın doğrudan girdap akımıyla belirgin biçimde ısınmamasının temel nedenini elektriksel iletkenlik açısından açıklayınız. Isının daha sonra conta/polimer katmanına iletimle aktarılabileceğini belirtiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Alüminyum yerine aynı geometride sıradan yalıtkan bir kâğıt veya plastik film kullanılsaydı, aynı indüksiyon mekanizmasının neden etkisiz kalacağını açıklayınız.</div></div>"
    },
    {
      "id": "b0200",
      "heading": "Soru 6.36",
      "type": "assessment",
      "html": "<p><strong>Soru 6.36</strong>\nEski tip mekanik hız göstergelerinde dönen kalıcı mıknatıs, iletken alüminyum bir kapta girdap akımları oluşturur; bu akımlar kapa bir tork uygular ve ibre bir geri çağırıcı yayla dengelenir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Girdap akımlarının Lenz yasası gereği mıknatıs ile kap arasındaki göreli harekete karşı koyan bir tork oluşturmasını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">İbrenin neden sürekli dönmeyip manyetik tork ile yay torkunun eşitlendiği bir açıda durduğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Cihazın <strong>kendi içindeki kalıcı mıknatıs daha güçlü bir mıknatısla değiştirilirse</strong>, aynı mil hızında göstergenin ölçüm ayarıunun nasıl değişmesini beklersiniz? Bunun, aracın bulunduğu gezegenin yaklaşık düzgün dış manyetik alanının güçlenmesiyle aynı problem olmadığını açıklayınız.</div></div>"
    },
    {
      "id": "b0203",
      "heading": "Soru 6.37",
      "type": "assessment",
      "html": "<p><strong>Soru 6.37</strong>\nŞehirlerarası yollardaki veya kavşaklardaki trafik ışıklarının çoğu, yere gömülü iletken tel döngüleri (indüktif döngüler) kullanılarak araç varlığını algılar. Bir araç bu döngünün üzerine geldiğinde, döngünün manyetik özellikleri değişir ve bu değişim bir osilatör devresi tarafından algılanarak ışığın yeşile dönmesi sağlanır. Ancak bazen hafif bir bisiklet bu döngülerin üzerinde beklerken ışık yeşile dönmez.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bir aracın (metal gövde), toprağın altındaki bu iletken döngünün manyetik alanıyla etkileşime girerek döngünün <strong>indüktansını ($L$)</strong> nasıl değiştirdiğini, girdap akımları (eddy currents) ve Lenz yasası üzerinden adım adım açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Neden hafif bir bisiklet veya karbon fiber gövdeli bir araç bu sistem tarafından algılanamayabilir?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bir mühendis olarak, bisikletlerin de güvenle algılanabilmesi için bu yer altı döngüsünün tasarımında (şekil, frekans, hassasiyet) hangi değişiklikleri yapardınız?</div></div>"
    },
    {
      "id": "b0204",
      "heading": "Soru 6.38",
      "type": "assessment",
      "html": "<p><strong>Soru 6.38</strong>\nBazı hız trenlerinde temassız yavaşlatma için ray üzerindeki güçlü kalıcı mıknatıslarla araç üzerindeki iletken alüminyum/bakır kanatlar arasında girdap akımlı frenleme kullanılır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İletken kanat manyetik alanın uzaysal olarak değiştiği bölgeye hareket ettiğinde neden girdap akımları oluştuğunu ve Lenz yasasına göre ortaya çıkan net kuvvetin göreli harekete neden karşı koyduğunu açıklayınız.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Kalıcı mıknatıs kullanan pasif bir düzenin, elektrik beslemesi kesildiğinde de temel frenleme etkisini sürdürebilmesinin güvenlik açısından önemini değerlendiriniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">$v\\to0$ iken manyetik akının değişim hızı ve girdap akımlarının neden azaldığını açıklayınız. Bu nedenle girdap akımlı frenlerin aracı <strong>statik olarak yerinde tutan</strong> bir park freni yerine geçememesinin nedenini belirtiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Basit düşük-hız modellerinde fren kuvveti yaklaşık $F\\propto v$ olabilir; ancak gerçek bir hız treninde kuvvet–hız bağıntısının mıknatıs/kanat geometrisi, iletkenlik, deri etkisi ve alan dağılımına bağlı olduğunu, evrensel olarak $F\\propto v$ ya da $F\\propto v^2$ kabul edilemeyeceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0206",
      "heading": "Soru 6.39",
      "type": "assessment",
      "html": "<p><strong>Soru 6.39</strong>\nBir akıllı saate mıknatıslı bir kordon takıldığında pusula ölçümlerinde sapma ve hareket algılamasında dolaylı hatalar görülebilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Saatteki üç eksenli manyetik alan algılayıcısının yakınındaki kalıcı mıknatıstan neden etkilendiğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Sabit manyetik sapma ile eksenlere bağlı ölçek ve yön bozulmasının ölçümlerde nasıl farklı izler bırakabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Manyetik alan algılayıcısı, ivmeölçer ve dönüölçer verilerinin birlikte kullanılmasının yön tayinindeki hataları azaltmaya nasıl yardımcı olabileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0208",
      "heading": "Soru 6.40",
      "type": "assessment",
      "html": "<p><strong>Soru 6.40</strong>\nBazı salon bisikletlerinde direnç, iletken bir volanın yakınındaki kalıcı mıknatıslarla <strong>girdap akımlı frenleme</strong> yoluyla oluşturulur. Mıknatıslar volana temas etmeden yaklaştırıldığında kullanıcı aynı açısal hızı korumak için daha büyük mekanik güç sağlamak zorunda kalabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Dönen iletken volanda girdap akımlarının nasıl oluştuğunu ve Lenz yasasının bu akımların dönmeye zıt bir tork üretmesini nasıl açıkladığını belirtiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Mıknatıs–volan aralığının küçülmesinin, diğer koşullar sabitken manyetik bağlaşımı ve frenleme torkunu neden artırabileceğini açıklayınız.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Temassız frenlemenin, sürtünmeli bir balata sistemine göre temas kaynaklı aşınma ve gürültüyü neden büyük ölçüde azaltabildiğini; buna rağmen rulman, hava direnci ve malzeme kayıplarının tamamen ortadan kalkmadığını belirtiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Kullanıcının sağladığı mekanik enerjinin önemli bir bölümünün volanda/bileşenlerde nasıl ısıya dönüştüğünü açıklayınız.</div></div>"
    },
    {
      "id": "b0212",
      "heading": "Soru 6.41",
      "type": "assessment",
      "html": "<p><strong>Soru 6.41</strong>\nDeğişken hızlı sürücülü bazı asansörlerde motor, yük ve karşıağırlık koşullarına bağlı olarak zaman zaman jeneratör moduna geçebilir. Rejeneratif sürücü uygun biçimde tasarlanmışsa oluşan elektrik enerjisi bina elektrik sistemine veya şebekeye geri verilebilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Motorun jeneratör modunda ürettiği elektromanyetik torkun harekete zıt yönde olmasını Lenz yasası ve enerji korunumu ile açıklayınız. Bu elektromanyetik frenlemenin hız kontrolüne katkıda bulunduğunu; ancak asansör güvenliğinin <strong>mekanik emniyet frenleri, regülatörler ve diğer bağımsız güvenlik sistemleriyle</strong> de sağlandığını belirtiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Rejeneratif sürücünün enerjiyi besleme hattına geri aktaramadığı bir sistemde, üretilen enerjinin uygun bir fren direncinde Joule ısısına dönüştürülebileceğini açıklayınız. Bunun “binada o anda az elektrik tüketilmesi” ile aynı şey olmadığını; sonucun sürücü topolojisi ve şebekeye geri besleme yeteneğine bağlı olduğunu değerlendiriniz.</div></div>"
    },
    {
      "id": "b0304",
      "heading": "Soru 6.42",
      "type": "assessment",
      "html": "<p><strong>Soru 6.42</strong></p>\n<p>Vakumda yaklaşık düzgün $B=0.50\\,\\mathrm{T}$ manyetik alan bulunan $V=0.010\\,\\mathrm{m^3}$ hacimli bir bölgeyi idealize ediniz.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$u_B=B^2/(2\\mu_0)$ ile enerji yoğunluğunu ve $U=u_BV$ ile toplam manyetik alan enerjisini hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu enerji, ideal olarak $100\\,\\mathrm{W}$ güç tüketen bir aygıta aktarılabilseydi aygıtı kaç saniye çalıştırırdı?</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Aynı enerji yoğunluğuna sahip elektrik alan için $\\tfrac12\\epsilon_0E^2=B^2/(2\\mu_0)$ eşitliğinden $E$ değerini bulunuz ve $E=cB$ sonucunu gösteriniz.</div></div>"
    },
    {
      "id": "b0307",
      "heading": "Soru 6.43",
      "type": "assessment",
      "html": "<p><strong>Soru 6.43</strong></p>\n<p>Bir veri merkezinde $50\\,\\mathrm{Hz}$ veya anahtarlamalı güç bileşenleri taşıyan bir güç kablosu, bir veri kablosunun yakınından geçmektedir. İlk büyüklük düzeyi için tek iletkendeki akım genliğini $I=20\\,\\mathrm{A}$ ve uzaklığı $r=5.0\\,\\mathrm{cm}$ alınız.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Tek uzun iletken modeliyle manyetik alan genliğini hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Zamanla değişen bu alanın veri kablosunda istenmeyen gerilim indükleyebilmesini Faraday yasasıyla açıklayınız. Sabit doğru akım akımın tek başına sürekli bir indüksiyon EMK'sı üretmeyeceğini belirtiniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Gidiş-dönüş iletkenlerini yakın taşıma, bükümlü çift (bükümlü çift), ekranlama, kablo güzergâhlarını ayırma ve gerektiğinde fiber optik kullanmanın girişimi neden azalttığını değerlendiriniz.</div></div>"
    },
    {
      "id": "b0310",
      "heading": "Soru 6.44",
      "type": "assessment",
      "html": "<p><strong>Soru 6.44</strong></p>\n<p>Bir bakır plaka, güçlü bir mıknatısın kutupları arasındaki düzgün olmayan alan bölgesinden geçerken girdap akımları nedeniyle frenlenmektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Plaka alan bölgesine girerken ve çıkarken oluşan girdap akımlarının, akı değişimine karşı koyan alan üretmesini Lenz yasasıyla açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Plakanın kaybettiği kinetik enerjinin başlıca hangi enerji türüne dönüştüğünü açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Aynı geometride plastik bir plaka kullanıldığında neden belirgin girdap akımı frenlemesi oluşmadığını açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Bakırın özdirenci sıcaklıkla arttığında, düşük hız ve deri etkisinin (deri etkisi) zayıf olduğu rejimde frenleme kuvvetinin neden genellikle azalmasının beklendiğini; bunun her hız/frekans rejimi için evrensel bir $1/\\rho$ yasası olmadığını belirtiniz.</div></div>"
    },
    {
      "id": "b0311",
      "heading": "Soru 6.45",
      "type": "assessment",
      "html": "<p><strong>Soru 6.45</strong></p>\n<p>Bir elektrikli araç $m=1500\\,\\mathrm{kg}$ kütleli ve $72\\,\\mathrm{km/h}=20\\,\\mathrm{m/s}$ hızla hareket etmektedir. Araç, rejeneratif frenleme ile $10\\,\\mathrm{s}$ içinde duruyor.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Başlangıç kinetik enerjisini hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu enerjinin tamamının sabit hızla değil, toplam $10\\,\\mathrm{s}$ içinde dönüştürüldüğü düşünülürse ortalama mekanik güç büyüklüğünü bulunuz.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Enerjinin %80'i bataryaya aktarılabiliyorsa geri kazanılan enerjiyi joule ve Wh cinsinden hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Rejeneratif frenleme olmadan aynı enerji büyük ölçüde frenlerde ve lastik/yol gibi kayıp kanallarında ısıya dönüşür. Gerçek sistemde batarya şarj sınırı, motor ve güç elektroniği kayıplarının geri kazanım oranını nasıl sınırladığını değerlendiriniz.</div></div>"

      "heading": "Soru 6.67",
      "type": "assessment",
      "html": "<p><strong>Soru 6.67</strong>\nBir uzay aracının üzerinde, uzunluğu $\\ell=10$ m olan doğrusal iletken bir bağlantı elemanı bulunduğunu düşününüz. Araç, yerel büyüklüğü $B=1.0\\times10^{-3}$ T olan yaklaşık düzgün bir manyetik alan bölgesinde $v=20$ km/s hızla hareket etmektedir. <strong>$\\vec v\\perp\\vec B$ ve iletken doğrultusu $\\vec v\\times\\vec B$ yönünde</strong> kabul edilsin.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İletkenin uçları arasındaki hareket elektromotor kuvvetini (EMK)\n$$\\varepsilon=\\int(\\vec v\\times\\vec B)\\cdot d\\vec\\ell$$\nile hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Açık devrede bu EMK'nın iletkende nasıl yük ayrışmasına ve elektrostatik potansiyel farkına yol açtığını açıklayınız. Kapalı iletken döngüler veya zamanla değişen akı bulunması durumunda hangi ek etkiler ortaya çıkabilir?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Uzay aracı elektroniğinde istenmeyen indüksiyonu azaltmak için <strong>döngü alanını küçültme, gidiş-dönüş iletkenlerini birbirine yakın/bükümlü çift biçiminde taşıma, uygun topraklama ve ekranlama</strong> gibi yöntemleri açıklayınız. Faraday kafesinin özellikle elektriksel ve yüksek frekanslı elektromanyetik girişime karşı etkili olduğunu; statik manyetik alanı doğrudan ortadan kaldırmadığını belirtiniz.</div></div>"
    },
    {
      "id": "b0047",
      "heading": "Soru 6.68",
      "type": "assessment",
      "html": "<p><strong>Soru 6.68</strong>\nElektro gitarın manyetik pikapları, çelik tellerin manyetik alanı bozması prensibiyle çalışır. Her telin altında küçük bir mıknatıs ve etrafına sarılmış binlerce sarımlı bir bobin bulunur. Tel titreştiğinde, bobindeki manyetik akı değişir ve bir sinyal indüklenir.</p>\n<p>Aşağıdakilerden hangisi <strong>yanlıştır</strong>?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Tel manyetik bir malzeme (çelik) olduğu için, mıknatıs tarafından mıknatıslanır ve hareketi bobindeki akıyı değiştirir.</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Naylon (klasik gitar) telleri manyetik olmadığı için, standart manyetik pikaplarla çalışmaz.</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Telin mıknatısa yakınlığı arttıkça, indüklenen sinyalin genliği artar.</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Telin titreşim frekansı, indüklenen sinyalin frekansını belirler.</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Pikap bobinindeki sarım sayısı azaltılırsa, çıkış sinyalinin genliği artar.</div></div>"
    },
    {
      "id": "b0292",
      "heading": "Soru 6.69",
      "type": "activity",
      "html": "<p><strong>Soru 6.69</strong>\nBir MR sisteminde ana alan $B_0=3.0\\,\\mathrm{T}$ iken, konuma bağlı küçük alan değişimleri oluşturmak için gradyan bobinleri kullanılır. Bir eksen boyunca gradyan $G=30\\,\\mathrm{mT/m}$ olsun.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Aynı eksende $30\\,\\mathrm{cm}$ aralıklı iki nokta arasındaki alan farkını hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu alan farkını $B_0$ ile karşılaştırınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Gradyan alanlarının hızlı değiştirilmesinin vücutta girdapsal elektrik alan oluşturabileceğini Faraday yasasıyla açıklayınız ve bunun çevresel sinir uyarımıyla ilişkisini nitel olarak değerlendiriniz.</div></div>"
    },
    {
      "id": "b0079",
      "heading": "Soru 6.70",
      "type": "extraordinary",
      "html": "<p><strong>Soru 6.70</strong>\nElektromanyetik şekillendirmede, iletken bir metal parça kısa süreli ve hızla değişen güçlü bir manyetik alanın etkisine bırakılır. Metalde indüklenen akımların dış alanla etkileşmesi, çok kısa sürede büyük kuvvetler oluşturabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Alüminyum gibi ferromanyetik olmayan bir iletkenin bu süreçte neden kuvvet görebildiğini Faraday, Lenz ve Lorentz yasalarıyla açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Alanın ve dolayısıyla bobin akımının çok kısa sürede değişmesinin indüklenen akımlar üzerindeki etkisini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Oluşan manyetik kuvvetlerin metalin biçim değiştirmesine nasıl yol açabileceğini nitel olarak değerlendiriniz.</div></div>"
    },
    {
      "id": "b0084",
      "heading": "Soru 6.71",
      "type": "assessment",
      "html": "<p><strong>Soru 6.71</strong>\nTranskraniyal manyetik uyarım (TMU), başın dışındaki bir bobinden geçirilen kısa süreli ve hızla değişen akımlarla beyin dokusunda elektrik alan oluşturulmasına dayanır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bobin ile beyin dokusu arasında doğrudan elektriksel temas olmadan elektrik alan oluşmasını Faraday yasasıyla açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu yöntemin cerrahi girişim gerektirmeden sinir dokusunu uyarabilmesini fiziksel açıdan açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Sekiz biçimli bobin geometrisinin uyarım bölgesinin daha sınırlı tutulmasına nasıl katkı sağlayabileceğini açıklayınız.</div></div>"
    },
    {
      "id": "b0092",
      "heading": "Soru 6.72",
      "type": "assessment",
      "html": "<p><strong>Soru 6.72</strong>\nFizik laboratuvarlarında yapılan bir gösteride, demir bir çekirdek üzerine sarılı alternatif akım bobinin üzerine hafif bir alüminyum halka yerleştirilir. Akım verildiğinde halka havaya fırlar. Ancak halkada küçük bir kesik (yarık) varsa halka zıplamaz. Ayrıca, alüminyum halka sıvı azotla soğutulup deney tekrarlanırsa, halka normalden çok daha yükseğe fırlar.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Halkanın havaya fırlamasını Faraday ve Lenz yasaları ile açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Yarıklı halka neden zıplamaz?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Halka soğutulduğunda neden daha yükseğe zıplar? (Özdirenç, indüklenen akım ve manyetik kuvvet arasındaki ilişkiyi kurunuz.)</div></div>\n<p><em>Alüminyumun sıvı azotla soğutulması özdirenci düşürebilir; fakat halka üzerindeki kuvvet yalnızca $I = \\varepsilon/R$ ile belirlenmez. İndüktans, faz farkı, alternatif akım frekansı, deri etkisi ve halka geometrisi önemlidir. \"Normalden çok daha yükseğe fırlar\" ifadesi deney koşulları verilmeden kesin biçimde yazılmamalıdır; ancak özdirenç düştüğü için indüklenen akım artar ve manyetik kuvvet artar.</em></p>"
    },
    {
      "id": "b0130",
      "heading": "Soru 6.73",
      "type": "assessment",
      "html": "<p><strong>Soru 6.73</strong>\nElektrikli araçlarda rejeneratif frenleme sırasında çekiş motoru jeneratör gibi çalışır; üretilen elektrik enerjisinin bir bölümü bataryaya aktarılabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Basit dirençli jeneratör modelinde indüklenen EMK'nın dönme hızıyla orantılı olduğunu kullanarak düşük hızlarda elektromanyetik frenleme torkunun neden hız azaldıkça zayıfladığını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Gerçek araçlarda inverter sınırları, batarya doluluk durumu, sıcaklık, motor devri ve yazılım kontrolünün rejeneratif frenlemeyi nasıl sınırlayabileceğini değerlendiriniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Aynı başlangıç hızındaki iki araçtan daha büyük kütleli olanında <strong>aynı yavaşlama ivmesini</strong> elde etmek için gereken toplam fren kuvvetinin neden daha büyük olduğunu $F=ma$ ile açıklayınız. Elektromanyetik sistemin bu daha büyük kuvveti üretebilmesi için akım, manyetik akı ve motor boyutlandırması gibi hangi tasarım değişkenlerinin rol oynayacağını değerlendiriniz.</div></div>"
    },
    {
      "id": "b0136",
      "heading": "Soru 6.74",
      "type": "assessment",
      "html": "<p><strong>Soru 6.74</strong>\nGüçlü jeomanyetik fırtınalar sırasında Dünya'nın manyetik alanı zamanla değişebilir. Bu değişim, çok uzun iletken yapılarda jeoelektrik alanların etkisiyle istenmeyen akımlar oluşturabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Zamanla değişen manyetik alanın geniş bir bölgede elektrik alan oluşturmasını Faraday yasasıyla açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Etkinin uzun boru hatlarında veya iletim hatlarında neden daha belirgin olabileceğini yol boyunca oluşan gerilim farkı açısından açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Boru-toprak ara yüzündeki akımların katodik koruma düzenini bozarak bazı koşullarda korozyon riskini artırabilmesini açıklayınız.</div></div>"
    },
    {
      "id": "b0138",
      "heading": "Soru 6.75",
      "type": "assessment",
      "html": "<p><strong>Soru 6.75</strong>\nBir vinç kancasında gözle görülmeyen mikroskobik bir çatlak olup olmadığını anlamak için \"Manyetik Partikül Muayenesi\" (MPI) yapılır. Çelik kancaya önce manyetik alan uygulanır, ardından üzerine floresan demir tozu serpilir. Çatlak olmayan yerlerde toz dağılırken, çatlak olan bölgede tozlar çizgi halinde birikir ve çatlak görünür hale gelir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Manyetik alan altındaki düzgün bir çelik yüzeyde demir tozu neden birikmez, ancak bir çatlak (yarık) olduğunda tam o bölgede toplanır? (Manyetik akı sızıntısı / flux leakage kavramını açıklayınız.)</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Manyetik partikül muayenesinde çatlak, manyetik alan çizgilerine yaklaşık dik olduğunda akı sızıntısı daha belirgin olur. Çatlak yönü, alan yönüne paralel olduğunda duyarlılık azalır; ancak tamamen sıfır olmak zorunda değildir. Bu durumu değerlendiriniz.</div></div>"
    },
    {
      "id": "b0411",
      "heading": "Soru 6.76",
      "type": "yourturn",
      "html": "<p><strong>Soru 6.76</strong></p>\n<p>Bir transformatörün nüvesi tek parça iletken metal yerine ince ve yalıtılmış levhalardan yapılmıştır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bu yapının girdap akımlarını nasıl etkilediğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Levhaların manyetik akıya göre uygun yönlendirilmesinin neden önemli olduğunu belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bu önlemin bakır ve histerezis kayıplarını doğrudan ortadan kaldırıp kaldırmadığını tartışınız.</div></div>"
    },
    {
      "id": "b0431",
      "heading": "Soru 6.77",
      "type": "assessment",
      "html": "<p><strong>Soru 6.77</strong></p>\n<p>Nüvenin ince ve yalıtılmış levhalardan yapılması öncelikle hangi kaybı azaltır?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Bakır kaybı</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Girdap akımı kaybı</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Kaçak akı</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Dielektrik kaybı</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Yükün mekanik kaybı</div></div>"

      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 7.3 — Bobin enerjisi, anahtarlama ve eşdeğerlik</h2><p>Bobinde depolanan enerji U=½LI²’dir. Akım yükselirken kaynak enerjisinin bir bölümü manyetik alanda depolanır.</p><div class=\"answer-formula\">Devre açılırken bu enerji yüksek gerilim darbesine dönüşebileceğinden koruma elemanı gerekir.</div>\n<p>Bu alt başlık, manyetizmanın temel kavramlarını fiziksel model ve ölçülebilir büyüklüklerle ilişkilendirir. Tanım, yön, birim ve geçerlilik koşulları birlikte değerlendirilmelidir.</p>"

    {
      "id": "b0162",
      "heading": "Soru 7.2",
      "type": "yourturn",
      "html": "<p><strong>Soru 7.2</strong>\nBir RL devresinde, $t=0$'da anahtar kapatılıyor. Devre denklemi: $V - L\\frac{dI}{dt} - IR = 0$.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$I(t)$ çözümünü türetiniz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Akımın \"zaman sabiti\" $\\tau = L/R$'yi fiziksel olarak yorumlayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">$t \\to \\infty$ limitinde, indüktörde depolanan manyetik enerjiyi bulunuz.</div></div>"

      "heading": "Soru 7.3",
      "type": "activity",
      "html": "<p><strong>Soru 7.3</strong>\nBir otopark algılayıcısı, toprak altına gömülü bir bobinden oluşur. Araç park ettiğinde, bobinin indüktansı değişir ve osilatör frekansı kayar.</p>\n<p></p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:center\">Durum</th>\n<th style=\"text-align:center\">$L$ ($\\mu$H)</th>\n<th style=\"text-align:center\">$f$ (kHz)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:center\">Boş</td>\n<td style=\"text-align:center\">100</td>\n<td style=\"text-align:center\">159</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Araba</td>\n<td style=\"text-align:center\">85</td>\n<td style=\"text-align:center\">?</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">Kamyon</td>\n<td style=\"text-align:center\">70</td>\n<td style=\"text-align:center\">?</td>\n</tr>\n</tbody>\n</table>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$f = \\frac{1}{2\\pi\\sqrt{LC}}$ bağıntısıyla, araç ve kamyon için frekansları hesaplayınız. ($C = 10$ nF)</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Algılayıcıün, küçük bir motosikleti algılayabilmesi için $L$ değişiminin en az 5 $\\mu$H olması gerekiyor. Tasarımı nasıl iyileştirirsiniz?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Neden algılayıcı, plastik bir oyuncak arabayı algılamaz?</div></div>"
    },
    {
      "id": "b0187",
      "heading": "Soru 7.4",
      "type": "assessment",
      "html": "<p><strong>Soru 7.4</strong>\nBir devredeki akım değişimi, o devrenin kendi üzerinde bir EMK indükler: $\\varepsilon_L = -L\\frac{dI}{dt}$.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Özindüktansın ($L$), devrenin geometrisine (sarım sayısı, kesit alanı, uzunluk) nasıl bağlı olduğunu türetiniz. (Solenoid için)</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bir devrede akım aniden kesilirse, özindüktans neden kıvılcım oluşumuna neden olur?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Enerji korunumu açısından, indüktörde depolanan manyetik enerjiyi ($U = \\frac{1}{2}LI^2$) türetiniz.</div></div>"
    },
    {
      "id": "b0216",
      "heading": "Soru 7.5",
      "type": "assessment",
      "html": "<p><strong>Soru 7.5</strong>\nDinamik kablosuz güç aktarımı tasarımlarında yol altındaki verici bobinler ile aracın altındaki alıcı bobinler arasında hareket hâlindeyken enerji aktarılması amaçlanır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Alıcı bobinin vericiye göre düşey uzaklığının veya yanal hizasızlığının artmasının karşılıklı indüktansı $M$ ve kuplaj katsayısını neden azaltabileceğini açıklayınız. Gerçek bobinlerin çalışma mesafelerinde kuplajın evrensel olarak tam bir $1/r^3$ yasasına uymadığını; bu ölçeklemenin ancak uygun dipol/uzak-alan yaklaşımında kullanılabileceğini belirtiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bobin geometrisi, ferrit yapılar, çalışma frekansı, rezonans ayarı ve hizalamanın güç aktarım verimi üzerindeki rollerini değerlendiriniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Yolun tüm bobinlerini araç yokken sürekli tam güçte çalıştırmak yerine yalnız ilgili segmentlerin etkinleştirilmesinin enerji kaybı, yabancı cisim ısınması ve elektromanyetik uyumluluk açısından neden yararlı olduğunu açıklayınız. Araç algılamanın hangi algılayıcı/iletişim yöntemleriyle yapılabileceğine örnek veriniz.</div></div>"
    },
    {
      "id": "b0321",
      "heading": "Soru 7.6",
      "type": "assessment",
      "html": "<p><strong>Soru 7.6</strong></p>\n<p>Bir RL devresinde $L = 0.5$ H, $R = 10 \\, \\Omega$ ve $V = 20$ V'dur. $t = 0$ anında anahtar kapatılmaktadır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Devrenin zaman sabitini hesaplayınız. ($\\tau = L/R$)</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">$t = \\tau$ anında akım nedir? ($I(\\tau) = I_0(1 - e^{-1}) \\approx 0.632 I_0$)</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">$t \\to \\infty$ limitinde akım nedir?</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Anahtar aniden açılırsa, indüktördeki enerji nereye gider? Kıvılcım oluşumunu açıklayınız.</div></div>"
    },

      "heading": "Soru 7.7",

    },

      "heading": "Etkinlik 8.8",
      "type": "activity",
      "html": "<h3>Etkinlik 8.8 — Sarım Oranı Verilerinin Analizi</h3><p>Bir eğitim transformatöründe birincil gerilim sabit tutulurken farklı ikincil sarım sayıları için ikincil gerilimi ölçünüz. <span class=\"math-inline\">$V_s$</span>–<span class=\"math-inline\">$N_s$</span> grafiğini çiziniz; eğimi kuramsal modelle karşılaştırınız. Belirsizlik kaynaklarını sarım sayımı, ölçü aleti çözünürlüğü, kaçak akı ve besleme gerilimi bakımından tartışınız.</p><p><strong>Güvenlik:</strong> Yalnızca öğretmen gözetiminde, güvenli düşük gerilimli AC eğitim kaynağı kullanınız; şebeke gerilimine doğrudan bağlanmayınız.</p>"
