      "heading": "Soru 12.2",
      "type": "assessment",
      "html": "<p><strong>Soru 12.2</strong>\nManyetik rezonans (MR) sistemleri güçlü bir ana manyetik alan kullanır. Bir implantın MR ortamındaki davranışı; malzemenin türüne, geometrisine, manyetik duyarlılığına, elektriksel iletkenliğine ve üretici tarafından belirtilen güvenlik koşullarına bağlıdır.</p>\n<p>3 T manyetik alanda bulunan 5 g kütleli titanyum bir vida için $dB/dz=100\\,\\mathrm{T/m}$, $\\chi=1.2\\times10^{-4}$ ve $\\rho_{Ti}=4500\\,\\mathrm{kg/m^3}$ alınsın.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$F\\approx \\frac{\\chi V}{\\mu_0}B\\frac{dB}{dz}$ bağıntısıyla kuvveti yaklaşık olarak hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu kuvveti vidanın ağırlığıyla karşılaştırınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Paslanmaz çeliğin tek bir manyetik malzeme sınıfı olmadığını dikkate alarak östenitik, ferritik ve martenzitik türlerin MR ortamındaki davranışlarının neden farklı olabileceğini açıklayınız.</div></div>\n<p>Gerçek MR güvenliği; statik alanın kuvvet ve tork etkileri yanında zamanla değişen gradyan alanları, radyo frekansı alanlarının yol açabileceği ısınma ve cihaz için belirtilen kullanım koşulları birlikte değerlendirilerek belirlenir.</p>"
    },
    {
      "id": "b0090",
      "heading": "Soru 12.3",
      "type": "assessment",
      "html": "<p><strong>Soru 12.3</strong>\nBir tokamak füzyon reaktöründe, plazmayı hapsetmek için toroid şeklinde bir manyetik alan kullanılır. Toroidin iç yarıçapı $a$, dış yarıçapı $b$ ve toplam sarım sayısı $N$'dir. Bobinlerden $I$ akımı geçirilmektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Toroidin içinde ($a &lt; r &lt; b$), merkezden $r$ uzaklığındaki manyetik alanı bulunuz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">İç çeperdeki ($r = a$) alan ile dış çeperdeki ($r = b$) alan arasındaki farkı hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Plazmanın kararlılığı için bu alan farkının neden önemli olduğunu fiziksel olarak açıklayınız. (Grad-B sürüklenmesi)</div></div>"
    },
    {
      "id": "rev-exp-2-01",
      "heading": "Deney 12.4",
      "type": "experiment",
      "html": "<h3>Deney 12.4: Solenoid alanının ölçülmesi</h3>Düşük gerilimli güç kaynağı, solenoid ve Hall sensörü kullanınız. I ve sarım yoğunluğunu bağımsız değişken yapıp B=μ₀nI modelini test ediniz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Güvenlik</span><div class=\"subquestion-text\">Güç kaynağını kapatmadan devre bağlantısını değiştirmeyiniz; mıknatısları elektronik cihazlardan uzak tutunuz.</div></div>"
    },
    {
      "id": "b0117",
      "heading": "Soru 12.5",
      "type": "experiment",
      "html": "<p><strong>Soru 12.5</strong>\nBir araştırmacı, kalınlığı $t = 2.0$ mm olan bir germanyum levhanın Hall etkisini incelemektedir. Levhadan $I = 20.0$ mA akım geçirilmekte ve farklı manyetik alan değerleri için Hall gerilimi ($V_H$) ölçülmektedir. Ancak araştırmacı, ölçüm problarının tam olarak karşılıklı yerleştirilememesi nedeniyle, manyetik alan sıfır olsa bile cihazın belirli bir <strong>sıfır kayması (sıfır kayması) gerilimi</strong> ($V_0$) okuduğunu fark eder.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:center\">$B$ (T)</th>\n<th style=\"text-align:center\">$V_{ölç}$ (mV)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:center\">0.0</td>\n<td style=\"text-align:center\">0.8</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">0.2</td>\n<td style=\"text-align:center\">1.4</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">0.4</td>\n<td style=\"text-align:center\">2.0</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">0.6</td>\n<td style=\"text-align:center\">2.6</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">0.8</td>\n<td style=\"text-align:center\">3.2</td>\n</tr>\n</tbody>\n</table>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Tablodaki verileri kullanarak, germanyum numunedeki yük taşıyıcılarının birim hacimdeki sayısını ($n$) bulunuz. ($e = 1.6 \\times 10^{-19}$</div></div>\n<p><em>Model notu: $B=0$ satırındaki $V_0=0.8$ mV değeri ölçüm sıfır kaymasıidir; Hall geriliminin $B$'ye bağlı kısmını bulurken bu sıfır kayması çıkarılmalıdır. Tablo yalnız gerilim büyüklüğü verdiği için taşıyıcıların işareti bu verilerden tek başına belirlenemez; bunun için gerilim polaritesi ile $\\vec I$ ve $\\vec B$ yönleri birlikte kullanılmalıdır.</em></p>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Yük taşıyıcılarının elektron mu yoksa deşik (deşik) mu olduğunu belirlemek için araştırmacının manyetik alanın yönünü ve akımın yönünü kullanarak nasıl bir fiziksel test yapması gerektiğini, Lorentz kuvvetinin yönünden yola çıkarak açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Eğer numune kalınlığı $t$ iki katına çıkarılıp akım $I$ sabit tutulsaydı, aynı $B$ değerleri için ölçülen $V_H$ değerleri nasıl değişirdi? Fiziksel gerekçesiyle açıklayınız.</div></div>"
    },
    {
      "id": "b0122",
      "heading": "Soru 12.6",
      "type": "extraordinary",
      "html": "<p><strong>Soru 12.6</strong>\nYörüngedeki bir uzay aracından uzun bir iletken halat uzatıldığını düşününüz. Halat, aracın yörünge hızıyla Dünya'nın manyetik alanını kesmektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Uygun geometri için halat boyunca hareket EMK'sının\n$$\\varepsilon=\\int(\\vec v\\times\\vec B)\\cdot d\\vec\\ell$$\nile nasıl oluştuğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Gerçek bir elektrodinamik halatta akımın yalnızca “halatın iki ucunu bir dirençle bağlamakla” kapanmadığını; elektron toplayıcı/verici uç elemanları aracılığıyla çevredeki iyonosferik plazmanın devrenin bir parçası olduğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Devre kapandığında halattaki akıma etki eden $d\\vec F=I,d\\vec\\ell\\times\\vec B$ kuvvetinin uygun çalışma kipinde yörünge hareketine zıt bileşen üretmesini ve mekanik yörünge enerjisinin elektriksel/ısıl enerjiye dönüşerek deorbit sağlamasını değerlendiriniz.</div></div>"
    },
    {
      "id": "b0132",
      "heading": "Soru 12.7",
      "type": "assessment",
      "html": "<p><strong>Soru 12.7</strong>\nEski katot ışın tüplü ekranlarda elektron tabancasından çıkan elektronlar, manyetik sapma bobinleriyle ekranın farklı noktalarına yönlendirilirdi.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Elektron demetinin yatay ve düşey yönde taranması için iki ayrı manyetik alan bileşeninin nasıl kullanılabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Ekranın yakınında güçlü bir mıknatıs bulunduğunda elektron yörüngelerinin ve görüntünün neden bozulabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Güncel düz panel ekranlarda görüntünün elektron demetinin manyetik olarak taranmasıyla oluşturulmamasının temel nedenini açıklayınız.</div></div>"
    },
    {
      "id": "b0135",
      "heading": "Soru 12.8",
      "type": "assessment",
      "html": "<p><strong>Soru 12.8</strong>\nKöpekbalıkları ve vatozlarda bulunan Lorenzini ampulleri çok zayıf elektrik alanlarını algılayabilen elektroalgılayıcılardir; deneysel çalışmalarda eşiklerin tür ve koşullara bağlı olarak nV/cm–sub-µV/cm büyüklük düzeyilerine kadar inebildiği gösterilmiştir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bir av hayvanının kas ve sinir etkinliğinin iletken deniz suyunda zayıf elektrik alanlar oluşturmasını biyolojik akım kaynakları açısından açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">İletken bir organizmanın Dünya'nın manyetik alanında hareket etmesi durumunda $\\vec v\\times\\vec B$ kaynaklı elektriksel etkilerin prensipte ortaya çıkabileceğini açıklayınız; ancak bu etkiyi Lorenzini ampullerinin tek veya temel çalışma mekanizması olarak sunmanın neden doğru olmadığını değerlendiriniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Hall algılayıcısı ile biyolojik elektroreseptör arasındaki temel farkları; taşıyıcı fiziği, sinyal türü ve algılama mekanizması açısından karşılaştırınız.</div></div>"
    },
    {
      "id": "b0173",
      "heading": "Soru 12.9",
      "type": "extraordinary",
      "html": "<p><strong>Soru 12.9</strong>\nManyetize bir uzay aracı ile seyrek plazma arasındaki etkileşim gerçek durumda kinetik plazma fiziği gerektirir. Bu soruda yalnızca boyutsal olarak tutarlı bir <strong>ölçekleme modeli</strong> incelenecektir:\n$$F\\sim C,\\sigma B^2 v V_{etkili},$$\nburada $C$ boyutsuz bir geometri katsayısı, $\\sigma$ plazmanın etkin iletkenliği ve $V_{etkili}$ etkileşim hacmidir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Sağ tarafın kuvvet boyutuna sahip olduğunu SI birimleriyle doğrulayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu bağıntının evrensel bir manyetik fren yasası olmadığını; gerçek kuvvetin plazma yoğunluğu, çarpışma rejimi, alan topolojisi ve sınır koşullarına bağlı olduğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Model içinde $B$ veya $v$ değiştiğinde kuvvetin nasıl ölçeklendiğini yorumlayınız ve düşük yoğunluklu uzay plazmasında “iletken akışkan” yaklaşımının hangi koşullarda yetersiz kalabileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0332",
      "heading": "Soru 12.10",
      "type": "extraordinary",
      "html": "<p><strong>Soru 12.10</strong></p>\n<p>Alçak Dünya yörüngesinde hareket eden bir uydunun uzunluğu $\\ell=2.0\\,\\mathrm{m}$ olan iletken elemanı için ideal maksimum-geometri yaklaşımı kullanılsın: $v=7.8\\,\\mathrm{km/s}$, $B=30\\,\\mu\\mathrm{T}$, $\\vec v\\perp\\vec B$ ve iletken $\\vec v\\times\\vec B$ yönünde olsun.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Uçlar arasındaki hareket EMK'sını $\\varepsilon=B\\ell v$ ile hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Açık devrede bu EMK'nın yük ayrışmasına nasıl yol açtığını; kapalı devrede akımın devre direnci ve geometrisine bağlı olacağını açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Eşdeğer kapalı yol direnci $R=0.20\\,\\Omega$ olan yalnızca ideal bir modelde $I=\\varepsilon/R$ değerini bulunuz. Gerçek uydu yapısında çoklu akım yolları, plazma etkileşimi ve yönelimin bu basit sonucu değiştireceğini belirtiniz.</div></div>"
    },
    {
      "id": "b0262",
      "heading": "SÖZLÜK",
      "type": "glossary",
      "html": "<h1>SÖZLÜK</h1>\n<p><strong>Ampère yasası:</strong> Durağan akımlar için kapalı bir yol boyunca manyetik alanın çizgi integralini, yolun çevrelediği net akımla ilişkilendiren yasa.</p>\n<p><strong>Bağlaşım katsayısı ($k$):</strong> İki bobin arasındaki manyetik bağlaşmanın 0 ile 1 arasındaki boyutsuz ölçüsü.</p>\n<p><strong>Biot-Savart yasası:</strong> Bir akım elemanının uzaydaki bir noktada oluşturduğu manyetik alan katkısını veren bağıntı.</p>\n<p><strong>Coğrafi kuzey:</strong> Dünya'nın dönme ekseninin kuzey yönündeki kesişim noktasına göre tanımlanan yön.</p>\n<p><strong>Deklinasyon:</strong> Yerel manyetik kuzey ile coğrafi kuzey arasındaki yatay açı.</p>\n<p><strong>Diyamanyetik:</strong> Uygulanan manyetik alana zayıf ve karşı yönlü tepki veren malzeme sınıfı.</p>\n<p><strong>Elektromotor kuvvet (EMK):</strong> Bir devrede birim yük başına aktarılan enerjiyi temsil eden ve volt birimiyle ölçülen büyüklük.</p>\n<p><strong>Faraday yasası:</strong> Manyetik akıdaki zamansal değişim ile indüklenen EMK arasındaki ilişkiyi veren yasa.</p>\n<p><strong>Ferromanyetik:</strong> Manyetik bölge yapısı nedeniyle güçlü ve geçmişe bağlı manyetik tepki gösterebilen malzeme sınıfı.</p>\n<p><strong>Girdap akımı:</strong> Hacimli bir iletkende değişen manyetik akı nedeniyle oluşan kapalı akım yolları.</p>\n<p><strong>Hall etkisi:</strong> Akım taşıyan bir malzemede manyetik alan nedeniyle enine yük ayrışması ve Hall gerilimi oluşması.</p>\n<p><strong>Helmholtz bobinleri:</strong> Merkez çevresinde yaklaşık düzgün manyetik alan üretmek amacıyla kullanılan özdeş ve eş eksenli bobin çifti.</p>\n<p><strong>İnklinasyon:</strong> Yerel manyetik alan vektörü ile yatay düzlem arasındaki açı.</p>\n<p><strong>Kalıcı mıknatıslanma:</strong> Dış manyetik alan kaldırıldıktan sonra ferromanyetik malzemede kalan mıknatıslanma.</p>\n<p><strong>Lenz yasası:</strong> İndüklenen akımın, kendisini oluşturan manyetik akı değişimine karşı koyacak yönde olduğunu belirten ilke.</p>\n<p><strong>Lorentz kuvveti:</strong> Elektrik ve manyetik alanların yüklü parçacık üzerindeki toplam kuvveti. Manyetik bileşen $q(\\vec v\\times\\vec B)$ biçimindedir.</p>\n<p><strong>Manyetik akı:</strong> Bir yüzeyden geçen manyetik alanın yüzey normali doğrultusundaki toplam etkisini ölçen büyüklük.</p>\n<p><strong>Manyetik alan ($\\vec B$):</strong> Hareketli yükler ve akımlar üzerindeki manyetik etkileşimi tanımlayan vektörel alan.</p>\n<p><strong>Manyetik dipol momenti:</strong> Bir akım ilmeğinin veya eşdeğer bir manyetik dipolün alanla etkileşme gücünü ve yönünü belirleyen vektör.</p>\n<p><strong>Manyetik rijitlik:</strong> $B\\rho=p/|q|$ bağıntısıyla tanımlanan ve bir parçacık demetini manyetik alanla bükmek için gereken alan-yarıçap ölçeğini belirleyen büyüklük.</p>\n<p><strong>Manyetozom:</strong> Bazı manyetotaktik bakterilerde manyetik mineral kristallerini içeren hücresel yapı.</p>\n<p><strong>Meissner etkisi:</strong> Bir süperiletkenin uygun koşullarda manyetik akıyı hacminden büyük ölçüde dışlaması.</p>\n<p><strong>Özindüktans ($L$):</strong> Bir devredeki akım değişiminin aynı devrede EMK oluşturma eğilimini belirleyen devre büyüklüğü.</p>\n<p><strong>Paramanyetik:</strong> Uygulanan manyetik alana zayıf ve alan yönünde tepki veren malzeme sınıfı.</p>\n<p><strong>Rezonans frekansı:</strong> Bir salınım sisteminin doğal frekansı. İdeal $LC$ devresinde $f_0=1/(2\\pi\\sqrt{LC})$.</p>\n<p><strong>Siklotron frekansı:</strong> Düzgün manyetik alanda yüklü parçacığın dairesel hareket frekansı. Klasik sınırda $f=|q|B/(2\\pi m)$.</p>\n<p><strong>Süperiletken:</strong> Uygun sıcaklık ve alan koşullarında çok küçük doğru akım direnci ve özgün manyetik davranış gösterebilen malzeme.</p>\n<p><strong>Süperpozisyon:</strong> Birden fazla kaynağın oluşturduğu toplam alanın, ayrı katkıların vektörel toplamıyla bulunması ilkesi.</p>\n<p><strong>Toroid:</strong> Akım sargılarının kapalı halka geometrisinde düzenlendiği yapı.</p>\n<p><strong>Tersleyici alan:</strong> Histerezis bağlamında, kalıcı mıknatıslanmayı sıfıra indirmek için gereken ters yönlü alanın karakteristik değeri.</p>\n<p><strong>Zaman sabiti:</strong> Bir sistemde geçici davranışın karakteristik zaman ölçeği. Seri $RL$ devresinde $\\tau=L/R$.</p>"
    },

      "heading": "KAYNAKÇA",
      "type": "references",
      "html": "<h1>KAYNAKÇA</h1>\n<ol>\n<li>Halliday, D., Resnick, R. ve Walker, J. (2014). <em>Fundamentals of Physics</em> (10. baskı). Wiley.</li>\n<li>Griffiths, D. J. (2017). <em>Introduction to Electrodynamics</em> (4. baskı). Cambridge University Press.</li>\n<li>Purcell, E. M. ve Morin, D. J. (2013). <em>Electricity and Magnetism</em> (3. baskı). Cambridge University Press.</li>\n<li>Millî Eğitim Bakanlığı. (2024). <em>Türkiye Yüzyılı Maarif Modeli Lise Fizik Dersi Öğretim Programı</em>.</li>\n<li>National Aeronautics and Space Administration. Pulsarlar, nötron yıldızları ve manyetik alanlarla ilgili bilimsel kaynaklar.</li>\n<li>U.S. Food and Drug Administration. Manyetik rezonans görüntülemede statik alan, gradyan alanları ve radyo frekansı güvenliğiyle ilgili kaynaklar.</li>\n<li>National Institute of Mental Health. Transkraniyal manyetik uyarımın fiziksel çalışma ilkesine ilişkin kaynaklar.</li>\n<li>European Organization for Nuclear Research. Süperiletken hızlandırıcı mıknatısları ve parçacık demeti fiziğiyle ilgili kaynaklar.</li>\n<li>Roth, B. J. (2024). “The magnetocardiogram.” <em>Biophysics Reviews</em>, 5(2), 021305.</li>\n<li>Malmivuo, J. ve Plonsey, R. (1995). <em>Bioelectromagnetism: Principles and Applications of Bioelectric and Biomagnetic Fields</em>. Oxford University Press.</li>\n<li>Wesson, J. (2011). <em>Tokamaks</em> (4. baskı). Oxford University Press.</li>\n<li>Jackson, J. D. (1999). <em>Classical Electrodynamics</em> (3. baskı). Wiley.</li>\n</ol>"

    {
      "id": "b0264",
      "heading": "GÖRSEL KAYNAKÇASI",

      "html": "<h2>GÖRSEL KAYNAKÇASI</h2>\n<ul>\n<li><p>Şekil 1.1: Özdeş iki N kutbu arasındaki alan süperpozisyonu - komisyon/yazar tarafından hazırlanmış şema.</p>\n</li>\n<li><p>Şekil 1.2: Lorentz kuvveti yön şeması - komisyon/yazar tarafından hazırlanmış şema.</p>\n</li>\n<li><p>Şekil 2.1: Koaksiyel kablo kesiti - komisyon/yazar tarafından hazırlanmış şema.</p>\n</li>\n<li><p>Şekil 2.2: Helmholtz bobinleri - komisyon/yazar tarafından hazırlanmış şema.</p>\n</li>\n<li><p>Şekil 3.1: Hall levhası ve polarite - komisyon/yazar tarafından hazırlanmış şema.</p>\n</li>\n<li><p>Şekil 3.2: Yüklü parçacık yörüngesi - komisyon/yazar tarafından hazırlanmış şema.</p>\n</li>\n<li><p>Şekil 4.1: Lenz yasası mıknatıs-halka geometrisi - komisyon/yazar tarafından hazırlanmış şema.</p>\n</li>\n<li><p>Şekil 4.2: Faraday diski - komisyon/yazar tarafından hazırlanmış şema.</p>\n</li>\n</ul>"

      "heading": "GENEL AĞ KAYNAKÇASI",
      "type": "references",
      "html": "<h2>GENEL AĞ KAYNAKÇASI</h2>\n<ul>\n<li>Millî Eğitim Bakanlığı - Türkiye Yüzyılı Maarif Modeli lise fizik öğretim programı.</li>\n<li>National Aeronautics and Space Administration - pulsarlar ve nötron yıldızlarının manyetik alanları.</li>\n<li>U.S. Food and Drug Administration - manyetik rezonans görüntüleme güvenliği.</li>\n<li>National Institute of Mental Health - transkraniyal manyetik uyarımın fiziksel çalışma ilkesi.</li>\n<li>European Organization for Nuclear Research - süperiletken hızlandırıcı mıknatısları ve parçacık demeti fiziği.</li>\n</ul>"
    },
    {
      "id": "rev-source-note",
      "heading": "Akademik Kaynaklar ve Soru Tasarım Çerçevesi",
      "type": "references",
      "html": "<h2>AKADEMİK KAYNAKLAR VE SORU TASARIM ÇERÇEVESİ</h2><p>Bu fasikülün yeni soru ve etkinlikleri, kaynakların özgün problem metinlerini kopyalamadan; konu sıralaması, düşünme biçimi, deney tasarımı ve zorluk profili incelenerek hazırlanmıştır.</p><ul><li><strong>Yerli olimpiyat çizgisi:</strong> TÜBİTAK Bilim Olimpiyatları birinci aşama sınavları ve müfredat PDF’leri; Yüksel Öztaş, <em>TÜBİTAK Ulusal Fizik Olimpiyatı Soruları ve Çözümleri</em>; Halil İbrahim Gündoğdu, <em>Ulusal Fizik Olimpiyatı Denemeleri ve Çözümleri</em>; <em>Ulusal Fizik Olimpiyatı Soru ve Çözümleri 1993–2012</em>; fizikolimpiyatlari.com arşivi. Bu çizgiden giriş–çıkış geometrisi, kısa model seçimi, yön tayini ve sınav tipi çok adımlı sorular alındı.</li><li><strong>Kavramsal elektromanyetizma:</strong> Purcell–Morin, <em>Electricity and Magnetism</em>; Halliday–Resnick–Walker, <em>Fundamentals of Physics</em>; Feynman, <em>The Feynman Lectures on Physics II</em>. Bu kaynaklardan enerji korunumu, alanın iş yapmaması, Lenz yasasının fiziksel anlamı, dipol ve indüksiyon sezgisi işlendi.</li><li><strong>Matematiksel çerçeve:</strong> Griffiths, <em>Introduction to Electrodynamics</em>. Süperpozisyon, Biot–Savart, Ampère yasası, simetri, sınır koşulları, dipol yaklaşımı ve yer değiştirme akımı temaları kullanıldı.</li><li><strong>Olimpiyat problem çözme:</strong> I. E. Irodov, <em>Problems in General Physics</em>; S. S. Krotov, <em>Aptitude Test Problems in Physics</em>; geçmiş IPhO, APhO ve USAPhO soruları. Buradan sınır durumları, kısıtlı geometri, belirsizlik, enerji hesabı ve sezgisel tuzak içeren ileri soruların yapısı incelendi.</li><li><strong>Uygulama ve deney:</strong> Lorrain–Corson, <em>Electromagnetism: Principles and Applications</em>; MIT OpenCourseWare elektromanyetizma problem setleri; TÜBİTAK 2204-A proje rehberi. Ölçüm tablosu, kontrol değişkenleri, kalibrasyon, hata kaynakları, verim ve model karşılaştırma protokolleri eklendi.</li><li><strong>Genel pedagojik destek:</strong> Serway–Jewett, Giancoli, Young–Freedman, OpenStax ve üniversite demonstrasyon kaynakları. Temelden olimpiyat düzeyine kademeli geçiş, günlük yaşam bağlamı ve grafik/veri yorumlama dengelendi.</li></ul><p><strong>Etik, özgünlük ve kullanım notu:</strong> Yeni sorular özgün olarak yazılmıştır. Kaynaklar, problem fikri ve çözüm stratejisi düzeyinde akademik çerçeve olarak kullanılmış; hiçbir soru doğrudan kopyalanmamıştır. Özel kişi veya ticari marka adı eğitimsel bağlam dışında kullanılmamıştır; kurum, proje ve bilim insanı adları yalnızca kaynak/terim belirtmek içindir. Metin ve sorular özgün olarak yeniden yazılmıştır; kaynakların özgün problem metinleri, çözümleri veya görselleri çoğaltılmamıştır. Gerçek deneylerde yalnızca düşük gerilimli, güvenli düzenekler kullanılmalı ve öğretmen gözetimi sağlanmalıdır.</p>"
    }
  ]
}</script><script>

function plainText(html){return String(html||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim()}
function answerText(text,context){
  let t=plainText(text), c=plainText(context||''), hay=t+' '+c;
  if(/itme.*çekme|kalıcı mıknatıs/i.test(hay))return 'A çubuğu kalıcı mıknatıstır; itme yalnızca aynı kutuplar arasında kesin kanıttır. B çubuğunun iki ucunun da çekilmesi, yumuşak demirde indüklenmiş zıt kutbun oluşmasıyla açıklanır; çekilme tek başına kalıcı mıknatıs kanıtı değildir.';
  if(/mıknatıs.*ikiye|çubuk mıknatıs.*parçalan/i.test(hay))return 'Her parça kendi N ve S kutbuna sahip yeni bir mıknatıs olur; tek kutup oluşmaz. Dışarıdaki alan çizgileri N’den S’ye, mıknatısın içinde S’den N’ye devam eden kapalı çizgilerdir.';
  if(/orta nokt.*net.*alan|N kutupları.*karşı karşıya/i.test(hay))return 'Simetri nedeniyle orta noktada iki alanın büyüklüğü eşit, yönleri zıt olur ve net alan sıfırdır. Bu sonuç mıknatısların birbirine uyguladığı kuvvetin sıfır olduğunu göstermez; kuvvet alanın uzaysal değişimine bağlıdır.';
  if(/alan çizg.*kesiş|demir tozu.*pusula/i.test(hay))return 'Demir tozu alan çizgilerinin biçimini nitel olarak, pusula ise o noktadaki alanın yönünü gösterir. Alan çizgileri aynı noktada kesişemez; çünkü bir noktadaki manyetik alanın tek bir yönü vardır.';
  if(/B.*d\^{-3}|d\^{-3}|eşik alan|kamış anahtar/i.test(hay))return 'B–d⁻³ grafiği çizilmelidir; doğruya yakınlık uzak alan modelini sınar ve eğim dipolün etkin manyetik momentiyle ilişkilidir. Eşik için B=2,0 mT koşulu kullanılır; verilen ölçümler arasında sınır yaklaşık 15–16 mm’dir. Çelik kasa alanı bozabileceği için serbest uzay modeli tek başına montaj toleransı vermez.';
  if(/aurora|statik manyetik alan.*iş yapmaz/i.test(hay))return 'Manyetik kuvvet hız vektörüne dik olduğundan doğrudan iş yapmaz. Parçacıklar elektrik alanlardan, manyetik yeniden bağlanmadan veya plazma dalgalarından enerji kazanabilir; manyetik alan ise yörüngeyi bükerek parçacıkları kutup bölgelerine yönlendirir.';
  if(/transformatör|sarım|V₂\/V₁|N₂\/N₁/i.test(hay))return 'İdeal transformatörde V₂/V₁=N₂/N₁ ve V₁I₁≈V₂I₂ olur. Gerçek transformatörde direnç, histerezis ve kaçak akı kayıpları nedeniyle verim %100’den küçüktür.';
  if(/indüksiyon|Faraday|Lenz|manyetik akı/i.test(hay))return 'ε=−dΦ_B/dt bağıntısı kullanılır. İndüksiyon için akının değişmesi gerekir; eksi işareti oluşan akımın akıdaki değişime karşı koyduğunu, yani Lenz yasasını gösterir.';
  if(/Lorentz|yüklü parçacık|akım taşıyan iletken|manyetik kuvvet/i.test(hay))return 'Noktasal yük için F=qvB sinθ, iletken için F=ILB sinθ kullanılır. Kuvvet v veya I ile B’nin oluşturduğu düzleme diktir; θ=0°’de sıfır, θ=90°’de maksimumdur. Yön sağ el kuralıyla bulunur; negatif yükte yön ters çevrilir.';
  if(/grafik|veri|ölçüm|kalibrasyon/i.test(hay))return 'Bağımsız değişken yatay, bağımlı değişken düşey eksene birimleriyle yerleştirilir. Modelin doğrusal olup olmadığı uygun dönüşümle test edilir; eğim fiziksel sabiti, saçılma ve sistematik kayma ise ölçüm hatalarını gösterir.';
  if(/dipol|gradyan/i.test(hay))return 'Düzgün alanda dipol net kuvvetten çok tork yaşar. Net öteleme kuvveti için alanın uzayda değişmesi, yani gradyan gerekir; kuvvetin yönü dipol yönelimine ve alanın büyüklüğünün değişimine bağlıdır.';
  if(/enerji|güç|verim/i.test(hay))return 'Enerji veya güç hesabında SI birimleri kullanılmalı; giriş ve çıkış büyüklükleri karşılaştırılmalıdır. Verim η=Pçıkış/Pgiriş olup gerçek düzeneklerde kayıplar nedeniyle 1’den küçüktür.';
  if(/sağ el|yönünü|yönü/i.test(hay)&&/alan|kuvvet|akım/i.test(hay))return 'Önce vektörler aynı koordinat sisteminde gösterilir, ardından ilgili çapraz çarpım ve sağ el kuralı uygulanır. Yük negatifse Lorentz kuvvetinin yönü tersine çevrilir.';
  if(/\$|formül|hesapla|bulunuz|kaçtır|tahmin/i.test(hay))return 'İlgili fizik yasası yazılır, verilenler SI birimlerine çevrilir ve yerine konur. Sonuç birimiyle verilir; işaret, büyüklük mertebesi ve model varsayımları kontrol edilir.';
  return 'Soruda verilen fiziksel durum ilgili manyetizma yasasıyla modellenir; kavram, yön ve sonuç birlikte gerekçelendirilir. Beklenen yanıt yalnızca sonuç değil, sonucu doğuran fiziksel açıklamayı da içermelidir.';
}
function choiceAnswer(b){
  let el=document.createElement('div');el.innerHTML=b.html;let items=[...el.querySelectorAll('.choice-item')];let t=plainText(b.html);let correct='';
  if(/parçalan|ikiye ayrıl/i.test(t))correct='B';
  else if(/itme.*çekme|çekme yerine.*itme/i.test(t))correct='A';
  else if(/θ\s*=\s*0|paralel/i.test(t)&&/kuvvet/i.test(t))correct=items.find(x=>/sıfır|etki etmez/i.test(x.textContent))?.dataset.choice||'';
  else if(/indüksiyon|Faraday|Lenz/i.test(t))correct=items.find(x=>/akı|değiş|karşı koy/i.test(x.textContent))?.dataset.choice||'';
  else if(/transformatör/i.test(t))correct=items.find(x=>/sarım|gerilim|N₂|N1|N₂/i.test(x.textContent))?.dataset.choice||'';
  if(!correct)correct='';
  return correct?'<strong>Doğru seçenek: '+correct+'</strong><br>'+answerText(t,t):answerText(t,t);
}
function answerFor(b){
  let root=document.createElement('div');root.innerHTML=b.html;let subs=[...root.querySelectorAll('.subquestion-item')];
  if(root.querySelector('.choice-item'))return {html:choiceAnswer(b)};

  return {html:'<p>'+answerText(b.html,b.html)+'</p>'};
}

<script>
(function(){
  var originalRenderA4=window.renderA4;
  function densityScore(el){
    var text=(el.textContent||'').length;
    var media=el.querySelectorAll('img,svg,table,.answer-space,.answer-space.long').length;
    return Math.max(el.offsetHeight||0,42)+text*.035+media*18;
  }
  function balanceCurrentPage(){
    var a=document.getElementById('a4'),p=typeof currentPage==='function'?currentPage():null;
    if(!a||!p||p.layout==='single')return;
    var blocks=[...a.querySelectorAll(':scope > .block')];
    if(!blocks.length)return;
    var specials=[...a.children].filter(function(el){return !el.classList.contains('block')});
    var full=[],normal=[];
    blocks.forEach(function(el){
      var id=el.dataset.id,place=(p.placements||{})[id]||'auto';
      if(place==='full'||el.classList.contains('full'))full.push(el);else normal.push({el:el,place:place,score:densityScore(el)});
    });
    var cols=[document.createElement('div'),document.createElement('div')];
    cols.forEach(function(c){c.className='balanced-column'});
    var loads=[0,0];
    normal.forEach(function(item){
      var target=item.place==='left'?0:item.place==='right'?1:(loads[0]<=loads[1]?0:1);
      cols[target].append(item.el);loads[target]+=item.score;
    });
    a.replaceChildren(...specials);
    full.forEach(function(el){el.classList.add('balanced-full');a.append(el)});
    var wrap=document.createElement('div');wrap.className='balanced-columns';wrap.append(cols[0],cols[1]);a.append(wrap);
    requestAnimationFrame(function(){
      var actual=[cols[0].scrollHeight,cols[1].scrollHeight];
      if(Math.max(...actual)-Math.min(...actual)>150){
        var tall=actual[0]>actual[1]?0:1,short=1-tall,last=cols[tall].lastElementChild;
        if(last&&!(p.placements||{})[last.dataset.id]&&cols[tall].children.length>1){
          cols[tall].removeChild(last);cols[short].append(last);
        }
      }
    });
  }
  window.renderA4=function(){originalRenderA4();balanceCurrentPage()};
})();
</script>
