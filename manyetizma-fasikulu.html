    {
      "id": "curriculum-8-6",
      "heading": "KÖŞE TAŞI 8.3 — Enerji iletimi ve empedans dönüşümü",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 8.3 — Enerji iletimi ve empedans dönüşümü</h2><p>Bobinde depolanan enerji U=½LI²’dir. Akım yükselirken kaynak enerjisinin bir bölümü manyetik alanda depolanır.</p><div class=\"answer-formula\">Devre açılırken bu enerji yüksek gerilim darbesine dönüşebileceğinden koruma elemanı gerekir.</div>\n<p>Seri RLC devresinde Z=√[R²+(X_L−X_C)²], X_L=ωL ve X_C=1/(ωC)’dir.</p><div class=\"answer-formula\">Empedans, AC devresindeki toplam akım-gerilim oranının genlik karşılığıdır.</div>"
    },
    {
      "id": "b0419",
      "heading": "Deney 8.10",
      "type": "experiment",
      "html": "<h3>Deney 8.10 — Düşük Gerilimli Transformatör Modeli</h3><p><strong>Amaç:</strong> Gerilim oranının sarım oranıyla ilişkisini incelemek.</p><p><strong>Araçlar:</strong> Ayrılabilir yumuşak demir nüve, yalıtılmış iki bobin, 6–12 V AC eğitim kaynağı, iki AC voltmetre ve bağlantı kabloları.</p><ol><li>Bobinleri kapalı nüveye yerleştiriniz ve sarım sayılarını kaydediniz.</li><li>Birincili düşük gerilimli AC kaynağa bağlayınız; birincil ve yüksüz ikincil gerilimlerini ölçünüz.</li><li>Farklı sarım oranlarında <span class=\"math-inline\">$V_s/V_p$</span> ile <span class=\"math-inline\">$N_s/N_p$</span> değerlerini karşılaştırınız.</li><li>Nüveyi kısa süre aralayarak kaçak akı ve ikincil gerilimdeki değişimi gözleyiniz.</li></ol><p><strong>Güvenlik:</strong> Şebeke gerilimi kullanılmaz. Bağlantılar enerji kesikken değiştirilir; kısa devre oluşturulmaz; bobin sıcaklığı izlenir.</p>"
    },
    {
      "id": "b0420",
      "heading": "OLAĞANÜSTÜ SORULAR",
      "type": "extra-section",
      "html": "<h2>OLAĞANÜSTÜ SORULAR</h2><p>Model sınırlarını, tasarım kararlarını ve gerçek sistem davranışını sorgulayan açık uçlu problemler.</p>"
    },
    {
      "id": "b0421",
      "heading": "Soru 8.11",
      "type": "extraordinary",
      "html": "<p><strong>Soru 8.11</strong></p>\n<p>Bir öğrenci, “Yükseltici transformatör gerilimi artırdığı için enerjiyi de artırır.” diyor. İdeal ve gerçek transformatör modellerini kullanarak bu iddiayı değerlendiriniz.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Gerilim, akım ve güç ilişkisini yazınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Gerçek transformatörde enerji bilançosunu belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">İddiayı kavramsal olarak düzeltiniz.</div></div>"
    },
    {
      "id": "b0422",
      "heading": "Soru 8.12",
      "type": "extraordinary",
      "html": "<p><strong>Soru 8.12</strong></p>\n<p>Aynı anma gücüne sahip 50 Hz ve daha yüksek frekanslı iki transformatörün nüve boyutlarının farklı olabilmesini $V_{rms}=4.44fN\\Phi_{max}$ bağıntısı ve kayıplarla ilişkilendiriniz.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Frekans artışının gerekli maksimum akıya etkisini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Girdap akımı ve histerezis kayıplarının frekansla ilişkisi nedeniyle malzeme seçiminin önemini tartışınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">“Frekans arttıkça transformatör her koşulda küçülür.” yargısının neden eksik olduğunu belirtiniz.</div></div>"
    },
    {
      "id": "b0423",
      "heading": "Soru 8.13",
      "type": "extraordinary",
      "html": "<p><strong>Soru 8.13</strong></p>\n<p>Bir transformatör yüksüzken de kaynaktan akım çekmektedir. Bu gözlemi ideal model ve gerçek nüve davranışı bakımından açıklayınız.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Mıknatıslanma akımının rolünü açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Nüve kayıplarının giriş gücüne etkisini belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Yüksüz akımın neden doğrudan yük akımı sayılmayacağını açıklayınız.</div></div>"
    },
    {
      "id": "b0424",
      "heading": "Soru 8.14",
      "type": "extraordinary",
      "html": "<p><strong>Soru 8.14</strong></p>\n<p>Bir elektrik dağıtım sisteminde iletim geriliminin artırılması hat kayıplarını azaltırken yalıtım ve güvenlik maliyetlerini artırmaktadır. Uygun gerilim düzeyinin seçimini bir optimizasyon problemi olarak tartışınız.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Kayıp gücün gerilimle değişimini belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Artan gerilimin en az üç teknik sonucunu yazınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Tek bir “en yüksek gerilim” seçiminin neden her sistem için uygun olmadığını açıklayınız.</div></div>"
    },
    {
      "id": "b0425",
      "heading": "ÖLÇME VE DEĞERLENDİRME",
      "type": "assessment-section",
      "html": "<h2>ÖLÇME VE DEĞERLENDİRME</h2>"
    },
    {
      "id": "b0426",
      "heading": "Soru 8.15",
      "type": "assessment",
      "html": "<p><strong>Soru 8.15</strong></p>\n<p>İdeal bir transformatörde $N_p=800$, $N_s=200$ ve $V_p=240\\,\\mathrm{V}$ olduğuna göre $V_s$ kaç volttur?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">$15$</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">$30$</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">$60$</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">$120$</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">$960$</div></div>"
    },
    {
      "id": "b0427",
      "heading": "Soru 8.16",
      "type": "assessment",
      "html": "<p><strong>Soru 8.16</strong></p>\n<p>İdeal bir yükseltici transformatör için aşağıdakilerden hangisi doğrudur?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">$N_s&lt;N_p$ ve $I_s&gt;I_p$</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">$N_s&gt;N_p$ ve $I_s&lt;I_p$</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">$N_s&gt;N_p$ ve $I_s&gt;I_p$</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">$V_s&lt;V_p$ ve $I_s&lt;I_p$</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Çıkış gücü giriş gücünden büyüktür.</div></div>"
    },
    {
      "id": "b0428",
      "heading": "Soru 8.17",
      "type": "assessment",
      "html": "<p><strong>Soru 8.17</strong></p>\n<p>Kararlı doğru akımla beslenen ideal bir transformatörün ikincilinde sürekli gerilim oluşmamasının temel nedeni nedir?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Sarım sayısının az olması</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Nüvenin yalıtkan olması</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Manyetik akının zamanla değişmemesi</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">İkincil direncinin sonsuz olması</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Birincil gerilimin düşük olması</div></div>"
    },
    {
      "id": "b0429",
      "heading": "Soru 8.18",
      "type": "assessment",
      "html": "<p><strong>Soru 8.18</strong></p>\n<p>Bir transformatörün giriş gücü $500\\,\\mathrm{W}$, verimi %92 ise çıkış gücü ve toplam kaybı bulunuz.</p>"
    },
    {
      "id": "b0433",
      "heading": "Soru 8.19",
      "type": "assessment",
      "html": "<p><strong>Soru 8.19</strong></p>\n<p>İdeal bir transformatörde $V_p=200\\,\\mathrm{V}$, $V_s=50\\,\\mathrm{V}$ ve $I_s=4.0\\,\\mathrm{A}$ ise $I_p$ kaç amperdir?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">$0.25$</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">$0.50$</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">$1.0$</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">$4.0$</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">$16$</div></div>"
    },
    {
      "id": "b0434",
      "heading": "Soru 8.20",
      "type": "assessment",
      "html": "<p><strong>Soru 8.20</strong></p>\n<p>İdeal transformatörün ikinciline $8.0\\,\\Omega$ yük bağlanıyor. $N_p/N_s=5$ ise birincilden görülen empedans kaç ohmdur?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">$0.32$</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">$1.6$</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">$40$</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">$200$</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">$1000$</div></div>"
    },
    {
      "id": "b0435",
      "heading": "Soru 8.21",
      "type": "assessment",
      "html": "<p><strong>Soru 8.21</strong></p>\n<p>Bir transformatörün yüksüz durumunda ikincil uçları açık olmasına rağmen birincilden akım çekilmesini açıklayınız.</p>"
    },
    {
      "id": "b0436",
      "heading": "Soru 8.22",
      "type": "assessment",
      "html": "<p><strong>Soru 8.22</strong></p>\n<p>Yük arttıkça gerçek bir transformatörün ikincil uç geriliminin azalabilmesinin iki nedenini yazınız.</p>"
    },
    {
      "id": "b0437",
      "heading": "Soru 8.23",
      "type": "assessment",
      "html": "<p><strong>Soru 8.23</strong></p>\n<p>Bir transformatör 50 Hz için tasarlanmıştır. Aynı etkin gerilimle çok daha düşük frekansta çalıştırılması neden nüve doygunluğu ve aşırı akım riski oluşturabilir?</p>"
    },
    {
      "id": "b0438",
      "heading": "Soru 8.24",
      "type": "assessment",
      "html": "<p><strong>Soru 8.24</strong></p>\n<p>Bir telefon şarj adaptöründe çıkış geriliminin düşük olması, cihazın her koşulda elektriksel olarak güvenli olduğu anlamına gelir mi? Kısaca açıklayınız.</p>"
    },
    {
      "id": "b0439",
      "heading": "Soru 8.25",
      "type": "assessment",
      "html": "<p><strong>Soru 8.25</strong></p>\n<p>Bir ototransformatör ile iki ayrı sargılı yalıtım transformatörü arasındaki temel farkı yazınız.</p>"
    },
    {
      "id": "b0440",
      "heading": "Soru 8.26",
      "type": "assessment",
      "html": "<p><strong>Soru 8.26</strong></p>\n<p>İdeal bir transformatörde ikincil sargı kısa devre edilirse neden çok büyük akım öngörülür? Gerçek devrede akımı hangi etkiler sınırlar?</p>"
    },
    {
      "id": "b0441",
      "heading": "Soru 8.27",
      "type": "assessment",
      "html": "<p><strong>Soru 8.27</strong></p>\n<p>Sinüzoidal akı için $V_{rms}=4.44fN\\Phi_{max}$ bağıntısını kullanınız. $f=50\\,\\mathrm{Hz}$, $N=500$ ve $\\Phi_{max}=2.0\\,\\mathrm{mWb}$ ise gerilimi bulunuz.</p>"
    },
    {
      "id": "b0442",
      "heading": "Soru 8.28",
      "type": "assessment",
      "html": "<p><strong>Soru 8.28</strong></p>\n<p>Bir transformatörün birincilinde 1000, ikincilinde 250 sarım vardır. İkincile $10\\,\\Omega$ direnç bağlanmıştır ve birincil gerilim $200\\,\\mathrm{V}$ değerindedir. İdeal modelde ikincil gerilimi, ikincil akımı ve birincil akımı bulunuz.</p>"
    },
    {
      "id": "b0443",
      "heading": "Soru 8.29",
      "type": "assessment",
      "html": "<p><strong>Soru 8.29</strong></p>\n<p>Bir transformatörde bakır kaybını azaltmak için sargı iletkeninin kesitinin artırılması hangi fiziksel büyüklükleri değiştirir?</p>"
    },
    {
      "id": "b0444",
      "heading": "Soru 8.30",
      "type": "assessment",
      "html": "<p><strong>Soru 8.30</strong></p>\n<p>Bir dağıtım transformatörünün gün boyunca çoğunlukla düşük yükte çalıştığı biliniyor. Tasarım değerlendirmesinde yalnız tam yük veriminin yeterli olmamasını açıklayınız.</p>"
    },
    {
      "id": "b0445",
      "heading": "Soru 8.31",
      "type": "assessment",
      "html": "<p><strong>Soru 8.31</strong></p>\n<p>Transformatörün enerji iletimindeki rolünü “gerilim yükselir, akım azalır, hat kaybı azalır” zinciriyle açıklayınız; modelin hangi varsayımlara dayandığını belirtiniz.</p>"
    },
    {
      "id": "b0158",
      "heading": "Soru 8.32",
      "type": "yourturn",
      "html": "<p><strong>Soru 8.32</strong>\nBir transformatörün birincil bobini 200 sarım, ikincil bobini 800 sarımdır. Birincil bobine 120 V'luk alternatif akım gerilim uygulanmaktadır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İkincil bobindeki gerilimi hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Eğer birincil bobinden 2 A akım geçiyorsa, ikincil bobin akımının büyüklüğü kaç amperdir? (İdeal transformatör kabulü)</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Transformatörün çekirdeği neden katmanlı (lamine) sacdan yapılır? Girdap akımlarının rolünü açıklayınız.</div></div>"
    },
    {
      "id": "b0196",
      "heading": "Soru 8.33",
      "type": "assessment",
      "html": "<p><strong>Soru 8.33</strong>\n13 Mart 1989'daki güçlü jeomanyetik fırtına sırasında Dünya'nın manyetik alanındaki hızlı değişimler, Québec güç şebekesinde jeomanyetik olarak indüklenen akımların (jeomanyetik olarak indüklenen akım) oluşmasına katkı sağladı. Şebeke koruma sistemlerinin art arda devreye girmesiyle geniş çaplı elektrik kesintisi bir dakikadan kısa sürede gelişti.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Değişen jeomanyetik alanın uzun iletim hatları ve toprak üzerinden düşük frekanslı/quasi-doğru akım jeomanyetik olarak indüklenen akım akımları nasıl oluşturabildiğini Faraday yasası açısından açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">jeomanyetik olarak indüklenen akım'nin güç transformatörlerinde çekirdek doygunluğuna, reaktif güç tüketimine ve harmoniklere yol açarak şebeke kararlılığını neden bozabildiğini açıklayınız. “Blackout transformatörlerin yanmasıyla oluştu” biçimindeki aşırı basitleştirmenin neden doğru olmadığını belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Hat uzunluğu, jeoloji ve şebeke topolojisinin etkiyi nasıl değiştirdiğini; izleme, koruma eşiklerinin ayarlanması ve işletme önlemleri gibi azaltma yöntemlerini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0320",
      "heading": "Soru 8.34",
      "type": "assessment",
      "html": "<p><strong>Soru 8.34</strong></p>\n<p>Bir transformatörün birincil bobini $N_1 = 200$ sarım, ikincil bobini $N_2 = 1000$ sarımdır. Birincil bobine $V_1 = 12$ V alternatif akım uygulanmaktadır. İkincil bobindeki gerilim nedir?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">$2.4$ V</div></div>\n<div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">$12$ V</div></div>\n<div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">$60$ V</div></div>\n<div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">$240$ V</div></div>\n<div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">$600$ V</div></div>"
    },
    {
      "id": "b0334",
      "heading": "Soru 8.35",
      "type": "assessment",
      "html": "<p><strong>Soru 8.35</strong></p>\n<p>Elektrik enerjisi uzak mesafelere iletilirken gerilim, transformatörler ve güç elektroniği aracılığıyla uygun düzeylere yükseltilip daha sonra düşürülebilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İdeal transformatörde $V_2/V_1=N_2/N_1$ oranını Faraday yasasıyla ilişkilendiriniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Aynı iletilen güç için gerilimin artırılmasının akımı ve $I^2R$ hat kaybını nasıl azalttığını gösteriniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Sabit doğru akım akımın ideal transformatörün ikincilinde neden sürekli gerilim oluşturmadığını açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Çok fazlı iletken geometrisi, faz düzeni ve gidiş-dönüş yollarının çevredeki düşük frekanslı manyetik alan dağılımını nasıl etkileyebileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "chapter-cover-9",
      "type": "chapter-cover",
      "heading": "BÖLÜM 9 — ALTERNATİF AKIM VE RLC DEVRELERİ",
      "html": "<div class=\"chapter-cover-kicker\">BÖLÜM 9</div><h1>ALTERNATİF AKIM VE RLC DEVRELERİ</h1><p>Bu bölümün temel kavramları, çözümlü örnekleri ve öğrencinin uygulayacağı sorular.</p><div class=\"chapter-cover-mark\">09</div>"
    },
    {
      "id": "curriculum-chapter-8",
      "heading": "BÖLÜM 9 — ALTERNATİF AKIM VE RLC DEVRELERİ",
      "type": "chapter",
      "html": "<h1>BÖLÜM 9 — ALTERNATİF AKIM VE RLC DEVRELERİ</h1><p>Alternatif akım devrelerinde faz, empedans, rezonans ve güç ilişkilerini kurar. Bu bölüm, hazırlık sorusundan örneklere ve öğrencinin çözümüne doğru kademeli olarak ilerler.</p>"
    },
    {
      "id": "curriculum-prep-8",
      "heading": "Hazırlık Sorusu 8 — ALTERNATİF AKIM VE RLC DEVRELERİ",
      "type": "preparation",
      "html": "<h3>ALTERNATİF AKIM VE RLC DEVRELERİ</h3><p>Bu bölümün temel sorusunu günlük teknoloji, deney veya doğa olayı üzerinden düşününüz. Gözleminizi bir fizik modeliyle açıklamaya çalışınız.</p><p><strong>Başlangıç görevi — Alternatif akım ve RLC devreleri:</strong> Alternatif akım devrelerinde faz, empedans, rezonans ve güç ilişkilerini kurar. Ön bilginizi kullanarak hangi büyüklüklerin ölçülmesi gerektiğini yazınız.</p>"
    },
    {
      "id": "curriculum-9-1",
      "heading": "KÖŞE TAŞI 9.1 — Alternatif akımın temel büyüklükleri",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 9.1 — Alternatif akımın temel büyüklükleri</h2><p>Sinüzoidal gerilim v(t)=V₀ sinωt ile modellenir. Etkin değer V_rms=V₀/√2, dirençte ısıtıcı etkiyi belirler.</p><div class=\"answer-formula\">Tepe, anlık ve etkin değer aynı fiziksel nicelik değildir.</div>\n<p>Bu alt başlık, manyetizmanın temel kavramlarını fiziksel model ve ölçülebilir büyüklüklerle ilişkilendirir. Tanım, yön, birim ve geçerlilik koşulları birlikte değerlendirilmelidir.</p>\n<p>Dirençte akım ve gerilim aynı fazdadır; ideal bobinde akım gerilimden 90° geri, ideal kondansatörde 90° ileridir.</p><div class=\"answer-formula\">Faz farkı ortalama gücü ve enerji alışverişinin yönünü belirler.</div>"
    },
    {
      "id": "curriculum-support-9-example",
      "heading": "Örnek 9.1 — Temel model",
      "type": "example",
      "html": "<h3>Örnek 9.1 — Temel model — Temel model</h3><p>Alternatif akım devrelerinde faz farkı ve empedans, enerji aktarımının zaman bağımlı yapısını belirler.</p><p>Bir düzenekte alan, kuvvet veya akı değişimi inceleniyor. Önce sistemi şemalaştırınız; bilinenleri SI birimleriyle yazıp uygun fizik yasasını seçiniz.</p><div class=\"answer-formula\">Model → bağıntı → birim kontrolü → fiziksel yorum</div>"
    },

      "id": "curriculum-support-9-assessment",
      "heading": "Uygulama 9.1 — Model kurma",
      "type": "assessment",
      "html": "<p><strong>Uygulama 9.1</strong> ALTERNATİF AKIM VE RLC DEVRELERİ başlığında verilen fiziksel durumu bir çizim ve en az bir bağıntıyla modelleyiniz.</p><div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Sistemdeki temel büyüklükleri ve birimlerini yazınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Kullanacağınız fizik yasasını ve yön/işaret seçimini gerekçelendiriniz.</div></div>"

    {
      "id": "curriculum-9-5",
      "heading": "KÖŞE TAŞI 9.2 — Seri RLC ve rezonans",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 9.2 — Seri RLC ve rezonans</h2><p>Seri RLC devresinde Z=√[R²+(X_L−X_C)²], X_L=ωL ve X_C=1/(ωC)’dir.</p><div class=\"answer-formula\">Empedans, AC devresindeki toplam akım-gerilim oranının genlik karşılığıdır.</div>\n<p>Rezonans açısal frekansı ω₀=1/√(LC)’dir. Bu noktada X_L=X_C ve seri devrede empedans en küçük, akım en büyüktür.</p><div class=\"answer-formula\">Rezonans daralığı direnç ve kalite faktörüyle ilişkilidir.</div>"
    },
    {
      "id": "curriculum-9-7",
      "heading": "KÖŞE TAŞI 9.3 — Fazör, güç ve kalite faktörü",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 9.3 — Fazör, güç ve kalite faktörü</h2><p>Ortalama güç P=V_rms I_rms cosφ’dir. cosφ güç faktörü olup reaktif akımın azaltılması ile yükseltilebilir.</p><div class=\"answer-formula\">Güç faktörü düzeltmesi ile aynı aktif güç daha düşük hat akımıyla taşınabilir.</div>\n<p>Bu alt başlık, manyetizmanın temel kavramlarını fiziksel model ve ölçülebilir büyüklüklerle ilişkilendirir. Tanım, yön, birim ve geçerlilik koşulları birlikte değerlendirilmelidir.</p>\n<p>Rezonans açısal frekansı ω₀=1/√(LC)’dir. Bu noktada X_L=X_C ve seri devrede empedans en küçük, akım en büyüktür.</p><div class=\"answer-formula\">Rezonans daralığı direnç ve kalite faktörüyle ilişkilidir.</div>"
    },

    {
      "id": "b0072",
      "heading": "Soru 9.2",
      "type": "activity",
      "html": "<p><strong>Soru 9.2</strong>\nBir kablosuz şarj sisteminde, verici ve alıcı bobinler arasındaki manyetik bağlaşım katsayısı $k$, mesafeyle azalır. Aşağıdaki tablo, mesafe ($d$) ile verici bobindeki akımın ($I_1$) ve alıcı bobinde indüklenen gerilimin ($V_2$) ilişkisini göstermektedir.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:center\">$d$ (mm)</th>\n<th style=\"text-align:center\">$I_1$ (A)</th>\n<th style=\"text-align:center\">$V_2$ (V)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:center\">5</td>\n<td style=\"text-align:center\">2.0</td>\n<td style=\"text-align:center\">8.0</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">10</td>\n<td style=\"text-align:center\">2.0</td>\n<td style=\"text-align:center\">4.0</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">15</td>\n<td style=\"text-align:center\">2.0</td>\n<td style=\"text-align:center\">2.2</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">20</td>\n<td style=\"text-align:center\">2.0</td>\n<td style=\"text-align:center\">1.3</td>\n</tr>\n</tbody>\n</table>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$V_2$ ile $d$ arasındaki ilişkiyi grafiksel olarak analiz ediniz. $V_2 \\propto 1/d^n$ ise $n$ yaklaşık kaçtır? (Not: Tablodaki değerler yaklaşık olarak tek bir kuvvet yasasına uymuyor; regresyon yöntemi, log-log grafik veya \"yaklaşık\" ifadesi kullanılmalıdır.)</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu ilişki, manyetik alanın uzaysal dağılımının hangi özelliğiyle açıklanabilir?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Şarj verimini artırmak için mühendisler hangi tasarım değişikliklerini önerir?</div></div>\n<p><em>Kablosuz şarj sistemlerinde $V_2$'nin mesafeye bağlılığı yalnızca manyetik alanın uzaysal dağılımından değil, bobin rezonansı, karşılıklı endüktans, yük ve devre empedansından da etkilenir.</em></p>"
    },
    {
      "id": "b0291",
      "heading": "Soru 9.3",
      "type": "activity",
      "html": "<p><strong>Soru 9.3</strong></p>\n<p>Bir elektrikli tren, havai hattan $I=500\\,\\mathrm{A}$ akım çekmektedir. İlk yaklaşık büyüklük tahmini için havai iletkeni yerden $h=5.0\\,\\mathrm{m}$ yüksekte, çok uzun doğrusal tek iletken olarak modelleyiniz.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Hattın tam altındaki manyetik alanın büyüklüğünü hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu tek-iletken sonucunu Dünya'nın yaklaşık $50\\,\\mu\\mathrm{T}$ büyüklüğündeki alanıyla karşılaştırınız. Gerçek demiryolu sisteminde dönüş akım yolunun ve beslemenin alternatif akım/doğru akım olmasının sonucu neden değiştireceğini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Tren üzerindeki çekiş motorlarının ve güç kablolarının oluşturduğu yerel alanların yolcu bölgesindeki toplam alana nasıl katkı yapabileceğini süperpozisyonla değerlendiriniz.</div></div>"
    },

      "id": "b0087",
      "heading": "Soru 9.4",
      "type": "assessment",
      "html": "<p><strong>Soru 9.4</strong>\nBirbirine yakın iki iletkenden oluşan bir ev kablosunda faz ve nötr akımları ideal olarak eşit büyüklükte ve zıt yönlüdür. Şebeke frekansı 50 Hz'dir.</p>\n<p>Aşağıdaki ifadelerden hangisi <strong>en doğrudur</strong>?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">alternatif akım akımın zaman ortalaması sıfır olduğu için kablonun çevresinde hiçbir anda manyetik alan oluşmaz.</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Faz ve nötrün oluşturduğu manyetik alanlar kablonun dışında her noktada birbirini güçlendirir.</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Kablonun dışındaki alan, akımın büyüklüğünden bağımsızdır.</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Faz ve nötr iletkenlerinin birbirine yakın olması, iki alanın vektörel olarak büyük ölçüde birbirini azaltmasına yol açar; bu nedenle dış alan tek bir iletken için hesaplanan değerden çok daha küçük olabilir.</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Mekanik bir pusula iğnesi zorunlu olarak 50 Hz frekansta tam genlikle salınır.</div></div>"

    {
      "id": "b0088",
      "heading": "Soru 9.5",
      "type": "assessment",
      "html": "<p><strong>Soru 9.5</strong>\nElektrik motorlarında, stator sargıları tarafından üretilen manyetik alanın mümkün olduğunca homojen olması istenir. Mühendisler, sargıları dağıtarak ve farklı açılarda yerleştirerek bu homojenliği sağlarlar.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Tek bir bobinin manyetik alanının neden homojen olmadığını, uzaysal değişim (gradyan) açısından açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Üç fazlı alternatif akım akımın, stator sargılarında döner bir manyetik alan nasıl oluşturduğunu süperpozisyon ilkesiyle açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bu döner manyetik alan, rotoru nasıl \"sürükler\"? (Asenkron motor prensibi)</div></div>"

    {
      "id": "b0308",
      "heading": "Soru 9.6",
      "type": "activity",
      "html": "<p><strong>Soru 9.6</strong></p>\n<p>Kablosuz güç aktarımında verici bobin, alıcı bobinle karşılıklı indüktans üzerinden bağlaşır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Verici bobini düzlemsel spiral yerine eşmerkezli $N$ halka olarak idealize ederek, eksen üzerindeki alanın her halkanın katkısının vektörel toplamı olduğunu açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Sarım sayısı artırıldığında alanın her koşulda tam $N$ ile orantılı olmayabileceğini; tel uzunluğu, direnç, sürücü akımı ve özindüktansın da değiştiğini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Yanal hizasızlığın karşılıklı indüktans $M$ ve bağlaşım katsayısı $k$ üzerindeki etkisini değerlendiriniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Rezonans ayarı ve yük empedansının yalnız geometrik hizalama kadar önemli olabileceğini açıklayınız.</div></div>"

    {
      "id": "b0327",
      "heading": "Soru 9.7",
      "type": "activity",
      "html": "<p><strong>Soru 9.7</strong>\nKablosuz şarj özelliğine sahip bir kulaklık şarj kutusu, kablosuz şarj pedi üzerine yerleştiriliyor. Verici bobin şarj pedinde, alıcı bobin ise şarj kutusundadır; kulaklıklar kutunun kendi elektrik bağlantıları üzerinden şarj edilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Peddeki alternatif akımın kutudaki alıcı bobinde nasıl EMK indüklediğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Kutu ped üzerinde iyi hizalanmadığında karşılıklı indüktans ve alınan gücün neden azalabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Ped ile kutu arasına metal bir yabancı cisim girdiğinde girdap akımı kaynaklı ısınma ve enerji kaybının neden oluşabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Kablosuz enerji aktarımındaki kayıpların bobin direnci, hizalama, güç elektroniği ve çevredeki iletken maddelerle nasıl ilişkili olduğunu değerlendiriniz.</div></div>"

    {
      "id": "b0331",
      "heading": "Soru 9.8",
      "type": "activity",
      "html": "<p><strong>Soru 9.8</strong></p>\n<p>Bir radyo frekansı elektronik ürün gözetleme (EAS) etiketini ideal bir $LC$ rezonatörü olarak modelleyiniz. Kapıdaki anten sistemi etiketi rezonans frekansı yakınında uyarır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$f_0=1/(2\\pi\\sqrt{LC})$ rezonans koşulunun etiketin belirli bir frekans bandında güçlü yanıt vermesine nasıl yol açtığını açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu radyo frekansı etiket türünde deaktivasyonun rezonans devresinin elektriksel özelliklerini değiştirerek veya devreyi kalıcı biçimde bozarak yanıtı bastırabileceğini açıklayınız. Bunu akusto-manyetik etiketlerdeki farklı manyetik malzeme mekanizmalarıyla karıştırmayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Etiketin iletken metal yüzeye çok yakın olmasının girdap akımları ve empedans değişimi üzerinden rezonansı neden kaydırabileceğini veya zayıflatabileceğini değerlendiriniz.</div></div>"

    {
      "id": "b0197",
      "heading": "Soru 9.9",
      "type": "assessment",
      "html": "<p><strong>Soru 9.9</strong>\nBir elektrikli diş fırçasında verici bobin ile cihaz içindeki alıcı bobin plastik bir gövdeyle ayrılmıştır. Sistem, örneğin onlarca–yüzlerce kilohertz büyüklük düzeyinde alternatif akımla çalıştırılan endüktif bir güç aktarım düzeni olarak modellenebilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Verici bobindeki alternatif akımın alıcı bobinde nasıl EMK indüklediğini açıklayınız.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">İki bobin arasındaki eksenel uzaklık veya yanal kaçıklık arttığında karşılıklı indüktansın ve aktarılan gücün neden azalabileceğini açıklayınız. Belirli bir “5 mm” değerinin bütün cihazlar için evrensel bir sınır olmadığını belirtiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Rezonanslı bağlaşım kullanılan tasarımlarda, çalışma frekansının neden bobin–kapasitör devrelerinin rezonansına yakın seçilebildiğini ve bunun hangi koşullarda güç aktarımını artırabildiğini değerlendiriniz.</div></div>"

    {
      "id": "b0202",
      "heading": "Soru 9.10",
      "type": "assessment",
      "html": "<p><strong>Soru 9.10</strong>\nAkustomanyetik güvenlik etiketlerinin bir türünde, manyetostriktif bir şerit ile çalışma koşulunu belirleyen manyetik bir eleman birlikte kullanılır. Kapıdaki verici alan etiketi uyarır; etiketin mekanik-manyetik titreşimi alıcı düzenek tarafından algılanır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Manyetostriksiyonun, manyetik alan ile mekanik titreşim arasında nasıl bağ kurabildiğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Etiketin belirli bir frekans çevresinde güçlü yanıt vermesini rezonans kavramıyla açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Etiketin çalışma koşulunu değiştiren manyetik elemanın çıkarılması veya manyetik durumunun değiştirilmesinin algılanabilirliği nasıl etkileyebileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0210",
      "heading": "Soru 9.11",
      "type": "assessment",
      "html": "<p><strong>Soru 9.11</strong>\nYüksek güçlü bir elektrikli araç şarj sisteminde bağlantı noktaları büyük akımlar taşır. doğru akım hızlı şarjın araç tarafında iki ana iletken çoğunlukla gidiş ve dönüş akımlarını taşır; istasyonun şebeke tarafında ise alternatif akım bölümler de bulunabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Soket ve temas noktalarındaki ısınmayı temas direnci ve $P=I^2R$ ile açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Paralel iki iletkende <strong>zıt yönlü eşit akımlar</strong> bulunduğunda manyetik kuvvetin itici olduğunu gösteriniz. Her iki akımın yönü aynı anda ters çevrilirse göreli yönün yine zıt kaldığını ve kuvvet yönünün değişmediğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">alternatif akım bölümlerde $I(t)$ sinüzoidal ise kuvvet büyüklüğünün yaklaşık $I^2(t)$ ile değişerek doğru akım bileşen yanında $2f$ frekanslı bir titreşim bileşeni oluşturabileceğini gösteriniz. Mekanik uğultuyu “kuvvet yönünün her yarım periyotta ters dönmesi” şeklinde açıklamanın neden yanlış olduğunu belirtiniz.</div></div>"
    },

      "id": "b0316",
      "heading": "Soru 9.12",
      "type": "assessment",
      "html": "<p><strong>Soru 9.12</strong></p>\n<p>Bir kalıcı mıknatıslı jeneratörde rotor, stator bobinlerine göre $\\omega$ açısal hızıyla dönmektedir. Basitleştirilmiş modelde $\\varepsilon_{max}=NBA\\omega$ olsun.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Diğer parametreler sabitken $\\omega$ iki katına çıkarılırsa EMK genliği nasıl değişir?</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Jeneratörün iç empedansı ihmal edilip sabit bir direnç yüküne bağlandığı özel modelde $P\\propto\\varepsilon_{rms}^2/R$ olduğundan yük gücü nasıl ölçeklenir? Bunun gerçek rüzgâr türbininin toplam mekanik gücü için evrensel bir $\\omega^2$ yasası olmadığını açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Kanat hatvesi kontrolünün yüksek rüzgârda mekanik güç ve rotor hızını sınırlamadaki rolünü açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Değişken hızlı türbinlerde güç elektroniğinin jeneratörün değişken frekanslı çıkışını şebeke frekansına uyarlamasını nitel olarak açıklayınız.</div></div>"

      "html": "<h3>MADDENİN MANYETİK ÖZELLİKLERİ</h3><p>Bu bölümün temel sorusunu günlük teknoloji, deney veya doğa olayı üzerinden düşününüz. Gözleminizi bir fizik modeliyle açıklamaya çalışınız.</p><p><strong>Başlangıç görevi — Maddenin manyetik özellikleri:</strong> Maddenin manyetik tepkisini domen, geçirgenlik, doyum ve histerezis kavramlarıyla açıklar. Ön bilginizi kullanarak hangi büyüklüklerin ölçülmesi gerektiğini yazınız.</p>"

    {
      "id": "curriculum-10-1",
      "heading": "KÖŞE TAŞI 10.1 — Manyetik maddelerin temel sınıfları",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 10.1 — Manyetik maddelerin temel sınıfları</h2><p>Bu alt başlık, manyetizmanın temel kavramlarını fiziksel model ve ölçülebilir büyüklüklerle ilişkilendirir. Tanım, yön, birim ve geçerlilik koşulları birlikte değerlendirilmelidir.</p>\n<ul>\n<li><strong>Diyamanyetik:</strong> $\\chi&lt;0$; dış alana çok zayıf karşı yönlü tepki.</li>\n<li><strong>Paramanyetik:</strong> $\\chi&gt;0$; dış alan yönünde zayıf tepki.</li>\n<li><strong>Ferromanyetik:</strong> manyetik bölge yapısı nedeniyle güçlü, doğrusal olmayan ve geçmişe bağlı tepki gösterebilir.</li>\n</ul>\n<p><strong>FERROMANYETİK ANAHTARLAR</strong></p>\n<ul>\n<li><strong>Doyum:</strong> manyetik bölgelerin büyük ölçüde hizalandığı sınır.</li>\n<li><strong>Kalıcı mıknatıslanma:</strong> dış alan kaldırıldıktan sonra kalan mıknatıslanma.</li>\n<li><strong>Mıknatıslanmayı sıfıra indiren ters alan:</strong> kalıcı mıknatıslanmayı sıfırlamak için gereken ters alanın karakteristik büyüklüğü.</li>\n<li><strong>Curie sıcaklığı:</strong> bu sıcaklığın üzerinde uzun menzilli ferromanyetik düzen kaybolur.</li>\n</ul>\n<p>&quot;Metal = mıknatısa yapışır&quot; genellemesi yanlıştır. Alüminyum zayıf paramanyetiktir; tüm paslanmaz çelikler de ferromanyetik değildir. Malzemenin alaşımı ve mikroyapısı önemlidir.</p>\n<p>Diyamanyetik maddeler dış alana zıt yönde zayıf mıknatıslanır; manyetik duyarlılıkları negatiftir.</p><div class=\"answer-formula\">Tepki genellikle sıcaklığa zayıf bağlıdır ve kalıcı mıknatıslanma göstermez.</div>\n<p>Paramanyetik maddeler dış alanla aynı yönde zayıf mıknatıslanır. Termal düzensizlik, kalıcı hizalanmayı sınırlar.</p><div class=\"answer-formula\">Alan kaldırıldığında net mıknatıslanma çoğunlukla kaybolur.</div>\n<p>Ferromanyetik maddelerde domenler aynı yönde hizalanabildiği için güçlü mıknatıslanma ve kalıcı mıknatıs davranışı görülür.</p><div class=\"answer-formula\">Doyum, tüm uygun domenlerin büyük ölçüde hizalanmasıyla ortaya çıkar.</div>"
    },

      "id": "curriculum-10-5",
      "heading": "KÖŞE TAŞI 10.2 — Geçirgenlik, histerezis ve domenler",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 10.2 — Geçirgenlik, histerezis ve domenler</h2><p>Manyetik geçirgenlik B ile H arasındaki ilişkiyi belirler. Doğrusal bölgede B=μH kullanılabilir; doyum ve histereziste μ sabit değildir.</p><div class=\"answer-formula\">Nüve seçimi elektromıknatısın alan gücünü ve enerji kaybını etkiler.</div>\n<p>B-H çevriminin alanı, bir manyetik çevrimde ısı olarak kaybedilen enerjiyi temsil eder.</p><div class=\"answer-formula\">Dar çevrimli malzemeler transformatör nüvesi, geniş çevrimli malzemeler kalıcı mıknatıs için uygundur.</div>\n<p>Bu alt başlık, manyetizmanın temel kavramlarını fiziksel model ve ölçülebilir büyüklüklerle ilişkilendirir. Tanım, yön, birim ve geçerlilik koşulları birlikte değerlendirilmelidir.</p>\n<p>Curie sıcaklığının üzerinde ferromanyetik domen düzeni bozulur ve madde paramanyetik davranışa yaklaşır.</p><div class=\"answer-formula\">Sıcaklık, manyetik hafızanın ve mıknatıs kararlılığının önemli bir sınırıdır.</div>"

      "html": "<p><strong>Soru 10.2</strong>\nManyetik şeritli bir kartta bilgi, ferromanyetik parçacıkların mıknatıslanma düzeniyle saklanır. Güçlü bir kalıcı mıknatıs bu düzeni değiştirerek kayıtlı bilginin bozulmasına yol açabilir. Temassız elektronik kartlarda ise bilgi yarı iletken bellekte tutulur.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Güçlü bir dış manyetik alanın manyetik şeritteki mıknatıslanma düzenini nasıl değiştirebileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Sıradan bir kalıcı mıknatısın yarı iletken bellekteki veriyi doğrudan silmemesinin nedenini açıklayınız. Temassız kartın okuyucudan enerji alabilmesinde zamanla değişen manyetik alanın rolünü Faraday yasasıyla ilişkilendiriniz.</div></div>"

      "id": "b0028",
      "heading": "Soru 10.3",

    {
      "id": "b0278",
      "heading": "Soru 10.4",
      "type": "activity",
      "html": "<p><strong>Soru 10.4</strong></p>\n<p>Gömülü ferromanyetik nesnelerin aranmasında, Dünya'nın alanındaki yerel bozulmaları ölçen manyetometre veya gradyometre sistemleri kullanılabilir. Bu tür yöntemler sivil jeofizik, altyapı arama ve tehlikeli metal nesnelerin tespitinde kullanılabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bir ferromanyetik parçanın çevredeki alan dağılımını neden değiştirdiğini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">İki yakın algılayıcının fark sinyalini ölçen gradyometrenin uzak ve yaklaşık ortak alan bileşenlerini bastırmada neden yararlı olduğunu açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Manyetit gibi doğal manyetik minerallerin yanlış sinyal üretebileceğini; çok eksenli ölçüm, uzaysal örüntü analizi ve tamamlayıcı algılayıcılarin ayrım gücünü nasıl artırabileceğini değerlendiriniz.</div></div>"

    {
      "id": "b0279",
      "heading": "Soru 10.5",
      "type": "extraordinary",
      "html": "<p><strong>Soru 10.5</strong></p>\n<p>Adyabatik demanyetizasyon soğutmasında paramanyetik bir çalışma maddesi önce güçlü bir manyetik alanda, çevresiyle ısıl temas hâlindeyken mıknatıslanır; daha sonra çevreden ısıl olarak yalıtılır ve alan yavaşça azaltılır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İzotermal mıknatıslama sırasında manyetik momentlerin kısmen hizalanmasının manyetik entropiyi nasıl azalttığını ve açığa çıkan ısının banyoya aktarılmasını açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Isıl olarak yalıtılmış durumda alan azaltıldığında toplam entropinin yaklaşık sabit kalması nedeniyle spin düzensizliğinin artmasının kafesin termal enerjisinden pay alarak sıcaklığı nasıl düşürdüğünü açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bu yöntemin çok düşük sıcaklıklarda neden yararlı olduğunu; ancak üçüncü yasa nedeniyle sonlu adımlarla mutlak sıfıra ulaşılamayacağını belirtiniz. Buhar sıkıştırmalı soğutma ile seyreltme soğutması gibi yöntemleri birbirine karıştırmayınız.</div></div>"

    {
      "id": "b0042",
      "heading": "Soru 10.6",
      "type": "assessment",
      "html": "<p><strong>Soru 10.6</strong>\nArkeologlar, antik seramiklerin yaşını belirlemek için \"Arkeomanyetizma\" yöntemini kullanır. Kil, pişirildiğinde yüksek sıcaklıkta manyetik mineraller (manyetit) Dünya'nın o günkü manyetik alan yönüne göre hizalanır ve soğuyunca bu yönü \"kilitler\".</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Manyetik minerallerin Dünya'nın manyetik alanını \"hatırlamasının\" fiziksel mekanizmasını manyetik bölgeler üzerinden açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Curie sıcaklığının bu süreçteki rolü nedir? (Not: Seramikte tek bir saf manyetit fazı bulunmayabilir; farklı minerallerin Curie sıcaklıkları farklıdır. Termoremanent magnetization ve soğuma koşulları da önemlidir.)</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bu yöntemle seramiğin yapıldığı coğrafi enlem ve tarihsel dönem hakkında nasıl bilgi elde edilebilir?</div></div>"

    {
      "id": "b0050",
      "heading": "Soru 10.7",
      "type": "assessment",
      "html": "<p><strong>Soru 10.7</strong>\nMüze vitrinlerinde, manyetik bir sıvı olan \"ferrofluid\" içeren cam şişeler sergilenir. Şişenin arkasına bir mıknatıs yaklaştırıldığında, sıvı düz bir küre olmak yerine, dikenli bir kirpi gibi sivri uçlu yapılar oluşturur.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Manyetik alan, sıvıyı mıknatısa doğru çekerken neden sıvı yüzeyi pürüzsüz kalmaz da bu \"dikenli\" yapıyı oluşturur? (Manyetik enerji minimizasyonu ile yüzey gerilimi ve yerçekimi arasındaki rekabeti açıklayınız.)</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Mıknatıs uzaklaştırıldığında sıvı neden kısa sürede yeniden daha pürüzsüz bir yüzey biçimine döner? (Kalıcı manyetizma ile süperparamanyetizma farkı.)</div></div>"
    },
    {
      "id": "b0267",
      "heading": "Soru 10.8",
      "type": "assessment",
      "html": "<p><strong>Soru 10.8</strong></p>\n<p>Bir demir örnek, ferromanyetik durumda belirgin bir mıknatıslanmaya sahiptir. Saf demir için Curie sıcaklığı yaklaşık $770^\\circ\\mathrm{C}$ büyüklük düzeyindedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Sıcaklık Curie sıcaklığına yaklaşıp onu aştığında uzun menzilli ferromanyetik düzenin neden kaybolduğunu açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Örnek Curie sıcaklığının üzerine çıkarılıp daha sonra yeniden oda sıcaklığına soğutulursa, başlangıçtaki kalıcı mıknatıslanmanın kendiliğinden aynen geri gelmesi beklenir mi? Dış alanın bulunmadığı ve soğuma sırasında dış alan uygulandığı durumları karşılaştırınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Manyetik alan altında yapılan ısıl işlemlerin bazı alaşımlarda manyetik bölge yapısı ve manyetik anizotropi üzerinde neden etkili olabileceğini açıklayınız. Bu işlemin her ferromanyetik malzemede aynı sonucu vermeyeceğini belirtiniz.</div></div>"

      "id": "rev-exp-1-01",
      "heading": "Deney 10.9",
      "type": "experiment",
      "html": "<h3>Deney 10.9: Dünya’nın manyetik alanını haritalama</h3>Pusula, cetvel ve akıllı telefon manyetometresiyle seçilmiş bir grid üzerinde yön ve büyüklük ölçünüz. Kontrol: yakındaki ferromanyetik nesneleri uzaklaştırıp ölçümü tekrarlayınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Güvenlik</span><div class=\"subquestion-text\">Güç kaynağını kapatmadan devre bağlantısını değiştirmeyiniz; mıknatısları elektronik cihazlardan uzak tutunuz.</div></div>"
    },
    {
      "id": "b0070",
      "heading": "Soru 10.10",
      "type": "yourturn",
      "html": "<p><strong>Soru 10.10</strong>\nBasitleştirilmiş bir MR ana mıknatısı, uzunluğu $L=2.0\\,\\mathrm{m}$ ve toplam sarım sayısı $N=1000$ olan ideal bir solenoid olarak modellensin. Hedef alan $B=3.0\\,\\mathrm{T}$ olsun.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$B=\\mu_0(N/L)I$ bağıntısıyla gerekli akımı hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu akımın sıradan bir bakır sargıda taşınmasının neden yüksek akım yoğunluğu ve ısınma sorunları doğuracağını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Toplam sargı direnci $R=0.20\\,\\Omega$ olsaydı $P=I^2R$ ile Joule gücünü hesaplayınız. Sonucu süperiletken sargı kullanımının sağladığı üstünlükler açısından değerlendiriniz.</div></div>\n<p>Gerçek MR mıknatıslarının geometrisi ideal solenoidden farklı olabilir. Buradaki hesap yalnızca yaklaşık ölçeği göstermek amacıyla verilmiştir.</p>"
    },

      "id": "b0283",
      "heading": "Soru 10.11",
      "type": "assessment",
      "html": "<p><strong>Soru 10.11</strong></p>\n<p>Bir öğrenci, $L=10\\,\\mathrm{cm}$ uzunluğunda bir çivinin çevresine $N=200$ sarım tel sararak elektromıknatıs tasarlıyor ve sargıdan $I=2.0\\,\\mathrm{A}$ akım geçiriyor.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Önce hava çekirdekli uzun-solenoid yaklaşımını kullanarak $B\\simeq\\mu_0(N/L)I$ değerini hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Çekirdek için sabit $\\mu_r=1000$ varsayımıyla yapılan doğrusal modelin hangi değeri öngöreceğini bulunuz; ardından bu sonucun gerçek bir demir çekirdekte manyetik doyum nedeniyle neden güvenilir olmadığını açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Uç etkileri, hava aralığı, çekirdek geometrisi, histerezis ve kaçak akının gerçek alanı nasıl etkilediğini değerlendiriniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Çekim kuvvetini artırırken akım yoğunluğu, $I^2R$ ısınması ve doyum sınırlarının neden birlikte değerlendirilmesi gerektiğini açıklayınız.</div></div>"
    },
    {
      "id": "b0286",
      "heading": "Soru 10.12",
      "type": "assessment",
      "html": "<p><strong>Soru 10.12</strong>\nHassas bir düzenek, dış manyetik alanların etkisini azaltmak için yüksek manyetik geçirgenlikli yumuşak manyetik bir alaşım kılıfla çevreleniyor.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Kılıfın manyetik alan için daha düşük manyetik dirençli bir yol oluşturarak iç bölgedeki alanı nasıl azaltabildiğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Geçirgenlik, kılıf kalınlığı, geometri, açıklıklar ve manyetik doygunluğun kalkanlama etkinliğine etkisini değerlendiriniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Durağan ve düşük frekanslı manyetik alanların kalkanlanmasıyla yüksek frekanslı elektromanyetik alanların iletken ekranlarla azaltılması arasındaki farkı açıklayınız.</div></div>"
    },
    {
      "id": "b0139",
      "heading": "Soru 10.13",
      "type": "assessment",
      "html": "<p><strong>Soru 10.13</strong>\nBobinli bir elektromanyetik hızlandırıcıda ferromanyetik bir cisim, ardışık bobinlerin oluşturduğu düzgün olmayan manyetik alanlarla hızlandırılır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Cismin alanın daha güçlü olduğu bölgeye doğru çekilmesini alan gradyanı açısından açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Cisim bobin merkezini geçmeden önce bobin akımının azaltılmaması durumunda hızlandırma etkisinin neden azalabileceğini veya tersine dönebileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Zamanlama, çekirdek doygunluğu, bobin direnci ve ısınmanın sistemin verimini nasıl sınırladığını değerlendiriniz.</div></div>"
    },
    {
      "id": "b0315",
      "heading": "Soru 10.14",
      "type": "activity",
      "html": "<p><strong>Soru 10.14</strong></p>\n<p>Bir geçiş tipi metal dedektörü, zamanla değişen manyetik alan oluşturan verici bobinler ve bu alandaki değişimleri algılayan alıcı devreler içerir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İletken bir nesnede indüklenen girdap akımlarının alıcı sinyali nasıl değiştirdiğini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Alüminyum gibi ferromanyetik olmayan fakat iyi iletken bir metalin de neden algılanabildiğini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Titanyum implantların ferromanyetik olmamasına rağmen boyut, şekil, iletkenlik ve dedektör ayarlarına bağlı olarak algılanabilmesinin mümkün olduğunu değerlendiriniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Hassasiyet artırıldığında küçük metal parçalarına duyarlılığın artmasına karşılık yanlış alarm olasılığının da artabileceğini açıklayınız.</div></div>"
    },
    {
      "id": "b0317",
      "heading": "Soru 10.15",
      "type": "activity",
      "html": "<p><strong>Soru 10.15</strong>\nGeleneksel indüksiyon ocakları, tabanında ferromanyetik ve elektriksel olarak iletken bir katman bulunan kaplarla en verimli biçimde çalışır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Değişen manyetik alanın kap tabanında girdap akımları oluşturmasını ve Joule ısınmasına yol açmasını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Yüksek manyetik geçirgenliğin bobin ile kap arasındaki manyetik bağlaşımı neden güçlendirebildiğini açıklayınız. Histerezis kaybının bazı ferromanyetik malzemelerde ek katkı yapabileceğini, ancak ısıtmayı yalnız histerezisle açıklamanın doğru olmadığını belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bakır veya alüminyum gibi ferromanyetik olmayan iyi iletkenlerin standart düzeneklerde neden daha zayıf ısınabildiğini; bazı özel tasarımlarda ise uygun bobin ve frekans seçimiyle bu malzemelerin de ısıtılabileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0177",
      "heading": "Soru 10.16",
      "type": "extraordinary",
      "html": "<p><strong>Soru 10.16</strong>\nBir mıknatıs dikey bakır boruda düşerken, belirli bir hız aralığında manyetik fren kuvvetinin yaklaşık olarak hıza doğrusal bağlı olduğu deneysel bir model kullanılacaktır:\n$$F_{m}=-kv.$$\nBurada $k&gt;0$ katsayısı; mıknatısın alan dağılımına, borunun elektriksel iletkenliğine, et kalınlığına, yarıçapına ve diğer geometrik ayrıntılara bağlıdır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Aşağı yönü pozitif alarak hareket denklemini kurunuz ve terminal hızın\n$$v_t=\\frac{mg}{k}$$\nolduğunu gösteriniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">$k$'nın iletkenlik ve geometriyle değişebileceğini açıklayınız. Yalnız boyut analizinden evrensel bir $k\\propto B^2L^2/R$ veya $v_t\\propto mgR/(B^2L^2)$ yasasının çıkarılamayacağını değerlendiriniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Terminal hızda mıknatısın birim zamanda kaybettiği kütleçekim potansiyel enerjisinin, boruda oluşan Joule ısısıyla nasıl dengelendiğini gösteriniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Boru süperiletken olsaydı, Meissner etkisi, akı çivilemesi ve soğutma geçmişi nedeniyle basit $F_m=-kv$ modelinin neden geçerli olmayabileceğini açıklayınız.</div></div>"
    },
    {
      "id": "b0183",
      "heading": "Soru 10.17",
      "type": "assessment",
      "html": "<p><strong>Soru 10.17</strong>\nBir süperiletken numune kritik sıcaklığın altına soğutulmuş ve <strong>Meissner durumunda</strong> tutulmaktadır. Aşağıdaki ifadelerden hangisi bu durum için en uygundur?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Manyetik alan çizgilerini her koşulda içine yoğunlaştırır.</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Numunenin hacminden manyetik akıyı büyük ölçüde dışlayacak ekranlama akımları oluşur.</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Manyetik alana hiçbir elektromanyetik tepki vermez.</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Dış alanı zorunlu olarak güçlendirir.</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">İç alan her süperiletken türünde ve her alan şiddetinde dış alanla aynıdır.</div></div>"
    },
    {
      "id": "b0190",
      "heading": "Soru 10.18",
      "type": "assessment",
      "html": "<p><strong>Soru 10.18</strong>\nGüçlü bir mıknatıs, dikey bir bakır borunun içinde düşerken boru duvarlarında girdap akımları indükler ve manyetik frenleme nedeniyle serbest düşmeye göre daha yavaş hareket eder.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Mıknatıs aşağı inerken kaybettiği kütleçekim potansiyel enerjisinin hangi enerji türlerine dönüştüğünü adım adım açıklayınız.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bakır borunun elektriksel özdirenci ve geometrisinin girdap akımlarının büyüklüğü ile frenleme üzerindeki etkisini nitel olarak değerlendiriniz. “Özdirenç ne kadar küçükse frenleme her zaman o kadar büyüktür” biçimindeki ifadenin neden aşırı genelleme olabileceğini belirtiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Boru bir süperiletken olsaydı sonucun, soğutma geçmişine ve süperiletken türüne bağlı olabileceğini değerlendiriniz. Meissner durumunda akı dışlaması, tip-II süperiletkenlerde ise akı girdapları ve akı çivilemesinin (flux pinning) mıknatısın hareketini nasıl değiştirebileceğini açıklayınız.</div></div>"
    },
    {
      "id": "b0193",
      "heading": "Soru 10.19",
      "type": "assessment",
      "html": "<p><strong>Soru 10.19</strong>\nHassas bir deney düzeneği, düşük frekanslı veya yaklaşık durağan dış manyetik alanların etkisini azaltmak amacıyla yüksek manyetik geçirgenlikli yumuşak manyetik bir alaşım kılıfın içine yerleştiriliyor.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Kılıfın manyetik alan için daha düşük manyetik dirençli bir yol oluşturarak iç bölgedeki alan dağılımını nasıl değiştirebildiğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Kılıf kalınlığı, malzemenin manyetik geçirgenliği, açıklıklar, geometri ve doygunluğun kalkanlama etkinliğine etkisini değerlendiriniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Durağan veya düşük frekanslı manyetik alanların kalkanlanmasıyla yüksek frekanslı elektromanyetik alanların iletken ekranlarla azaltılması arasındaki farkı açıklayınız.</div></div>"
    },
    {
      "id": "b0198",
      "heading": "Soru 10.20",
      "type": "assessment",
      "html": "<p><strong>Soru 10.20</strong>\nBir indüksiyon ocağının bobini yüksek frekanslı alternatif akımla değişen bir manyetik alan oluşturur. Ferromanyetik ve elektriksel olarak iletken tabana sahip kaplar genellikle güçlü manyetik bağlaşım sağlar. Bazı özel ocak tasarımları ferromanyetik olmayan iletken kapları da ısıtabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Değişen manyetik akının kap tabanında girdap akımları oluşturmasını ve bu akımların Joule ısınmasına yol açmasını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Ferromanyetik malzemelerde manyetik geçirgenliğin bağlaşımı, histerezis kayıplarının ise ısınmayı nasıl etkileyebileceğini açıklayınız. Isınmanın yalnız histerezisle açıklanamayacağını belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Frekans arttıkça deri etkisinin ve akım dağılımının değişmesinin ısıtma davranışını nasıl etkileyebileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0201",
      "heading": "Soru 10.21",
      "type": "assessment",
      "html": "<p><strong>Soru 10.21</strong>\nSüperiletken bir MR ana mıknatısında büyük bir akım, normal çalışma sırasında çok küçük elektrik direnciyle dolaşabilir. Bobinin bir bölümü süperiletkenliğini ani olarak kaybederse direnç ortaya çıkar ve depolanmış manyetik enerji hızla başka enerji biçimlerine dönüşmeye başlar.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Basitleştirilmiş bir $RL$ devre modeliyle akımın azalmasının neden bobinde gerilim oluşturduğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">$U=\\tfrac12LI^2$ bağıntısını kullanarak büyük indüktans ve akımın neden önemli miktarda enerji depolanmasına yol açtığını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Depolanan enerjinin güvenli biçimde uzaklaştırılması ve çok düşük sıcaklık sisteminin korunması için koruma düzeneklerine neden gereksinim duyulduğunu değerlendiriniz.</div></div>"
    },
    {
      "id": "b0205",
      "heading": "Soru 10.22",
      "type": "assessment",
      "html": "<p><strong>Soru 10.22</strong>\nBir elektromıknatıslı hurdalık vincinde akım kesildikten sonra çekirdek ve bazı ferromanyetik parçalar bir miktar mıknatıslanma koruyabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Histerezis eğrisi üzerinden dış alan kaldırıldıktan sonra kalan mıknatıslanmayı ve bu mıknatıslanmayı sıfıra indirmek için gereken ters alanı açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Mıknatıslanmayı azaltmak için neden genliği giderek küçülen alternatif bir manyetik alan kullanılabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Çekirdek malzemesinin histerezis özelliklerinin vinç tasarımında neden önemli olduğunu değerlendiriniz.</div></div>"
    },
    {
      "id": "b0209",
      "heading": "Soru 10.23",
      "type": "assessment",
      "html": "<p><strong>Soru 10.23</strong>\n3 T sınıfı süperiletken bir MR sisteminin ana manyetik alanı, görüntüleme yapılmadığı zamanlarda da normalde açık olabilir. Bu nedenle ferromanyetik nesnelerin MR ortamına girişi denetim altında tutulur.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Ferromanyetik bir nesneye etki eden öteleme kuvvetinin yalnız alan büyüklüğüne değil, alanın uzaysal değişimine de bağlı olduğunu açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Ana mıknatısın bir bölgesinde süperiletkenliğin ani olarak kaybolmasının, depolanmış manyetik enerjinin hızla açığa çıkmasına neden olabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">MR odasındaki iletken ekranlamanın esas olarak radyo frekanslı elektromanyetik girişimi azaltmak için kullanıldığını, ana durağan manyetik alanı ortadan kaldırmadığını belirtiniz.</div></div>"
    },
    {
      "id": "b0211",
      "heading": "Soru 10.24",
      "type": "assessment",
      "html": "<p><strong>Soru 10.24</strong>\nGeri dönüşüm tesislerinde, hızla değişen manyetik alan üreten döner mıknatıs düzenekleri; iletken fakat ferromanyetik olmayan metallerin (örneğin alüminyum) diğer malzemelerden ayrılmasında kullanılabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Alüminyumun <strong>ferromanyetik olmamasına rağmen iyi bir elektrik iletkeni</strong> olduğunu; değişen alanın alüminyumda girdap akımları indükleyerek Lenz yasasına uygun bir elektromanyetik kuvvet oluşturabileceğini açıklayınız. Alüminyumun zayıf paramanyetik özelliğinin bu ayırma mekanizmasının temel nedeni olmadığını belirtiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Ferromanyetik çelik parçaların alanla çok daha güçlü mıknatıslanabildiğini ve pratik ayırma hatlarında çoğu kez ayrı mıknatıs kademeleriyle tutulduğunu/tasfiye edildiğini açıklayınız.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Elektriksel iletkenliği ve manyetik duyarlılığı çok küçük olan sıradan plastiklerde bu elektromanyetik etkilerin neden ihmal edilebilir kaldığını açıklayınız.</div></div>"
    },
    {
      "id": "b0214",
      "heading": "Soru 10.25",
      "type": "assessment",
      "html": "<p><strong>Soru 10.25</strong>\nKablosuz şarj düzeneğinin değişen manyetik alanına iletken bir metal cisim girdiğinde istenmeyen ısınma oluşabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">İletken metalde indüklenen girdap akımlarının Joule ısısına dönüşmesini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Ferromanyetik bir cisimde girdap akımı kayıplarına ek olarak manyetik geçirgenlik ve histerezisle ilişkili etkilerin de ortaya çıkabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bir şarj düzeneğinin yabancı metal cisimleri belirlemek için bobinin akım, gerilim, faz veya güç değişimlerinden nasıl yararlanabileceğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0319",
      "heading": "Soru 10.26",
      "type": "assessment",
