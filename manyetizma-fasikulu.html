      "heading": "Deney 3.24",
      "type": "experiment",
      "html": "<h3>Deney 3.24: İletkene etkiyen manyetik kuvvet</h3>Akım taşıyan iletkeni dengeli bir düzenekte mıknatıs alanına yerleştiriniz. Kuvveti akım ve etkin tel uzunluğuna göre ölçerek F=ILB modelini sınayınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Güvenlik</span><div class=\"subquestion-text\">Güç kaynağını kapatmadan devre bağlantısını değiştirmeyiniz; mıknatısları elektronik cihazlardan uzak tutunuz.</div></div>"
    },
    {
      "id": "olymp-3-01",
      "heading": "Olimpiyat Sorusu 3.25",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 3.25</strong> <span class=\"difficulty\">Orta-İleri</span> <span class=\"source-tag\">TÜBİTAK / Irodov tarzı</span></p>Bir hız seçicide elektrik alan ve manyetik alan birlikte kullanılmaktadır. Hızları <em>v₁</em> ve <em>v₂</em> olan iki iyonun izlediği yolları karşılaştırınız. Ardından seçicinin çıkışına yalnızca manyetik alan eklenerek kütle ayrımının nasıl yapılacağını türetiniz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Kuvvetlerin birbirini dengelemesi ve ardından kütleye bağlı yörüngeyi kullanmak.</div></div>"
    },
    {
      "id": "olymp-3-02",
      "heading": "Olimpiyat Sorusu 3.26",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 3.26</strong> <span class=\"difficulty\">Orta-İleri</span> <span class=\"source-tag\">Krotov / Halliday tarzı</span></p>Bir iletken çubuk manyetik alanda akım taşırken hem manyetik kuvvet hem de ağırlık etkisindedir. Çubuk yatay dengede tutuluyorsa akımın en küçük değerini ve yönünü bulunuz. Temas direnci ihmal edilmediğinde sonucu nasıl düzeltirsiniz?<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Serbest cisim diyagramı, kuvvet yönü ve devre modelini birlikte kurmak.</div></div>"
    },
    {
      "id": "olymp-3-04",
      "heading": "Olimpiyat Sorusu 3.27",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 3.27</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">Lorrain–Corson / TÜBİTAK proje tarzı</span></p>Bir Hall çubuğunda taşıyıcı yoğunluğu bilinmiyor. Akım, manyetik alan ve Hall gerilimi ölçülerek taşıyıcı yoğunluğunu ve işaretini nasıl belirlersiniz? Elektrot geometrisinin ölçüme etkisini belirtiniz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Deneysel model, işaret bilgisi, boyut analizi ve kalibrasyon.</div></div>"
    },

      "type": "chapter",
      "html": "<h1>BÖLÜM 4 — MANYETİK ALANDA YÜKLÜ PARÇACIK HAREKETİ</h1><p>Yüklü parçacıkların manyetik alandaki yörünge, periyot ve hapsolma davranışını inceler. Bu bölüm, hazırlık sorusundan örneklere ve öğrencinin çözümüne doğru kademeli olarak ilerler.</p>"

    {
      "id": "curriculum-prep-3",
      "heading": "Hazırlık Sorusu 3 — MANYETİK ALANDA YÜKLÜ PARÇACIK HAREKETİ",
      "type": "preparation",
      "html": "<h3>MANYETİK ALANDA YÜKLÜ PARÇACIK HAREKETİ</h3><p>Bu bölümün temel sorusunu günlük teknoloji, deney veya doğa olayı üzerinden düşününüz. Gözleminizi bir fizik modeliyle açıklamaya çalışınız.</p><p><strong>Başlangıç görevi — Manyetik alanda yüklü parçacık hareketi:</strong> Yüklü parçacıkların manyetik alandaki yörünge, periyot ve hapsolma davranışını inceler. Ön bilginizi kullanarak hangi büyüklüklerin ölçülmesi gerektiğini yazınız.</p>"
    },
    {
      "id": "curriculum-4-1",
      "heading": "KÖŞE TAŞI 4.1 — Çembersel hareket ve hareket parametreleri",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 4.1 — Çembersel hareket ve hareket parametreleri</h2><p>v⊥B olduğunda qvB merkezcil kuvveti sağlar: r=mv/(|q|B). İdeal düzgün alanda hız büyüklüğü sabittir.</p><div class=\"answer-formula\">Yarıçap kütle ve hızla artar, alanla ve yük büyüklüğüyle azalır.</div>\n<p>$$\\vec F_B=q(\\vec v\\times \\vec B),\\qquad F_B=|q|vB\\sin\\theta.$$</p>\n<ul>\n<li>Pozitif yük için yön sağ el kuralıyla, negatif yük için bunun tersiyle bulunur.</li>\n<li>Statik manyetik alan için $\\vec F_B\\cdot\\vec v=0$; manyetik kuvvet tek başına sürati ve kinetik enerjiyi değiştirmez.</li>\n<li>Hızı $\\vec B$'ye göre ayır:\n$$\\vec v=\\vec v_{\\parallel}+\\vec v_{\\perp}.$$</li>\n<li>Dik bileşen eğriliği belirler:\n$$r=\\frac{p_{\\perp}}{|q|B}.$$</li>\n<li>Klasik sınırda bir tam turun periyodu:\n$$T=\\frac{2\\pi m}{|q|B}.$$</li>\n<li>Helisel harekette bir turdaki eksenel ilerleme, tanım gereği\n$$h=v_{\\parallel}T$$\nile bulunur.\nYüksek enerjide $p=\\gamma m_0v$ kullanılmalıdır. Periyodu ezberden değiştirmek yerine\n$$r=\\frac{p_{\\perp}}{|q|B},\\qquad T=\\frac{2\\pi r}{v_{\\perp}}$$\nbağıntılarından yeniden türetiniz.</li>\n</ul>\n<p>Elektrik alan, zamanla değişen alanlar, çarpışmalar veya başka kuvvetler varsa parçacığın enerjisi değişebilir. &quot;$W_B=0$&quot; yalnızca manyetik Lorentz kuvvetinin yaptığı işe ilişkin bir ifadedir.</p>\n<p>Açısal hız ω=|q|B/m ve periyot T=2πm/(|q|B) ile verilir. İdeal siklotron frekansı hızdan bağımsızdır.</p><div class=\"answer-formula\">Göreli hızlarda bu bağıntılar düzeltilmeli, kütlenin etkin değişimi hesaba katılmalıdır.</div>"
    },
    {
      "id": "curriculum-support-4-example",
      "heading": "Örnek 4.1 — Temel model",
      "type": "example",
      "html": "<h3>Örnek 4.1 — Temel model — Temel model</h3><p>Dik hız bileşeni çembersel, paralel hız bileşeni düzgün doğrusal hareket üretir; birleşim sarmaldır.</p><p>Bir düzenekte alan, kuvvet veya akı değişimi inceleniyor. Önce sistemi şemalaştırınız; bilinenleri SI birimleriyle yazıp uygun fizik yasasını seçiniz.</p><div class=\"answer-formula\">Model → bağıntı → birim kontrolü → fiziksel yorum</div>"
    },
    {
      "id": "curriculum-support-4-assessment",
      "heading": "Uygulama 4.1 — Model kurma",
      "type": "assessment",
      "html": "<p><strong>Uygulama 4.1</strong> MANYETİK ALANDA YÜKLÜ PARÇACIK HAREKETİ başlığında verilen fiziksel durumu bir çizim ve en az bir bağıntıyla modelleyiniz.</p><div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Sistemdeki temel büyüklükleri ve birimlerini yazınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Kullanacağınız fizik yasasını ve yön/işaret seçimini gerekçelendiriniz.</div></div>"
    },
    {
      "id": "curriculum-4-3",
      "heading": "KÖŞE TAŞI 4.2 — Sarmal hareket ve manyetik bölge sınırları",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 4.2 — Sarmal hareket ve manyetik bölge sınırları</h2><p>Hızın v⊥ bileşeni çembersel, v∥ bileşeni alan doğrultusunda düzgün hareket oluşturur. Birleşim helisel yörüngedir.</p><div class=\"answer-formula\">Sarmalın adımı v∥T ile, yarıçapı mv⊥/(|q|B) ile ilişkilidir.</div>\n<p>Manyetik bölge sınırında parçacığın hız büyüklüğü korunur; ancak yönü ani biçimde değişebilir. Giriş ve çıkış noktaları geometriyle belirlenir.</p><div class=\"answer-formula\">Çözümde alan içi yay, alan dışı doğru parçası ve sınır koşulu birlikte çizilmelidir.</div>\n<p>Bu alt başlık, manyetizmanın temel kavramlarını fiziksel model ve ölçülebilir büyüklüklerle ilişkilendirir. Tanım, yön, birim ve geçerlilik koşulları birlikte değerlendirilmelidir.</p>"
    },
    {
      "id": "curriculum-4-6",
      "heading": "KÖŞE TAŞI 4.3 — Hızlandırıcılar, spektrometre ve manyetik ayna",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 4.3 — Hızlandırıcılar, spektrometre ve manyetik ayna</h2><p>Siklotron elektrik alanla enerji kazandırır, manyetik alanla parçacığın yörüngesini büker. İdeal frekans f=|q|B/(2πm) ile belirlenir.</p><div class=\"answer-formula\">Yüksek enerjilerde relativistik düzeltmeler klasik frekans sabitliğini bozar.</div>\n<p>Manyetik sapma yarıçapı r=mv/(|q|B) olduğundan ölçülen r, bilinen v ve B ile m/q oranını verir.</p><div class=\"answer-formula\">Aynı yükte farklı kütleler farklı yarıçaplarda iz bırakır.</div>\n<p>Manyetik momentin yaklaşık korunumu μ_m=p⊥²/(2mB), alan şiddeti artan bölgede paralel hareketin azalmasını açıklar.</p><div class=\"answer-formula\">Parçacık alan çizgileri boyunca ilerlerken ayna noktasında geri dönebilir.</div>"
    },
    {
      "id": "b0030",
      "heading": "Soru 4.2",
      "type": "experiment",
      "html": "<p><strong>Soru 4.2</strong>\nBir öğrenci, manyetik alanın yüklü parçacıklara etkisini incelemek için aşağıdaki düzeneği kurar: Farklı hızlarda ($v$) elektronlar, düzgün $B$ manyetik alanına dik olarak gönderilir ve yörünge yarıçapları ($r$) ölçülür.</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align:center\">$v$ ($10^6$ m/s)</th>\n<th style=\"text-align:center\">$r$ (cm)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align:center\">1.0</td>\n<td style=\"text-align:center\">0.57</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">2.0</td>\n<td style=\"text-align:center\">1.14</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">3.0</td>\n<td style=\"text-align:center\">1.71</td>\n</tr>\n<tr>\n<td style=\"text-align:center\">4.0</td>\n<td style=\"text-align:center\">2.28</td>\n</tr>\n</tbody>\n</table>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$r$ ile $v$ arasındaki ilişkiyi gösteren grafiği çiziniz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Grafiğin eğiminden manyetik alanın büyüklüğünü ($B$) hesaplayınız. ($e/m = 1.76 \\times 10^{11}$ C/kg)</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Eğer aynı deney protonlarla yapılsaydı, aynı hızlar için yarıçaplar nasıl değişirdi? (Proton kütlesi, elektron kütlesinin yaklaşık 1836 katıdır.)</div></div>"
    },
    {
      "id": "b0033",
      "heading": "Soru 4.3",
      "type": "extraordinary",
      "html": "<p><strong>Soru 4.3</strong>\nBir siklotronda proton hızlandıkça görelilik etkileri devreye girer. Özel göreliliğe göre momentum $p = \\gamma m_0 v$ olduğundan, dönme açısal frekansı $\\omega = qB/(\\gamma m_0)$ olur.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Görelilik bir parçacığın dönme periyodunun $T = \\frac{2\\pi \\gamma m_0}{qB}$ olduğunu gösteriniz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Görelilik kinetik enerji bağıntısı $K=(\\gamma-1)m_0c^2$ olduğuna göre, protonun kinetik enerjisi 1 GeV'a ulaştığında $\\gamma$ faktörünü bulunuz. ($m_0c^2=938$ MeV; kontrol için $\\gamma=1+1000/938\\approx2.066$.)</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bu durumda, sabit frekanslı bir siklotron neden çalışmayı durdurur? Mühendisler bu sorunu nasıl çözer? (Sinkrotron prensibi)</div></div>"
    },
    {
      "id": "b0034",
      "heading": "Soru 4.4",
      "type": "extraordinary",
      "html": "<p><strong>Soru 4.4</strong>\nPulsarlar, güçlü manyetik alanlara sahip dönen nötron yıldızlarıdır. Tipik bir radyo pulsarının yüzey dipol alanı yaklaşık $10^{12}$ gauss, yani $B\\sim10^8$ T büyüklük düzeyinde olabilir. Aşağıdaki hesap <strong>klasik ve yerel bir yaklaşık büyüklük tahmini</strong> olarak ele alınacaktır; çok güçlü alanlarda kuantum etkilerinin önem kazanabileceğini unutmayınız.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bir elektronun hızı manyetik alana dik ve $v=1.0\\times10^6$ m/s ise, klasik Larmor yarıçapını $r=mv/(eB)$ ile hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bulduğunuz yarıçapı $10^{-15}$ m büyüklük düzeyindeki çekirdek boyutuyla karşılaştırınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">İvmelenen yüklü parçacıkların elektromanyetik ışıma yapması ile sinkrotron/gyro-sinkrotron ışıması arasındaki ilişkiyi açıklayınız. Tüm pulsar ışımasının tek başına sinkrotron mekanizmasıyla açıklanamayacağını belirtiniz.</div></div>"
    },
    {
      "id": "b0268",
      "heading": "Soru 4.5",
      "type": "assessment",
      "html": "<p><strong>Soru 4.5</strong></p>\n<p>Bir proton, düzgün bir manyetik alana $\\theta = 30°$ açısıyla giriyor. Protonun yörüngesi ile ilgili aşağıdakilerden hangisi doğrudur?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Yörünge düzlemsel bir çemberdir.</div></div>\n<div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Yörünge düz bir çizgidir.</div></div>\n<div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Yörünge helisel (sarmal) olup, heliks adımı $p = \\frac{2\\pi m v \\cos 30°}{qB}$'dir.</div></div>\n<div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Yörünge helisel olup, heliks adımı $p = \\frac{2\\pi m v \\sin 30°}{qB}$'dir.</div></div>\n<div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Yörünge paraboldür.</div></div>"
    },
    {
      "id": "b0269",
      "heading": "Soru 4.6",
      "type": "assessment",
      "html": "<p><strong>Soru 4.6</strong></p>\n<p>Bir öğrenci, bilinmeyen bir manyetik alanın büyüklüğünü ölçmek için aşağıdaki yöntemi kullanıyor: $v = 2 \\times 10^6$ m/s hızla hareket eden elektronları alana dik gönderiyor ve yörünge yarıçapını $r = 11.4$ cm olarak ölçüyor.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Manyetik alanın büyüklüğünü hesaplayınız. ($e/m = 1.76 \\times 10^{11}$ C/kg)</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Aynı alanda proton gönderilseydi, yarıçap kaç olurdu? ($m_p/m_e = 1836$)</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Ölçüm belirsizliği $\\Delta r = 0.5$ cm ise, $B$'deki belirsizliği hesaplayınız.</div></div>"
    },
    {
      "id": "olymp-1-01",
      "heading": "Olimpiyat Sorusu 4.7",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 4.7</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">TÜBİTAK / IPhO tarzı</span></p>Düzgün bir <em>B</em> alanı, genişliği <em>d</em> olan sonlu bir bölgeyle sınırlıdır. Pozitif yüklü parçacık bölge sınırına dik olmayan hızla giriyor. Parçacığın bölgeden çıkıp çıkamayacağını; giriş açısı, <em>r=m v/(qB)</em> ve <em>d</em> arasındaki ilişkiyle sınıflandırınız. Çıkış noktası için geometrik bir bağıntı kurunuz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Geometri, sınır koşulu, enerji değişmezliği ve yörünge yarıçapını birlikte kullanmak.</div></div>"
    },
    {
      "id": "olymp-1-06",
      "heading": "Olimpiyat Sorusu 4.8",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 4.8</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">IPhO / Feynman tarzı</span></p>Bir proton düzgün manyetik alana helisel yörüngeyle girmektedir. Aynı manyetik alana ters yönde fakat aynı büyüklükte bir elektrik alan eklenirse periyot, hatve ve merkezkaç yarıçapı nasıl değişir? Elektrik alanın hızın paralel bileşeni üzerindeki etkisini ayırarak çözünüz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Hareketi paralel ve dik bileşenlere ayırmak; manyetik kuvvetin iş yapmadığını göstermek.</div></div>"
    },
    {
      "id": "b0120",
      "heading": "Soru 4.9",
      "type": "extraordinary",
      "html": "<p><strong>Soru 4.9</strong>\nBir $+q$ yüklü parçacık, $\\vec{B} = B \\hat{k}$ manyetik alanı ve $\\vec{E} = E \\hat{j}$ elektrik alanı içindedir. Parçacık $t=0$'da durgun halden bırakılıyor.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Parçacığın hareket denklemlerini ($m\\ddot{x}, m\\ddot{y}, m\\ddot{z}$) yazınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Başlangıç koşullarına bağlı olarak yörüngenin sikloid benzeri, trokoid veya dairesel hareket üzerine sürüklenme şeklinde görülebileceğini gösteriniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Parçacığın ortalama sürüklenme hızını ($\\vec{E} \\times \\vec{B}$ sürüklenmesi) bulunuz.</div></div>"
    },
    {
      "id": "b0121",
      "heading": "Soru 4.10",
      "type": "extraordinary",
      "html": "<p><strong>Soru 4.10</strong>\nÇevresi yaklaşık 27 km olan yüksek enerjili bir proton hızlandırıcısında, proton demeti yaklaşık $r=2800\\,\\mathrm{m}$ bükülme yarıçapıyla $B=8.3\\,\\mathrm{T}$ büyüklüğündeki dipol alanlarında yönlendirilmektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Önce $p=qBr$ ile momentumu bulunuz. Ardından\n$$E_{top}=\\sqrt{(pc)^2+(m_pc^2)^2},\\qquad K=E_{top}-m_pc^2$$\nbağıntılarını kullanarak protonun kinetik enerjisini TeV cinsinden hesaplayınız. $m_pc^2=0.938\\,\\mathrm{GeV}$ ve $1\\,\\mathrm{TeV}=10^{12}\\,\\mathrm{eV}$ alınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu büyüklükteki manyetik alanların parçacık hızlandırıcılarında süperiletken mıknatıslarla üretilmesinin enerji tüketimi ve ısınma bakımından sağladığı üstünlüğü açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Proton enerjisi arttıkça görelilik etkilerinin dönme frekansı üzerindeki etkisini açıklayınız.</div></div>"
    },
    {
      "id": "b0297",
      "heading": "Soru 4.11",
      "type": "extraordinary",
      "html": "<p><strong>Soru 4.11</strong></p>\n<p>Proton tedavisinde kullanılan bir hızlandırıcıda demet, $B=1.5\\,\\mathrm{T}$ manyetik alanlı bükme mıknatıslarından geçiriliyor.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Düşük enerjili klasik sınır için protonun siklotron frekansını $f=qB/(2\\pi m_p)$ ile hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Kinetik enerjisi $K=200\\,\\mathrm{MeV}$ olan proton için</div></div>\n<div>$$pc=\\sqrt{K(K+2m_pc^2)}$$</div>\n<p>ve $r=p/(qB)$ bağıntılarını kullanarak bükülme yarıçapını bulunuz. ($m_pc^2=938\\,\\mathrm{MeV}$)</p>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Tedavi derinliğini değiştirmek için demet enerjisinin değiştirilmesi gerektiğini; enerji değiştiğinde taşıma hattındaki mıknatısların da yeni manyetik rijitliğe $B\\rho=p/q$ uyacak biçimde yeniden ayarlanacağını açıklayınız.</div></div>"
    },
    {
      "id": "b0301",
      "heading": "Soru 4.12",
      "type": "extraordinary",
      "html": "<p><strong>Soru 4.12</strong></p>\n<p>Bir kütle spektrometresinde tek yüklü iyonların hızları aynı hız seçiciden geçirilmiştir. $^{12}\\mathrm{C}^+$ iyonu için $r_{12}=12.0\\,\\mathrm{cm}$, bilinmeyen iyon için $r_x=18.0\\,\\mathrm{cm}$ ölçülüyor.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Aynı $v$, $q$ ve $B$ koşullarında $m\\propto r$ olduğundan bilinmeyen iyonun kütlesini atomik kütle birimi cinsinden bulunuz.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Kütle yalnız yarıçap oranından bulunuyorsa ortak bir $B$ ölçüm ayarı hatasının neden büyük ölçüde sadeleştiğini açıklayınız. Buna karşılık mutlak formül $m=qBr/v$ ile $B_{gerçek}=0.98B_{nominal}$ olmasına rağmen $B_{nominal}$ kullanılırsa hesaplanan kütlenin yüzde kaç yüksek çıkacağını bulunuz.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Çözünürlüğü artırmak için alan/hız kararlılığı, yörünge ölçüm hassasiyeti ve dedektör geometrisinin rolünü değerlendiriniz.</div></div>"
    },
    {
      "id": "b0125",
      "heading": "Soru 4.13",
      "type": "assessment",
      "html": "<p><strong>Soru 4.13</strong>\nBir siklotronda protonlar $B=1.5$ T manyetik alanında döndürülmektedir. Maksimum yörünge yarıçapı $R=0.50$ m'dir. Görelilik düzeltmelerinin bu soruda ihmal edildiğini kabul ediniz.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Protonların çıkış kinetik enerjisini MeV cinsinden hesaplayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Protonların siklotron frekansını bulunuz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Proton yerine gerçek bir alfa parçacığı ($q=+2e$, $m\\approx4m_p$) aynı $B$ ve aynı maksimum $R$ ile hızlandırılsaydı, çıkış kinetik enerjisi ve siklotron frekansı protonunkine göre nasıl değişirdi?</div></div>"
    },
    {
      "id": "b0126",
      "heading": "Soru 4.14",
      "type": "assessment",
      "html": "<p><strong>Soru 4.14</strong>\nBir elektron, Dünya'nın manyetik alanının büyüklüğünün $B\\sim5\\times10^{-5}$ T olduğu bir bölgede $v=10^6$ m/s hızla, <strong>alana dik</strong> hareket etmektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$F_B=e vB$ ile manyetik kuvvetin büyüklüğünü büyüklük düzeyi olarak tahmin ediniz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu kuvveti elektronun ağırlığı $m_eg$ ile karşılaştırınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Sonucun, Dünya yakınındaki enerjik elektronların yönlendirilmesinde manyetik etkinin yerçekimine göre neden çok daha önemli olabileceğini açıkladığını; fakat auroral parçacıkların enerjisinin kaynağını tek başına açıklamadığını değerlendiriniz.</div></div>"
    },
    {
      "id": "b0131",
      "heading": "Soru 4.15",
      "type": "assessment",
      "html": "<p><strong>Soru 4.15</strong>\n\"Güneş yelkeni\" fotonların momentumunu kullanarak uzay aracını iter. Benzer bir şekilde, \"manyetik yelken\" fikri, uzay aracının etrafında oluşturulan güçlü bir manyetik alanın, güneş rüzgârındaki yüklü parçacıkları saptırarak bir itme kuvveti oluşturmasına dayanır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Güneş rüzgârındaki protonlar ($v \\sim 500$ km/s), bir uzay aracının manyetik alanına ($B \\sim 10^{-4}$ T) çarptığında, yörünge yarıçapları ne olur?</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Manyetik yelkenin \"yörünge yarıçapı\", yelkenin fiziksel boyutundan büyükse, itme nasıl gerçekleşir?</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bu sistemin avantajını, roket yakıtına göre değerlendiriniz.</div></div>"
    },
    {
      "id": "b0298",
      "heading": "Soru 4.16",
      "type": "assessment",
      "html": "<p><strong>Soru 4.16</strong></p>\n<p>Bir Hall algılayıcısında, akım $+x$ yönünde, manyetik alan $+z$ yönündedir. Ölçülen Hall gerilimi $-y$ yönündeki kenarda pozitiftir.</p>\n<p>Bu malzemedeki yük taşıyıcıları nedir?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Elektronlar (negatif yük)</div></div>\n<div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Deşikler (pozitif yük)</div></div>\n<div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Nötr parçacıklar</div></div>\n<div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Hem elektronlar hem deşikler eşit oranda</div></div>\n<div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Belirlenemez</div></div>"
    },
    {
      "id": "rev-3-01",
      "heading": "İleri Düzey Soru 4.17",
      "type": "assessment",
      "html": "<p><strong>İleri Düzey Soru 4.17</strong> <span class=\"difficulty\">Temel</span> <span class=\"source-tag\">Kaynak temelli</span></p>q yüklü parçacık v ve B vektörleriyle aynı doğrultuda hareket ediyor. Kuvvetin neden sıfır olduğunu çapraz çarpım ve fiziksel yorumla açıklayınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"
    },
    {
      "id": "olymp-3-03",
      "heading": "Olimpiyat Sorusu 4.18",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 4.18</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">Feynman / MIT OCW tarzı</span></p>Bir parçacık düzgün <em>B</em> alanında dairesel hareket yaparken enerjisinin sabit kaldığı biliniyor. Aynı parçacık hızlandırıcı bir elektrik alanla beslenseydi yarıçap, açısal hız ve periyot nasıl evrilirdi? Klasik yaklaşımın başarısız olacağı sınırı tartışınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Manyetik alanın iş yapmaması, elektrik alanla enerji artışı ve model sınırı.</div></div>"
    },
    {
      "id": "olymp-3-06",
      "heading": "Olimpiyat Sorusu 4.19",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 4.19</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">Young–Freedman / TÜBİTAK deneysel tarzı</span></p>Bir kütle spektrometresinde aynı kinetik enerjiyle giren iki iyonun iz yarıçapları ölçülüyor. Ölçüm belirsizlikleri <em>δr</em> ve <em>δB</em> verildiğinde kütle oranı belirsizliğini yaklaşık yayılım yöntemiyle hesaplayınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Modelden ölçülebilir büyüklük türetmek ve belirsizlik yayılımı uygulamak.</div></div>"
    },
    {
      "id": "b0305",
      "heading": "Soru 4.20",
      "type": "activity",
      "html": "<p><strong>Soru 4.20</strong></p>\n<p>Güneş kaynaklı jeomanyetik fırtınalar sırasında Dünya yakınındaki parçacık ortamı ve manyetik alan zamanla değişebilir. Bu süreçler aurora etkinliğini artırabilir ve teknolojik sistemleri etkileyebilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Güneş rüzgârındaki yüklü parçacıkların Dünya'nın manyetik alanındaki hareketini Lorentz kuvveti açısından açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Zamanla değişen jeomanyetik alanın uzun iletken yapılarda ve elektrik şebekelerinde gerilim/akım indükleyebilmesini Faraday yasasıyla ilişkilendiriniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Astronotların güneş parçacık olaylarına karşı korunmasında operasyonel olarak kullanılan temel yaklaşımın yalnız “manyetik kalkan” olmadığını; olay takibi, görev planlaması ve kütlesel/radyasyon kalkanlı sığınak bölgelerinin rolünü açıklayınız. Aktif manyetik kalkanlamanın ise araştırılan bir yaklaşım olduğunu belirtiniz.</div></div>"
    },
    {
      "id": "b0174",
      "heading": "Soru 4.21",
      "type": "extraordinary",
      "html": "<p><strong>Soru 4.21</strong>\nTokamak plazmalarında bazı kararsızlıklar, kapalı manyetik yüzeylerin yerel yapısını bozarak manyetik ada adı verilen bölgeler oluşturabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Manyetik ada içinde alan çizgileri boyunca enerji taşınımının sıcaklık ve basınç dağılımını yerel olarak düzleştirmesinin plazmanın enerji hapsini neden olumsuz etkileyebileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Elektronların siklotron hareketiyle rezonanslı mikrodalga enerjisinin belirli bir bölgeye aktarılmasının, yerel akım dağılımını değiştirerek bazı kararsızlıkların azaltılmasına nasıl yardımcı olabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Tokamakta önemli bir plazma akımı bulunmasına karşılık başka halka biçimli plazma düzeneklerinde gerekli manyetik alanın büyük ölçüde dış bobinlerle oluşturulabilmesinin temel farkını açıklayınız.</div></div>"
    },

    {
      "id": "curriculum-chapter-4",
      "heading": "BÖLÜM 5 — AKIM TAŞIYAN İLETKENE ETKİ EDEN KUVVET",
      "type": "chapter",
      "html": "<h1>BÖLÜM 5 — AKIM TAŞIYAN İLETKENE ETKİ EDEN KUVVET</h1><p>Akım taşıyan iletkenlerde kuvvet, tork ve elektromekanik enerji dönüşümünü kurar. Bu bölüm, hazırlık sorusundan örneklere ve öğrencinin çözümüne doğru kademeli olarak ilerler.</p>"
    },
    {
      "id": "curriculum-prep-4",
      "heading": "Hazırlık Sorusu 4 — AKIM TAŞIYAN İLETKENE ETKİ EDEN KUVVET",
      "type": "preparation",
      "html": "<h3>AKIM TAŞIYAN İLETKENE ETKİ EDEN KUVVET</h3><p>Bu bölümün temel sorusunu günlük teknoloji, deney veya doğa olayı üzerinden düşününüz. Gözleminizi bir fizik modeliyle açıklamaya çalışınız.</p><p><strong>Başlangıç görevi — Akım taşıyan iletkene etki eden kuvvet:</strong> Akım taşıyan iletkenlerde kuvvet, tork ve elektromekanik enerji dönüşümünü kurar. Ön bilginizi kullanarak hangi büyüklüklerin ölçülmesi gerektiğini yazınız.</p>"
    },
    {
      "id": "curriculum-5-1",
      "heading": "KÖŞE TAŞI 5.1 — İletkenler ve paralel akımlar arasındaki kuvvet",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 5.1 — İletkenler ve paralel akımlar arasındaki kuvvet</h2><p>Akım taşıyan telde F=IL×B bağıntısı geçerlidir. Kuvvetin yönü akım yönü ile alan yönünün çapraz çarpımıdır.</p><div class=\"answer-formula\">Tel alanla paralelse kuvvet sıfır, dikse maksimumdur.</div>\n<p>Paralel teller arasında birim uzunluk kuvveti F/L=μ₀I₁I₂/(2πd)’dir. Aynı yönlü akımlar çeker, zıt yönlü akımlar iter.</p><div class=\"answer-formula\">Bu sonuç amperin klasik tanımının ve elektromıknatıs tasarımının temelidir.</div>"
    },
    {
      "id": "curriculum-support-5-example",
      "heading": "Örnek 5.1 — Temel model",
      "type": "example",
      "html": "<h3>Örnek 5.1 — Temel model — Temel model</h3><p>Akım taşıyan iletken üzerindeki kuvvet, tork ve dipol moment elektromekanik düzeneklerin temelidir.</p><p>Bir düzenekte alan, kuvvet veya akı değişimi inceleniyor. Önce sistemi şemalaştırınız; bilinenleri SI birimleriyle yazıp uygun fizik yasasını seçiniz.</p><div class=\"answer-formula\">Model → bağıntı → birim kontrolü → fiziksel yorum</div>"
    },
    {
      "id": "curriculum-support-5-assessment",
      "heading": "Uygulama 5.1 — Model kurma",
      "type": "assessment",
      "html": "<p><strong>Uygulama 5.1</strong> AKIM TAŞIYAN İLETKENE ETKİ EDEN KUVVET başlığında verilen fiziksel durumu bir çizim ve en az bir bağıntıyla modelleyiniz.</p><div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Sistemdeki temel büyüklükleri ve birimlerini yazınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Kullanacağınız fizik yasasını ve yön/işaret seçimini gerekçelendiriniz.</div></div>"
    },
    {
      "id": "curriculum-5-3",
      "heading": "KÖŞE TAŞI 5.2 — Akım çerçevesi, dipol moment ve denge",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 5.2 — Akım çerçevesi, dipol moment ve denge</h2><p>Akım çerçevesinde τ=μB sinθ ve μ=IA n̂ bağıntıları kullanılır. Denge, net torkun sıfır olmasıyla değerlendirilir.</p><div class=\"answer-formula\">Tork çerçeveyi alanla hizalamaya çalışır.</div>\n<p>Akım halkasının manyetik dipol momenti μ=IA n̂ yönündedir. Düzgün alanda net kuvvet sıfır olabilirken tork sıfır olmayabilir.</p><div class=\"answer-formula\">Dipol moment alanla hizalandığında kararlı yönelim oluşur.</div>\n<ul>\n<li>Akım ilmeği için manyetik dipol momenti:\n$$\\vec\\mu=NI\\vec A.$$</li>\n<li>Düzgün alanda:\n$$\\vec\\tau=\\vec\\mu\\times\\vec B,\\qquad U=-\\vec\\mu\\cdot\\vec B.$$</li>\n<li>İdeal noktasal dipol için düzgün alanda net öteleme kuvveti sıfır olabilir; tork sıfır olmak zorunda değildir.</li>\n<li>Düzgün olmayan alanda, sabit bir dipol için:\n$$\\vec F=\\nabla(\\vec\\mu\\cdot\\vec B).$$</li>\n</ul>\n<p><strong>KÜÇÜK DUYARLILIKLI MALZEME MODELİ</strong>\nBir boyutta, $|\\chi|\\ll1$ ve hava/vakum çevresi için yaklaşık olarak\n$$F_z\\simeq \\frac{\\chi V}{\\mu_0}B\\frac{dB}{dz}\n=\\frac{\\chi V}{2\\mu_0}\\frac{d(B^2)}{dz}.$$</p>\n<p>Bir nesneyi yalnızca &quot;güçlü&quot; bir manyetik alanla çekmek yeterli değildir; öteleme için çoğu dipol modelinde <strong>alan gradyanı</strong> gerekir. Kuvvet bağıntısı malzeme doğrusal değilse, doygunluk varsa veya geometri karmaşıksa yeniden modellenmelidir.</p>\n<p>Bu alt başlık, manyetizmanın temel kavramlarını fiziksel model ve ölçülebilir büyüklüklerle ilişkilendirir. Tanım, yön, birim ve geçerlilik koşulları birlikte değerlendirilmelidir.</p>"
    },
    {
      "id": "curriculum-5-6",
      "heading": "KÖŞE TAŞI 5.3 — Motor, galvanometre ve enerji dönüşümü",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 5.3 — Motor, galvanometre ve enerji dönüşümü</h2><p>Galvanometrede akımın manyetik torku yay torkuyla dengelenir. Motorlarda aynı tork sürekli komütasyonla dönme hareketine dönüştürülür.</p><div class=\"answer-formula\">Ölçüm doğruluğu alanın düzgünlüğü, yay sabiti ve ölçek kalibrasyonuna bağlıdır.</div>\n<p>Bobinde depolanan enerji U=½LI²’dir. Akım yükselirken kaynak enerjisinin bir bölümü manyetik alanda depolanır.</p><div class=\"answer-formula\">Devre açılırken bu enerji yüksek gerilim darbesine dönüşebileceğinden koruma elemanı gerekir.</div>"
    },
    {
      "id": "b0017",
      "heading": "Soru 5.2",
      "type": "yourturn",
      "html": "<p><strong>Soru 5.2</strong>\nÖzdeş iki çubuk mıknatıs, zıt kutupları birbirine bakacak ve aralarındaki uzaklık mıknatıs boyutlarına göre yeterince büyük olacak biçimde ortak eksen üzerinde yerleştirilmiştir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Mıknatıslar arasındaki manyetik alan çizgilerinin dağılımını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Çekim kuvvetini, bir manyetik dipolün düzgün olmayan dış alandaki enerjisi ve alan gradyanı üzerinden açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\"><strong>Uzak alan dipol yaklaşımında</strong> bir mıknatısın alanı $B\\propto r^{-3}$ olsun. İkinci mıknatısın dipol momenti sabitken eksen doğrultusunda $F\\sim \\mu,|dB/dr|$ ölçeklemesini kullanarak kuvvetin $r$'ye bağımlılığını türetiniz. Uzaklık iki katına çıkarılırsa kuvvetin hangi orana düşeceğini bulunuz.</div></div>"
    },
    {
      "id": "b0275",
      "heading": "Soru 5.3",
      "type": "activity",
      "html": "<p><strong>Soru 5.3</strong>\nVarsayımsal bir spor izleme düzeninde topun içine küçük bir kalıcı mıknatıs, saha kenarına ise üç eksenli manyetik alan algılayıcıları yerleştirilmiştir. Top döndükçe mıknatısın dipol momentinin laboratuvar eksenlerine göre yönü değişmektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Çok eksenli algılayıcılarda gözlenen dönemli alan değişiminden topun dönme frekansı hakkında nasıl bilgi çıkarılabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Yalnız yaklaşık büyüklük karşılaştırması amacıyla, $v=30\\,\\mathrm{m/s}$ hızla ve $B=50\\,\\mu\\mathrm{T}$ alana dik hareket eden tek bir elektron için $F_{max}=evB$ değerini bulunuz. Bu kuvvetin gerçek algılayıcının çalışma mekanizması olmadığını belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Manyetik alan ölçümüne ek olarak ivmeölçer ve dönüölçer verilerinin kullanılmasının hareketin belirlenmesine nasıl katkı sağlayabileceğini açıklayınız.</div></div>"
    },
    {
      "id": "b0277",
      "heading": "Soru 5.4",
      "type": "activity",
      "html": "<p><strong>Soru 5.4</strong></p>\n<p>Bazı gastroenteroloji prosedürlerinde, hastaya küçük bir manyetik kapsül yutturulur ve dışarıdan bir mıknatıs veya elektromıknatıs sistemiyle kapsülün mide içindeki konumu ve yönü kontrol edilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Manyetik kapsüle etkiyen kuvvetin, manyetik alan gradyanına bağlı olduğunu ($F \\propto \\nabla(\\vec{\\mu} \\cdot \\vec{B})$) açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Kapsülü mide içinde belirli bir noktaya yönlendirmek için, dış manyetik alanın homojen mi yoksa gradyanlı mı olması gerekir? Neden?</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Kapsülün yönünü (yönelimunu) değiştirmek için hangi manyetik alan özelliği kullanılır? (Tork: $\\vec{\\tau} = \\vec{\\mu} \\times \\vec{B}$)</div></div>"
    },
    {
      "id": "b0035",
      "heading": "Soru 5.5",
      "type": "extraordinary",
      "html": "<p><strong>Soru 5.5</strong>\nMars için yapay manyetik kalkan fikirleri, Güneş rüzgârı plazması ile oluşturulacak manyetik alanın etkileşimini tartışan araştırma önerileridir. Aşağıdaki model, yalnızca dipol alanı ve basınç dengesi kullanan basitleştirilmiş bir yaklaşımdır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Güneş rüzgârındaki yüklü parçacıkların yerel ölçekte hangi Lorentz kuvvetiyle saptırıldığını yazınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Gerçek bir manyetopozun yöneliminin yalnızca “Kuzey-Güney kutbu nereye baksın?” sorusuyla belirlenemeyeceğini; güneş rüzgârı, plazma akımları, manyetik yeniden bağlantı ve dipol geometrisinin birlikte rol oynadığını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Kaynak dipolün manyetik dipol momenti $M$ olsun. Uzak dipol alanında $B(r)\\propto M/r^3$ ve sınırda $B^2/(2\\mu_0)=P_{sw}$ kabul edilsin. Güneş rüzgârı dinamik basıncı sabitken durma uzaklığının $r_s\\propto M^{1/3}$ olduğunu gösteriniz. Dipol momenti iki katına çıkarılırsa $r_s$ hangi çarpanla değişir?</div></div>"
    },
    {
      "id": "b0049",
      "heading": "Soru 5.6",
      "type": "assessment",
      "html": "<p><strong>Soru 5.6</strong>\n<em>Magnetospirillum magneticum</em> adı verilen bazı bakteriler, vücutlarında zincir halinde dizili manyetit ($Fe_3O_4$) kristalleri (manyetozomlar) üretirler. Bu bakteriler, Dünya'nın manyetik alanını bir pusula gibi kullanarak, oksijen seviyesinin onlar için en uygun olduğu su katmanlarına yüzerler.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Dünya'nın manyetik alanı bu bakterilere bir \"kuvvet\" mi uygular yoksa bir \"tork\" mu? Bu ayrım, bakterinin hareket mekanizması için neden hayati öneme sahiptir?</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bakteriler neden tek bir büyük manyetik kristal yerine, nanometre boyutunda birçok küçük kristali zincir halinde tutmayı tercih eder? (Termal titreşimler / Brown hareketi ile manyetik hizalama enerjisi arasındaki rekabeti değerlendiriniz.)</div></div>"
    },
    {
      "id": "b0051",
      "heading": "Soru 5.7",
      "type": "assessment",
      "html": "<p><strong>Soru 5.7</strong>\nManyetik parçacıkların ilaç taşıyıcısı olarak kullanılması, hedef bölgede ilaç yoğunluğunu artırmaya yönelik araştırılan yöntemlerden biridir. Bu tür bir düzende manyetik özellik taşıyan parçacıkların damar içindeki hareketi, dışarıdan oluşturulan düzgün olmayan manyetik alanla etkilenmeye çalışılır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Düzgün bir manyetik alanda dipole tork etki edebilmesine karşın net öteleme kuvveti için neden alan gradyanı gerektiğini $\\vec F=\\nabla(\\vec\\mu\\cdot\\vec B)$ bağıntısıyla açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Dış mıknatıstan uzaklaşıldıkça hem alanın hem alan gradyanının hızla azalmasının hedefleme üzerindeki etkisini açıklayınız. Azalmanın kesin kuvvet yasasının kaynak geometrisine bağlı olduğunu belirtiniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Kan akışı, damar geometrisi, parçacık boyutu ve alan gradyanı gibi değişkenlerin yöntemin başarısını neden birlikte belirlediğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0266",
      "heading": "Soru 5.8",
      "type": "assessment",
      "html": "<p><strong>Soru 5.8</strong></p>\n<p>Bir çubuk mıknatıs, düzgün bir dış manyetik alan içine yerleştiriliyor. Mıknatısın manyetik dipol momenti $\\vec{\\mu}$ ile dış alan $\\vec{B}$ arasındaki açı $\\theta = 45°$'dir.</p>\n<p>Mıknatısa etkiyen tork ve potansiyel enerji için aşağıdakilerden hangisi doğrudur?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Tork sıfırdır, potansiyel enerji sıfırdır.</div></div>\n<div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Tork maksimumdur, potansiyel enerji minimumdur.</div></div>\n<div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Tork sıfırdan farklıdır, potansiyel enerji sıfırdan farklıdır.</div></div>\n<div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Tork maksimumdur, potansiyel enerji maksimumdur.</div></div>\n<div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Tork sıfırdır, potansiyel enerji maksimumdur.</div></div>"
    },
    {
      "id": "rev-1-04",
      "heading": "İleri Düzey Soru 5.9",
      "type": "assessment",
      "html": "<p><strong>İleri Düzey Soru 5.9</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">Kaynak temelli</span></p>Manyetik dipol yaklaşımında alanın büyüklüğü r⁻³ ile azalıyor. Alan gradyanının r’ye bağlı ölçeklenmesini türev alarak çıkarınız ve dipolün neden düzgün olmayan alana yöneldiğini açıklayınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"
    },
    {
      "id": "olymp-1-02",
      "heading": "Olimpiyat Sorusu 5.10",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 5.10</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">Purcell–Morin / Griffiths tarzı</span></p>Aynı eksen üzerinde bulunan iki kısa manyetik dipolün alanları orta bölgede birbirini kısmen yok etmektedir. Dipollerin momentleri <em>m</em> ve <em>2m</em>, aralarındaki uzaklık <em>a</em> olsun. Eksen üzerindeki yaklaşık nötr noktanın konumunu uzak alan bağıntısıyla bulunuz; yaklaşık çözümün hangi koşulda geçersiz olduğunu tartışınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Dipol alanı, süperpozisyon ve yaklaşık modelin hata sınırını sorgulamak.</div></div>"
    },
    {
      "id": "b0077",
      "heading": "Soru 5.11",
      "type": "extraordinary",
      "html": "<p><strong>Soru 5.11</strong>\nUzunluğu $L$ olan düz bir tel parçası, $I$ akımı taşımaktadır. Telin orta noktasından $d$ dik uzaklıktaki bir noktada manyetik alanı Biot-Savart yasasıyla türetiniz.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$L \\to \\infty$ limitinde sonucun $B = \\frac{\\mu_0 I}{2\\pi d}$ olduğunu gösteriniz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">$L \\ll d$ limitinde sonucun, kısa akım elemanı yaklaşımıyla verilen alana yakınsadığını gösteriniz.</div></div>\n<p><em>Düz tel parçası kapalı akım döngüsü değildir; bu nedenle tek başına standart manyetik dipol olarak adlandırılmamalıdır. Uzak alanda Biot-Savart alanı, kısa akım elemanı yaklaşımıyla verilir; fakat manyetik dipol alanı için kapalı akım döngüsü gerekir.</em></p>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Bu iki limit arasındaki fiziksel farkı değerlendiriniz.</div></div>"
    },
    {
      "id": "b0115",
      "heading": "Soru 5.12",
      "type": "activity",
      "html": "<p><strong>Soru 5.12</strong>\nBir doğru akım elektrik motorunda $N$ sarımlı, alanı $A$ olan bobinden $I$ akımı geçmekte ve bobin düzgün $B$ alanında dönmektedir. Bobinin manyetik dipol momenti $\\vec\\mu=NI A,\\hat n$ olsun.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">$\\vec\\tau=\\vec\\mu\\times\\vec B$ bağıntısından maksimum torku türetiniz.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\"><strong>Bobinin normali (dolayısıyla $\\vec{\\mu}$) manyetik alana paralel olduğunda</strong> torkun neden sıfır olduğunu açıklayınız. Bu durumda bobin düzleminin $\\vec B$'ye dik olduğuna dikkat ediniz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Basit doğru akım motorda komütatörün, bobin uygun açıyı geçerken akım yönünü ters çevirerek torkun aynı dönme yönünü desteklemesini nasıl sağladığını açıklayınız.</div></div>"
    },
    {
      "id": "b0294",
      "heading": "Soru 5.13",
      "type": "activity",
      "html": "<p><strong>Soru 5.13</strong>\nBir elektromanyetik kapı tutucusunda elektromıknatıs, çelik bir karşı plakayı hava aralığı çok küçük olacak biçimde çeker. Basitleştirilmiş manyetik basınç modelinde\n$$F\\simeq \\frac{B^2A}{2\\mu_0}$$\nolsun.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bu bağıntının neden $F\\propto B^2$ ölçeklemesi verdiğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Doyumdan uzak bölgede yaklaşık $B\\propto I$ kabul edilirse çekim kuvvetini iki katına çıkarmak için akımın hangi katsayıyla değiştirilmesi gerektiğini bulunuz.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Gerçek sistemde hava aralığı, çekirdek doygunluğu ve ısınmanın bu basit ölçeklemeyi neden bozabileceğini açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Acil çıkış gerektiren bazı erişim denetimi tasarımlarında enerjinin kesilmesiyle kilidin serbest kalmasının neden tercih edilebileceğini açıklayınız.</div></div>"
    },
    {
      "id": "b0124",
      "heading": "Soru 5.14",
      "type": "assessment",
      "html": "<p><strong>Soru 5.14</strong>\nSayfa düzleminin içine doğru ($\\otimes$) yönlü düzgün bir manyetik alan vardır. Sayfa düzleminde, saat yönünün tersine dairesel bir akım ilmeği yerleştirilmiştir.</p>\n<p>İlmeğe etki eden <strong>net manyetik kuvvet</strong> aşağıdakilerden hangisidir?</p>\n<div class=\"choice-item\" data-choice=\"A\"><span class=\"choice-label\">A)</span><div class=\"choice-text\">Yukarı yönlü</div></div><div class=\"choice-item\" data-choice=\"B\"><span class=\"choice-label\">B)</span><div class=\"choice-text\">Aşağı yönlü</div></div><div class=\"choice-item\" data-choice=\"C\"><span class=\"choice-label\">C)</span><div class=\"choice-text\">Merkeze doğru (sıkıştırıcı)</div></div><div class=\"choice-item\" data-choice=\"D\"><span class=\"choice-label\">D)</span><div class=\"choice-text\">Merkezden dışa doğru (genişletici)</div></div><div class=\"choice-item\" data-choice=\"E\"><span class=\"choice-label\">E)</span><div class=\"choice-text\">Sıfır</div></div>"
    },
    {
      "id": "b0127",
      "heading": "Soru 5.15",
      "type": "assessment",
      "html": "<p><strong>Soru 5.15</strong>\nStatik manyetik alanda noktasal bir yük için $\\vec F_B=q\\vec v\\times\\vec B$ olduğundan $\\vec F_B\\cdot\\vec v=0$ ve manyetik kuvvetin anlık gücü sıfırdır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Kuvvet iş yapmadığı hâlde dairesel harekette merkezcil kuvvet görevini nasıl üstlenebilir?</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bir elektrik motorunda iletkenlere etki eden manyetik kuvvetler mekanik tork üretir. Motorun mekanik enerjisinin neden manyetik alanın “enerji vermesinden” değil, güç kaynağının elektriksel enerji sağlamasından geldiğini enerji akışı açısından açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">“Bir kuvvet iş yaparsa enerji korunumu ihlal edilir” ifadesinin neden yanlış olduğunu açıklayınız. Elektrik kuvvetinin iş yaptığı bir örnek vererek toplam enerji korunumu ile <strong>belirli bir kuvvetin yaptığı iş</strong> kavramlarını ayırınız.</div></div>"
    },
    {
      "id": "b0293",
      "heading": "Soru 5.16",
      "type": "assessment",
      "html": "<p><strong>Soru 5.16</strong></p>\n<p>Yarıçapı $R=3.0\\,\\mathrm{cm}$ olan tek sarımlı dairesel bir halkadan $I=5.0\\,\\mathrm{A}$ akım geçmektedir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Halkanın manyetik dipol momentinin büyüklüğünü hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Halka, $B=0.20\\,\\mathrm{T}$ düzgün alana, halka düzlemi alana paralel olacak biçimde yerleştirildiğinde torku bulunuz.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Halka serbest bırakıldığında dengeye hangi yönelimde ulaşmak ister? $U=-\\vec\\mu\\cdot\\vec B$ bağıntısıyla açıklayınız.</div></div>"
    },
    {
      "id": "b0299",
      "heading": "Soru 5.17",
      "type": "assessment",
      "html": "<p><strong>Soru 5.17</strong></p>\n<p>Bir doğru akım motorun rotor bobini $N=100$ sarım, alanı $A=0.010\\,\\mathrm{m^2}$, akımı $I=2.0\\,\\mathrm{A}$ ve alan büyüklüğü $B=0.50\\,\\mathrm{T}$ olsun. $\\theta$, bobinin manyetik dipol momenti $\\vec\\mu$ ile $\\vec B$ arasındaki açı olarak tanımlansın.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Maksimum torku hesaplayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">$\\theta=60^\\circ$ iken torku bulunuz.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Motor torkunun yönünü tersine çevirmek için akımın veya manyetik alanın yalnız birinin yönünün ters çevrilmesinin yeterli olduğunu; ikisinin birden ters çevrilmesinin tork yönünü değiştirmeyeceğini açıklayınız.</div></div>"
    },
    {
      "id": "rev-3-03",
      "heading": "İleri Düzey Soru 5.18",
      "type": "assessment",
      "html": "<p><strong>İleri Düzey Soru 5.18</strong> <span class=\"difficulty\">Orta</span> <span class=\"source-tag\">Kaynak temelli</span></p>Akım taşıyan dikdörtgen halka düzgün alana yerleştiriliyor. Net kuvvet sıfır iken torkun neden sıfır olmayabileceğini hesaplayınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"
    },
    {
      "id": "rev-3-06",
      "heading": "İleri Düzey Soru 5.19",
      "type": "assessment",
      "html": "<p><strong>İleri Düzey Soru 5.19</strong> <span class=\"difficulty\">Olimpiyat düzeyi</span> <span class=\"source-tag\">Kaynak temelli</span></p>Akım halkası düzgün olmayan alanda hem tork hem net kuvvet yaşıyor. Enerji U=-μ·B bağıntısından kuvveti türetiniz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"
    },
    {
      "id": "rev-3-08",
      "heading": "İleri Düzey Soru 5.20",
      "type": "assessment",
      "html": "<p><strong>İleri Düzey Soru 5.20</strong> <span class=\"difficulty\">Model eleştirisi</span> <span class=\"source-tag\">Kaynak temelli</span></p>Manyetik kuvvetin iş yapmadığı halde motorun mekanik enerji üretmesini devre enerjisi ve elektromanyetik tork üzerinden açıklayınız.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Model</span><div class=\"subquestion-text\">Kullandığınız fiziksel modeli, varsayımlarınızı ve seçtiğiniz koordinat yönünü açıkça belirtiniz.</div></div>"
    },
    {
      "id": "rev-act-3-02",
      "heading": "Etkinlik 5.21",
      "type": "activity",
      "html": "<p><strong>Etkinlik 5.21</strong> Basit bir bobin-mıknatıs düzeninde torkun akım ve sarım sayısıyla değişimini ölçerek motor modeline bağlayınız.</p><div class=\"subquestion-item\"><span class=\"subquestion-label\">Rapor</span><div class=\"subquestion-text\">Tablo, grafik, belirsizlik ve modelin geçerlilik aralığını birlikte veriniz.</div></div>"
    },
    {
      "id": "olymp-3-05",
      "heading": "Olimpiyat Sorusu 5.22",
      "type": "assessment",
      "html": "<p><strong>Olimpiyat Sorusu 5.22</strong> <span class=\"difficulty\">İleri</span> <span class=\"source-tag\">Purcell–Morin / Griffiths tarzı</span></p>Manyetik dipol düzgün alanda tork görmekte ancak öteleme yapmamaktadır. Alan büyüklüğü uzayda arttığında net kuvvetin neden ortaya çıktığını <em>U=−m·B</em> enerji bağıntısından türetiniz.<div class=\"subquestion-item\"><span class=\"subquestion-label\">Çözüm odağı</span><div class=\"subquestion-text\">Enerji gradyanı ile kuvveti ilişkilendirmek; düzgün alan ve gradyanlı alan ayrımı.</div></div>"
    },
    {
      "id": "b0333",
      "heading": "Soru 5.23",
      "type": "activity",
      "html": "<p><strong>Soru 5.23</strong></p>\n<p>Bir elektrik motoru fan yükünü sürmektedir. Basitleştirilmiş doğru akım motor modelinde uç gerilimi</p>\n<div>$$V=E_b+IR,\\qquad E_b=k_e\\omega$$</div>\n<p>olsun.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Rotor hızı arttığında geri EMK'nın ($E_b$) artmasının akımı nasıl sınırladığını açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Mekanik yük torku arttığında hızın geçici olarak düşmesi, geri EMK'nın azalması ve akımın artması arasındaki geri besleme zincirini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Fırçalı bir motorda komütasyon sırasında endüktif akımın aniden değişememesi nedeniyle kıvılcım oluşabilmesini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Fırçasız doğru akım (BLDC) motorda elektronik komütasyonun mekanik fırça kayıplarını ve bakım gereksinimini nasıl azaltabildiğini değerlendiriniz.</div></div>"
    },
    {
      "id": "b0335",
      "heading": "Soru 5.24",
      "type": "activity",
      "html": "<p><strong>Soru 5.24</strong></p>\n<p>Manyetik şeritli bir kartın verisi, yüksek tersleyici alan özelliğili veya düşük tersleyici alan özelliğili manyetik malzemede uzaysal mıknatıslanma desenleriyle kodlanır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Güçlü bir dış alanın bu desenleri yeniden yönlendirerek/üzerine yazarak veriyi bozabilmesini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">“Güçlü mıknatıs manyetik bölgeleri rastgele yapar” ifadesinin neden zorunlu olmadığını; dış alanın belirli bir yönde yeniden mıknatıslama da yapabileceğini açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Güvenli mesafenin yalnız $B\\propto r^{-3}$ ifadesinden belirlenemeyeceğini; mıknatıs geometrisi ve dipol momenti ile şeridin tersleyici alan özelliğisinin de gerektiğini değerlendiriniz.</div></div>\n<div class=\"subquestion-item\" data-part=\"d\"><span class=\"subquestion-label\">d)</span><div class=\"subquestion-text\">Yarı iletken bellekte tutulan çip verisinin statik bir mıknatısla manyetik bölge yeniden yönelmesi yoluyla silinmediğini; bununla birlikte temasız kart iletişiminin elektromanyetik kuplaj ve iletken ekranlama koşullarından etkilenebileceğini belirtiniz.</div></div>"
    },
    {
      "id": "b0207",
      "heading": "Soru 5.25",
      "type": "assessment",
      "html": "<p><strong>Soru 5.25</strong>\nEski tip şişe dinamolu bir bisiklette far yükü bağlandığında pedal çevirmek, açık devre durumuna göre belirgin biçimde daha zor olabilir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Devre açıkken indüklenen gerilim oluşabilmesine rağmen akımın çok küçük olmasının karşı elektromanyetik torku neden azalttığını açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Far bağlıyken mekanik güç girişinin elektriksel güce ve kayıplara dönüşmesini\n$$P_{mek}=\\tau\\omega\\approx P_{yük}+P_{kayıp}$$\nilişkisiyle açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Göbek dinamoların şişe dinamolara göre lastik-dinamo temas sürtünmesi ve kayma kayıplarını ortadan kaldırdığını; ancak rulman sürtünmesi, çekirdek kayıpları, cogging ve elektrik yüküne bağlı elektromanyetik direnç gibi kayıpların tamamen sıfır olmadığını değerlendiriniz.</div></div>"
    },
    {
      "id": "b0215",
      "heading": "Soru 5.26",
      "type": "assessment",

    {
      "id": "b0145",
      "heading": "Örnek 6.2",
      "type": "example",
      "html": "<h3>Örnek 6.2</h3>\n<p>Yarıçapı $R$ olan dairesel bir bölgede, sayfa düzleminden dışarı doğru ($+\\hat{k}$) düzgün bir manyetik alan zamanla doğrusal olarak artmaktadır:\n$$\\vec B(t)=\\beta t,\\hat{k}\\qquad (\\beta&gt;0).$$</p>\n<p>Manyetik alanın yalnızca bu dairesel bölgede var olduğu ideal modeli kullanınız.</p>\n<p>a) Bölgenin içinde ($r&lt;R$) ve dışında ($r&gt;R$), merkezden $r$ uzaklığındaki indüklenen elektrik alanının büyüklüğünü ve yönünü bulunuz.<br />\nb) Bu elektrik alanının korunumlu olmadığını gösteriniz.</p>\n<hr />\n<p>Silindirik simetri nedeniyle indüklenen elektrik alan çizgileri merkez etrafında eşmerkezli çemberlerdir. Pozitif dolaşım yönünü saat yönünün tersi seçelim.</p>\n<p><strong>$r&lt;R$ için:</strong>\n$$\\oint \\vec E_{ind}\\cdot d\\vec{\\ell}=-\\frac{d\\Phi_B}{dt}$$\n$$E_\\varphi(2\\pi r)=-\\frac{d}{dt}(\\beta t\\,\\pi r^2)=-\\beta\\pi r^2$$\n$$E_\\varphi=-\\frac{\\beta r}{2}.$$</p>\n<p>Dolayısıyla büyüklük\n$$|\\vec E_{ind}|=\\frac{\\beta r}{2}$$\nolur. Negatif işaret, seçtiğimiz pozitif dolaşım yönüne göre alanın <strong>saat yönünde</strong> olduğunu gösterir. Bu yön Lenz yasasıyla da uyumludur: indüklenen dolaşım, dışarı doğru artan manyetik akı değişimine karşı koyacak yöndedir.</p>\n<p><strong>$r&gt;R$ için:</strong>\nKapalı yol yalnızca $R$ yarıçaplı alan bölgesindeki akıyı sarar:\n$$E_\\varphi(2\\pi r)=-\\frac{d}{dt}(\\beta t\\,\\pi R^2)=-\\beta\\pi R^2,$$\n$$E_\\varphi=-\\frac{\\beta R^2}{2r}.$$</p>\n<p>Böylece\n$$|\\vec E_{ind}|=\\frac{\\beta R^2}{2r},$$\nve yön yine saat yönündedir.</p>\n<p><strong>b) Korunumlu olmama:</strong>\n$$\\oint \\vec E_{ind}\\cdot d\\vec{\\ell}=-\\frac{d\\Phi_B}{dt}\\neq0.$$\nBu nedenle indüklenen elektrik alan elektrostatik anlamda korunumlu değildir. Başka bir deyişle, alanın tamamı tek değerli bir elektrostatik skaler potansiyelin negatif gradyanı olarak yazılamaz; kapalı bir yol boyunca dolaşımı sıfır değildir.</p>"
    },
    {
      "id": "b0147",
      "heading": "Soru 6.2",
      "type": "yourturn",
      "html": "<p><strong>Soru 6.2</strong>\nYarıçapı $R$ olan dairesel bir bölgede, sayfa düzleminden dışarı doğru düzgün manyetik alan\n$$\\vec B(t)=\\beta t,\\hat{k}\\qquad(\\beta&gt;0)$$\nşeklinde doğrusal artmaktadır. Manyetik alanın yalnızca bu dairesel bölgede var olduğu ideal modeli kullanınız.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bölgenin içinde ($r&lt;R$) ve dışında ($r&gt;R$), merkezden $r$ uzaklığındaki indüklenen elektrik alanının ($E_{ind}$) büyüklüğünü ve yönünü bulunuz.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Bu elektrik alanının korunumlu olmadığını, kapalı bir yol boyunca dolaşımının sıfırdan farklı olduğunu gösteriniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Merkezden $r_0&lt;R$ uzaklıktaki bir noktaya durgun bir $+q$ yükü bırakılırsa, bırakıldığı andaki ivmesinin büyüklüğünü ve yönünü bulunuz. (Parçacığın ilk anda manyetik kuvvet görmediğini, çünkü $v=0$ olduğunu dikkate alınız.)</div></div>"
    },
    {
      "id": "b0149",
      "heading": "Örnek 6.3",
      "type": "example",
      "html": "<h3>Örnek 6.3</h3>\n<p>Manyetik raylı tren sistemlerinde, sürtünmesiz hareket sağlayan manyetik alanlar kullanılır. Ancak acil durumlarda treni yavaşlatmak için &quot;girdap akımlı frenler&quot; devreye girer.</p>\n<p>İki paralel iletken ray (aralarındaki mesafe $\\ell$), $R$ direnci ile birbirine bağlanmıştır. Sistem, düzgün $\\vec{B}$ manyetik alanı içindedir (sayfa düzlemine dik, $\\otimes$). Raylar üzerinde, sürtünmesiz hareket edebilen $m$ kütleli iletken bir çubuk vardır. Çubuğa $t=0$ anında $v_0$ hızı veriliyor.</p>\n<p>a) Çubuğun üzerindeki indüklenen EMK'yı ve devreden geçen akımı bulunuz.\nb) Çubuğa etki eden manyetik kuvvetin yönünü ve büyüklüğünü belirleyiniz.\nc) Çubuğun hızının zamanla nasıl değiştiğini gösteren diferansiyel denklemi kurunuz ve $v(t)$ ifadesini türetiniz.\nd) Çubuğun başlangıçtaki tüm kinetik enerjisinin ısıya dönüştüğü varsayıldığında, $R$ direncinde açığa çıkan toplam enerjiyi bulunuz.</p>\n<hr />\n<p><strong>a) hareket EMK'sı:</strong>\nÇubuk $v$ hızıyla hareket ederken, manyetik alan içindeki yükler Lorentz kuvvetine maruz kalır:\n$$\\varepsilon = B\\ell v$$\nOhm yasasından devreden geçen akım:\n$$I = \\frac{\\varepsilon}{R} = \\frac{B\\ell v}{R}$$</p>\n<p><strong>b) Lenz Yasası ve Kuvvet Yönü:</strong>\nÇubuk sağa doğru hareket ediyorsa, devrenin manyetik akısı artmaktadır. Lenz yasasına göre, indüklenen akım bu artışı engellemek için <strong>saat yönünün tersine</strong> dolaşmalıdır.</p>\n<p>Çubuktaki akım yukarı yönlüdür. Manyetik kuvvet $\\vec{F} = I(\\vec{\\ell} \\times \\vec{B})$:\n$$F_B = I\\ell B = \\frac{B^2 \\ell^2 v}{R}$$\nKuvvet <strong>hıza zıt yöndedir</strong> (frenleme kuvveti).</p>\n<p><strong>c) Diferansiyel Denklem ve $v(t)$:</strong>\nNewton'un ikinci yasası:\n$$m\\frac{dv}{dt} = -F_B = -\\frac{B^2 \\ell^2}{R} v$$\n$$\\frac{dv}{v} = -\\frac{B^2 \\ell^2}{mR} dt$$\nİntegral alırsak ($t=0$'da $v=v_0$):\n$$v(t) = v_0 , e^{-t/\\tau} \\quad \\text{burada} \\quad \\tau = \\frac{mR}{B^2 \\ell^2}$$</p>\n<p>Hız üstel olarak azalır. $\\tau$ zaman sabiti, sistemin &quot;frenleme karakteristiğini&quot; belirler.</p>\n<p><strong>d) Enerji Korunumu:</strong>\nBaşlangıçtaki kinetik enerji:\n$$K_0 = \\frac{1}{2}mv_0^2$$\nÇubuk durduğunda ($t \\to \\infty$), tüm kinetik enerji $R$ direncinde ısıya dönüşmüştür:\n$$E_{ısı} = \\int_0^\\infty I^2 R , dt = \\int_0^\\infty \\left(\\frac{B\\ell v}{R}\\right)^2 R , dt = \\frac{B^2 \\ell^2}{R} \\int_0^\\infty v_0^2 e^{-2t/\\tau} dt$$\n$$= \\frac{B^2 \\ell^2 v_0^2}{R} \\cdot \\frac{\\tau}{2} = \\frac{B^2 \\ell^2 v_0^2}{R} \\cdot \\frac{mR}{2B^2 \\ell^2} = \\frac{1}{2}mv_0^2$$</p>\n<p><strong>Enerji korunmuştur.</strong> Mekanik enerji, Joule ısısına dönüşmüştür.</p>"
    },

      "id": "b0151",
      "heading": "Soru 6.3",
      "type": "yourturn",
      "html": "<p><strong>Soru 6.3</strong>\nElektrikli bir araçta rejeneratif frenleme sırasında çekiş motoru jeneratör gibi çalışır ve aracın mekanik enerjisinin bir bölümünü elektrik enerjisine dönüştürür. Rejeneratif frenleme kabiliyeti; araç hızı, motor/jeneratör karakteristiği, güç elektroniği, bataryanın şarj durumu ve üreticinin kontrol stratejisine bağlıdır. Çok düşük hızlarda birçok sistem mekanik frenlere daha fazla görev verir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Basitleştirilmiş bir modelde, motorun dönme hızı araç hızıyla orantılı ve indüklenen karşı EMK $\\varepsilon\\propto\\omega$ ise, düşük hızlarda üretilebilen elektriksel güç ve frenleme etkisinin neden azalabileceğini açıklayınız.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Lenz yasasını kullanarak jeneratör akımının araç hareketine zıt yönde bir elektromanyetik tork oluşturduğunu açıklayınız.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Batarya tamamen doluysa veya izin verilen şarj gücü sınırlıysa rejeneratif frenleme torkunun neden azaltılabileceğini; fazla mekanik enerjinin hangi yollarla (mekanik frenler, uygun sistemlerde fren direnci vb.) uzaklaştırılabileceğini enerji korunumu açısından değerlendiriniz.</div></div>"

    {
      "id": "b0152",

r direnç bağlanırsa, diskin dönmesini sürdürmek için dışarıdan bir tork uygulanması gerekir mi? Gerekirse, bu torkun büyüklüğünü $\\omega, B, R$ ve devrenin toplam direnci $R_d$ cinsinden bulunuz.\nc) Enerji korunumunu kontrol ediniz: Mekanik güç ($\\tau\\omega$), elektrik gücüne ($\\varepsilon^2/R_d$) eşit mi?</p>\n<hr />\n<p><strong>a) İndüklenen EMK:</strong>\nDiski $dr$ kalınlığında eşmerkezli halkalara bölelim. Merkezden $r$ uzaklıktaki bir halka parçasının teğetsel hızı $v = \\omega r$'dir. Bu parça üzerindeki hareket EMK'sı:\n$$d\\varepsilon = B \\cdot v \\cdot dr = B(\\omega r)dr$$\nTüm disk boyunca (merkezden $R$ yarıçapına kadar) integral alınırsa:\n$$\\varepsilon = \\int_0^R B \\omega r , dr = B \\omega \\left[ \\frac{r^2}{2} \\right]_0^R = \\frac{1}{2} B \\omega R^2$$</p>\n<p><strong>b) Gerekli Tork:</strong>\nDevreden geçen akım $I = \\frac{\\varepsilon}{R_d}$ olur. Manyetik alan içindeki $dr$ uzunluğundaki iletken parçaya etki eden kuvvet $dF = I \\cdot dr \\cdot B$'dir. Bu kuvvetin merkeze göre oluşturduğu tork $d\\tau = r \\cdot dF = I B r , dr$'dir.\nToplam tork:\n$$\\tau = \\int_0^R I B r , dr = I B \\frac{R^2}{2}$$\n$I$ yerine konulursa:\n$$\\tau = \\frac{B^2 \\omega R^4}{4R_d}$$\nDiskin sabit $\\omega$ ile dönmeye devam etmesi için, bu manyetik frenleme torkunu dengeleyecek büyüklükte bir dış mekanik tork uygulanmalıdır.</p>\n<p><strong>c) Enerji Korunumu Kontrolü:</strong>\nMekanik güç: $P_{mek} = \\tau \\omega = \\frac{B^2 \\omega^2 R^4}{4R_d}$\nElektriksel güç (Joule ısınması): $P_{elek} = \\frac{\\varepsilon^2}{R_d} = \\frac{(\\frac{1}{2} B \\omega R^2)^2}{R_d} = \\frac{B^2 \\omega^2 R^4}{4R_d}$\nGörüldüğü gibi $P_{mek} = P_{elek}$. Mekanik iş, tam olarak devrede harcanan elektriksel enerjiye dönüşmüştür. Enerji korunumu sağlanmıştır.</p>"

      "html": "<p><strong>Soru 6.4</strong>\n$N$ sarımlı, her sarımının alanı $A$ olan bir bobin, düzgün $B$ manyetik alanında $\\omega$ açısal hızıyla döndürülmektedir. Bobinin iç direnci $r$, dışarı bağlanan saf dirençli yük ise $R_L$'dir. Bobinin özindüktansı ve diğer kayıpları bu modelde ihmal edilecektir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Manyetik akıdan başlayarak indüklenen EMK'nın\n$$\\varepsilon(t)=NBA\\omega\\sin(\\omega t)$$\nbiçiminde olduğunu ve\n$$\\varepsilon_{\\max}=NBA\\omega,\\qquad \\varepsilon_{\\mathrm{rms}}=\\frac{NBA\\omega}{\\sqrt2}$$\nsonuçlarını türetiniz.<br/></div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Yükte harcanan ortalama gücün\n$$P_L=\\frac{\\varepsilon_{\\mathrm{rms}}^2R_L}{(r+R_L)^2}$$\nolduğunu gösteriniz. $P_L$'nin maksimum olması için $R_L$ ile $r$ arasındaki ilişkiyi bulunuz.<br/></div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Maksimum güç aktarımı koşulunun <strong>maksimum verim</strong> koşuluyla aynı olmadığını gösteriniz. $R_L=r$ iken bu basit modelde üretilen elektrik gücünün yarısının iç dirençte, yarısının yükte harcandığını açıklayınız. Gerçek jeneratörlerde bakır, demir, mekanik ve güç elektroniği kayıplarının da bulunduğunu değerlendiriniz.</div></div>"
    },
    {
      "id": "b0156",
      "heading": "Örnek 6.5",
      "type": "example",
      "html": "<h3>Örnek 6.5</h3>\n<p>İdeal bir transformatörde $N_1=500$, $N_2=50$ ve $V_1=230$ V'tur. İkincil sargıya $R_L=11.5\\ \\Omega$ saf direnç bağlanmıştır. $V_2$, $I_2$ ve birincil akım $I_1$ değerlerini bulunuz.</p>\n<hr />\n<p>Gerilim oranı:\n$$\\frac{V_2}{V_1}=\\frac{N_2}{N_1}=\\frac{50}{500}=0.10,$$\n$$V_2=23.0\\ \\text{V}.$$\nYük akımı:\n$$I_2=\\frac{V_2}{R_L}=\\frac{23.0}{11.5}=2.0\\ \\text{A}.$$\nİdeal güç korunumu:\n$$V_1I_1=V_2I_2,$$\n$$I_1=\\frac{23.0\\times2.0}{230}=0.20\\ \\text{A}.$$</p>\n<p>Gerilim on kat azalırken akım ideal modelde on kat artmıştır. Gerçek transformatörde bakır, çekirdek ve kaçak akı kayıpları nedeniyle giriş ve çıkış güçleri tam eşit değildir.</p>"
    },
    {
      "id": "b0160",
      "heading": "Örnek 6.6",
      "type": "example",
      "html": "<h3>Örnek 6.6</h3>\n<p>$L=2.0$ H endüktanslı bir bobinden başlangıçta $I_0=3.0$ A akım geçmektedir. Kaynak devreden çıkarılıp bobin $R=6.0\\ \\Omega$ direnç üzerinden boşalmaya bırakılıyor. Başlangıçtaki manyetik enerjiyi, akımın ilk andaki değişim hızını ve devrenin zaman ölçeğini bulunuz.</p>\n<hr />\n<p>Depolanmış enerji:\n$$U_B=\\frac12LI_0^2=\\frac12(2.0)(3.0)^2=9.0\\ \\text{J}.$$\nKaynak yokken devre denklemi\n$$L\\frac{dI}{dt}+IR=0$$\nolduğundan ilk anda\n$$\\left.\\frac{dI}{dt}\\right|_{0}=-\\frac{I_0R}{L}\n=-\\frac{(3.0)(6.0)}{2.0}=-9.0\\ \\text{A/s}.$$\nKarakteristik zaman:\n$$\\tau=\\frac{L}{R}=\\frac{2.0}{6.0}\\approx0.333\\ \\text{s}.$$</p>\n<p>Eksi işareti akımın azaldığını söyler. Bu örnek tam $I(t)$ çözümünü vermeden, diferansiyel denklemin <strong>başlangıç eğimi, enerji ve zaman ölçeği</strong> ile nasıl okunacağını gösterir.</p>"
    },
    {
      "id": "curriculum-6-5",
      "heading": "KÖŞE TAŞI 6.2 — Hareketli iletken, dönen bobin ve alan değişimi",
      "type": "cornerstone",
      "html": "<h2>KÖŞE TAŞI 6.2 — Hareketli iletken, dönen bobin ve alan değişimi</h2><p>B alanında hızla hareket eden iletkende yükler Lorentz kuvvetiyle ayrılır ve uygun geometride ε=Bℓv oluşur.</p><div class=\"answer-formula\">Çubuk devreyi tamamlayan raylarla birlikteyse mekanik enerji elektrik enerjisine dönüşür.</div>\n<p>Dönen bobinde Φ=NBA cosωt ve ε=NBAω sinωt biçiminde sinüzoidal EMK oluşur.</p><div class=\"answer-formula\">Jeneratörün temelinde mekanik dönmenin elektriksel salınıma dönüşmesi vardır.</div>\n<p>Bu alt başlık, manyetizmanın temel kavramlarını fiziksel model ve ölçülebilir büyüklüklerle ilişkilendirir. Tanım, yön, birim ve geçerlilik koşulları birlikte değerlendirilmelidir.</p>"
    },
    {
      "id": "b0164",
      "heading": "Örnek 6.7",
      "type": "example",
      "html": "<h3>Örnek 6.7</h3>\n<p>İnce lamina ve düşük frekans yaklaşımında birim hacim girdap akımı kaybı\n$$\\frac{P_e}{V}\\propto\\frac{B_p^2f^2t^2}{\\rho}$$\nile ölçekleniyor. $B_p$, $f$ ve $\\rho$ sabitken lamina kalınlığı $t$ yarıya indirilirse kayıp nasıl değişir?</p>\n<hr />\n<p>Kayıp $t^2$ ile ölçeklendiğinden\n$$\\frac{P'_e}{P_e}=\\left(\\frac{t/2}{t}\\right)^2=\\frac14.$$\nYani bu model altında birim hacim kaybı dörtte bire düşer.</p>\n<p>Bu sonuç yalnızca belirtilen lamina/düşük-frekans modeli içindir. Yüksek frekans, deri etkisi, karmaşık geometri veya güçlü sıcaklık bağımlılığı varsa basit $t^2$ ölçeklemesi tek başına yeterli değildir.</p>"
    },
    {
      "id": "b0166",
      "heading": "Soru 6.5",
      "type": "yourturn",
      "html": "<p><strong>Soru 6.5</strong>\nİletken bir levhanın, karakteristik alanı $A$, kalınlığı $d$ ve özdirenci $\\rho$ olsun. Levha karakteristik büyüklüğü $B$ olan düzgün olmayan bir manyetik alan bölgesinden $v$ hızıyla geçmektedir. Basit bir geometri için fren kuvvetinin\n$$F\\sim C\\frac{B^2 v A d}{\\rho}$$\nşeklinde ölçeklendiği kabul edilsin; $C$ boyutsuz bir geometri katsayısıdır.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Bu ifadenin boyutsal olarak kuvvet verdiğini doğrulayınız. <strong>Boyut analizinin tek başına bu özel bağıntıyı benzersiz biçimde türetemeyeceğini</strong> açıklayınız.</div></div><div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Model geçerli olduğu düşük hızda ve deri etkisinin (deri etkisi) zayıf olduğu rejimde $B$, $v$, $d$ ve $\\rho$ değişimlerinin fren kuvvetine etkisini yorumlayınız.</div></div><div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">Gerçek girdap akımlı frenlerde yüksek hız ve yüksek frekansta deri etkisi, alan geometrisi ve ısınmanın neden bu basit doğrusal ölçeklemeyi bozabileceğini değerlendiriniz.</div></div>"

      "heading": "Soru 6.9",
      "type": "activity",
      "html": "<p><strong>Soru 6.9</strong></p>\n<p>Bazı rüzgâr türbini jeneratörlerinde neodimyum-demir-bor (NdFeB) kalıcı mıknatıslar kullanılır. Rotor döndüğünde stator sargılarından geçen manyetik akı zamanla değişir.</p>\n<div class=\"subquestion-item\" data-part=\"a\"><span class=\"subquestion-label\">a)</span><div class=\"subquestion-text\">Rotor hareketinin stator sargılarında nasıl EMK oluşturduğunu açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"b\"><span class=\"subquestion-label\">b)</span><div class=\"subquestion-text\">Rotor durduğunda, kalıcı mıknatısların alanı varlığını sürdürse bile neden sürekli jeneratör EMK'sı oluşmadığını açıklayınız.</div></div>\n<div class=\"subquestion-item\" data-part=\"c\"><span class=\"subquestion-label\">c)</span><div class=\"subquestion-text\">NdFeB mıknatısların Curie sıcaklığının birkaç yüz derece büyüklük düzeyinde olmasına karşın, izin verilen sürekli çalışma sıcaklığının mıknatıs sınıfına göre Curie sıcaklığından çok daha düşük olabileceğini açıklayınız. Aşırı ısınmanın geri dönüşlü ve geri dönüşsüz mıknatıslanma kaybına nasıl yol açabileceğini değerlendiriniz.</div></div>"

    {
      "id": "curriculum-6-8",
      "heading": "KÖŞE TAŞI 6.3 — İndüksiyonda enerji, Foucault akımları ve dönüşüm",

      "html": "<h2>KÖŞE TAŞI 6.3 — İndüksiyonda enerji, Foucault akımları ve dönüşüm</h2><p>Bobinde depolanan enerji U=½LI²’dir. Akım yükselirken kaynak enerjisinin bir bölümü manyetik alanda depolanır.</p><div class=\"answer-formula\">Devre açılırken bu enerji yüksek gerilim darbesine dönüşebileceğinden koruma elemanı gerekir.</div>\n<p>Değişen akı iletkenin içinde kapalı girdap akımları oluşturur. Bu akımlar ısı üretir ve hareketi Lenz yasasına uygun biçimde sönümler.</p><div class=\"answer-formula\">Laminasyon, girdap akımı kayıplarını azaltmak için nüveyi yalıtılmış ince tabakalara böler.</div>"
